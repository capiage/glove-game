                if (this.x < map.leftWall) { this.x = map.leftWall; this.vx *= -0.5; }
                if (this.x > map.rightWall) { this.x = map.rightWall; this.vx *= -0.5; }
            }

            // Blast Zones (Death pits)
            if (this.y > H + 1200 || this.x < -1500 || this.x > W + 1500) {
                if (this.hp > 0 || this.stocks > 1) {
                    if (this.respawning === 0) {
                        this.hp = 0;
                        this.vx = 0; this.vy = 0;
                        screenShake = 30;
                        let clampX = window.camera ? window.camera.x : W/2;
                        let clampY = window.camera ? window.camera.y : H/2;
                        spawnText(clampX, clampY, "BLASTED!", "#ef4444", true, 3.0);
                        spawnParticles(clampX, clampY, '#facc15', 50, 4.0);
                        
                        if (window.currentMap && window.currentMap.type === 'smash' && this.stocks > 1) {
                            this.respawning = 120;
                            this.changeState(ST_KNOCKDOWN, 999);
                        } else {
                            this.stocks = 0;
                            this.handleDeath();
                        }
                    }
                }
            }
        }

        updateAnimation(isMenuPreview = false) {
            this.resetTargets();
            let isGrounded = isMenuPreview || this.getIsGrounded();
            
            let targetSway = (this.state === ST_DODGE) ? -this.facing * 0.35 : 0;
            this.swayAmount += (targetSway - this.swayAmount) * 0.4;
            
            this.targetDuck = 0; 
            let targetRotation = 0;
            let targetGroundOffset = 0;

            if (this.state === ST_PARRY) {
                this.gloveL.targetX = this.facing * 25; this.gloveL.targetY = -130;
                this.gloveR.targetX = this.facing * 35; this.gloveR.targetY = -90;
            } else if (this.state === ST_BLOCK) {
                this.gloveL.targetX = this.facing * 10; this.gloveL.targetY = -120;
                this.gloveR.targetX = this.facing * 5; this.gloveR.targetY = -100;
            } else if (ATTACK_DATA[this.state]) {
                const data = ATTACK_DATA[this.state];
                const totalDur = data.windup + data.active + data.recov;
                const elapsed = totalDur - this.stateTimer;
                
                let ext = 0;
                if (elapsed < data.windup) { ext = -25; } 
                else if (elapsed < data.windup + data.active) { ext = data.reach + 10; } 
                else { ext = data.reach * (this.stateTimer / data.recov); }

                if (this.state === ST_P_JAB || this.state === ST_AERIAL_PUNCH) { this.gloveL.targetX = this.facing * ext; this.gloveL.targetY = -115; } 
                else if (this.state === ST_P_CROSS) { this.gloveR.targetX = this.facing * ext; this.gloveR.targetY = -105; targetRotation = this.facing * 0.15; } 
                else if (this.state === ST_P_HOOK) {
                    this.gloveL.targetX = this.facing * ext; this.gloveL.targetY = -90;
                    if(elapsed < data.windup) { this.gloveL.targetY += 40; targetRotation = -this.facing * 0.2; } 
                    else if(elapsed < data.windup + data.active) { this.gloveL.targetY -= 30; targetRotation = this.facing * 0.2; } 
                } else if (this.state === ST_P_UPPERCUT) {
                    this.gloveR.targetX = this.facing * (ext * 0.5);
                    this.gloveR.targetY = -105 - (ext * 1.2); 
                    if(elapsed < data.windup) { this.gloveR.targetY += 40; this.gloveR.targetX -= this.facing*20; targetRotation = -this.facing * 0.15; }
                    else { targetRotation = this.facing * 0.1; }
                    this.targetDuck = elapsed < data.windup ? 20 : -5; 
                } else if (this.state === ST_KNEE) {
                    this.footL.targetX = this.facing * ext; this.footL.targetY = -50;
                    this.gloveL.targetY = -65; this.gloveR.targetY = -65; 
                    if (elapsed < data.windup) { targetRotation = -this.facing * 0.1; }
                } else if (this.state === ST_KICK || this.state === ST_AERIAL_KICK) {
                    this.footL.targetX = this.facing * ext; this.footL.targetY = (this.state === ST_AERIAL_KICK) ? 25 : -55;
                    this.gloveL.targetX = -this.facing * 25; 
                    targetRotation = -this.facing * 0.2; 
                    if (elapsed < data.windup) targetRotation = -this.facing * 0.3; 
                }
            } else if (this.state === ST_HITSTUN) {
                targetRotation = -this.facing * 0.15;
                this.gloveL.targetY = -55; this.gloveR.targetY = -55;
            } else if (this.state === ST_KNOCKDOWN) {
                if (!isGrounded) {
                    // Kinetic Ragdoll: Limbs drag behind velocity
                    let dragX = -this.vx * 3;
                    let dragY = -this.vy * 3;
                    this.gloveL.targetX = dragX - 20 * this.facing; this.gloveL.targetY = dragY - 100;
                    this.gloveR.targetX = dragX + 20 * this.facing; this.gloveR.targetY = dragY - 120;
                    this.footL.targetX = dragX - 10; this.footL.targetY = dragY - 20;
                    this.footR.targetX = dragX + 10; this.footR.targetY = dragY - 40;
                    this.headOffset.y += dragY * 0.1;
                    this.headOffset.x += dragX * 0.1;
                } else {
                    targetGroundOffset = 40;
                    this.gloveL.targetX = 50; this.gloveL.targetY = -10;
                    this.gloveR.targetX = -50; this.gloveR.targetY = 10;
                    this.footL.targetX = 40; this.footL.targetY = 20;
                    this.footR.targetX = -40; this.footR.targetY = 10;
                }
            } else if (this.state === ST_DODGE) {
                this.gloveL.targetX = this.facing * 10; this.gloveL.targetY = -80;
                this.gloveR.targetX = this.facing * 5;  this.gloveR.targetY = -70;
            } else if (this.state === ST_SUPLEX) {
                const elapsed = 90 - this.stateTimer;
                if (elapsed < 20) {
                    this.gloveL.targetX = this.facing * 40; this.gloveL.targetY = -90;
                    this.gloveR.targetX = this.facing * 40; this.gloveR.targetY = -90;
                    this.targetDuck = 20;
                } else if (elapsed < 50) {
                    let prog = (elapsed - 20) / 30;
                    targetRotation = -this.facing * (Math.PI * 0.6) * prog;
                    this.gloveL.targetX = this.facing * 10; this.gloveL.targetY = -150;
                    this.gloveR.targetX = this.facing * 10; this.gloveR.targetY = -150;
                    this.targetDuck = 10;
                } else {
                    targetRotation = -this.facing * (Math.PI * 0.6); 
                    if (elapsed > 70) {
                        targetRotation *= (90 - elapsed) / 20; // Recover to standing
                    }
                }
            } else if (this.state === ST_BEING_SUPLEXED) {
                const elapsed = 90 - this.stateTimer;
                if (elapsed < 20) {
                    this.gloveL.targetY = -30; this.gloveR.targetY = -30;
                } else if (elapsed < 50) {
                    targetRotation = Math.PI * 0.8 * -this.facing; // Invert over suplexer
                    this.gloveL.targetY = -150; this.gloveR.targetY = -150; 
                } else {
                    targetRotation = Math.PI * -this.facing; 
                    targetGroundOffset = 40;
                }
            } else if (this.state === ST_TAUNT) {
                const elapsed = 120 - this.stateTimer;
                if (this.currentTaunt === 0) { // T-Pose
                    this.gloveL.targetX = -this.facing * 75; this.gloveL.targetY = -110;
                    this.gloveR.targetX = this.facing * 75; this.gloveR.targetY = -110;
                    this.footL.targetY = -35; this.footR.targetY = -35;
                    targetGroundOffset = -60;
                    targetRotation = 0;
                    this.targetDuck = 0;
                    
                    if (Math.random() < 0.35) {
                        addParticle(this.x + (Math.random()-0.5)*120, this.y - Math.random()*150, 0, -1 - Math.random()*2, '#06b6d4', 1.0, 0.02, 4 + Math.random()*3, 0);
                        addParticle(this.x + (Math.random()-0.5)*120, this.y - Math.random()*150, 0, -1 - Math.random()*2, '#c084fc', 1.0, 0.02, 2 + Math.random()*2, 0);
                    }
                } else if (this.currentTaunt === 1) { // Power Up
                    this.gloveL.targetX = this.facing * 15; this.gloveL.targetY = -60;
                    this.gloveR.targetX = -this.facing * 5; this.gloveR.targetY = -65;
                    this.targetDuck = 30;
                    targetRotation = this.facing * 0.15;
                    
                    this.headOffset.x += (Math.random() - 0.5) * 5;
                    this.headOffset.y += (Math.random() - 0.5) * 5;
                    targetGroundOffset = (Math.random() - 0.5) * 3;
                    
                    if (Math.random() < 0.85) {
                        addParticle(this.x + (Math.random()-0.5)*80, this.y, (Math.random()-0.5)*1.5, -5 - Math.random()*8, '#f59e0b', 1.0, 0.03, 5 + Math.random()*5, -0.2);
                        addParticle(this.x + (Math.random()-0.5)*60, this.y, (Math.random()-0.5)*1, -7 - Math.random()*6, '#fef08a', 1.0, 0.04, 3 + Math.random()*4, -0.3);
                    }
                } else if (this.currentTaunt === 2) { // Praise
                    targetRotation = -this.facing * 0.2;
                    this.targetDuck = -5;
                    this.gloveL.targetX = -this.facing * 35; this.gloveL.targetY = -180;
                    this.gloveR.targetX = this.facing * 35; this.gloveR.targetY = -180;
                    this.headOffset.y -= 5;
                    
                    if (Math.random() < 0.5) {
                        addParticle(this.x + (Math.random()-0.5)*180, this.y - 250 - Math.random()*50, 0, 2 + Math.random()*3, '#fef08a', 1.0, 0.015, 4 + Math.random()*3, 0);
                    }
                } else if (this.currentTaunt === 3) { // Menacing Point
                    targetRotation = -this.facing * 0.25;
                    this.targetDuck = 15;
                    
                    this.footL.targetX = -this.facing * 35; 
                    this.footR.targetX = this.facing * 35;
                    
                    this.gloveL.targetX = this.facing * 85; this.gloveL.targetY = -100;
                    this.gloveR.targetX = this.facing * 10; this.gloveR.targetY = -145;
                    
                    if (elapsed % 15 === 0 && Math.random() < 0.8) {
                        spawnText(this.x + (Math.random()-0.5)*160, this.y - 80 - Math.random()*120, "ゴ", "#a855f7", true, 1.2);
                    }
                }
            }

            if (!isGrounded && this.state !== ST_KNOCKDOWN && !ATTACK_DATA[this.state] && this.state !== ST_BEING_SUPLEXED) {
                this.footL.targetY = -25; this.footR.targetY = -15; 
                this.gloveL.targetY = -140; this.gloveR.targetY = -130; 
            } else if (this.state === ST_MOVE) {
                let stride = Math.sin(Date.now()/70) * 25;
                this.footL.targetX = -stride; this.footR.targetX = stride;
                this.footL.targetY = Math.max(0, stride > 0 ? -20 : 0); this.footR.targetY = Math.max(0, stride < 0 ? -20 : 0);
            }

            this.duckAmount += (this.targetDuck - this.duckAmount) * 0.3;

            if (this.state !== ST_HITSTUN && this.state !== ST_KNOCKDOWN) {
                let baseHeadY = -this.height + 15 + this.duckAmount;
                if (isGrounded && (this.state === ST_IDLE || this.state === ST_MOVE)) {
                    baseHeadY += Math.sin(Date.now() / 100) * 5;
                    this.gloveL.targetY += Math.sin(Date.now() / 100 + 1) * 5; 
                    this.gloveR.targetY += Math.sin(Date.now() / 100 + 2) * 5;
                }
                this.headOffset.x += (0 - this.headOffset.x) * 0.3;
                this.headOffset.y += (baseHeadY - this.headOffset.y) * 0.5; 
            } else if (this.state === ST_HITSTUN) {
                this.headOffset.x = -this.facing * 25; 
            }

            this.gloveL.x += (this.gloveL.targetX - this.gloveL.x) * 0.5; this.gloveL.y += (this.gloveL.targetY - this.gloveL.y) * 0.5;
            this.gloveR.x += (this.gloveR.targetX - this.gloveR.x) * 0.5; this.gloveR.y += (this.gloveR.targetY - this.gloveR.y) * 0.5;
            this.footL.x += (this.footL.targetX - this.footL.x) * 0.4; this.footL.y += (this.footL.targetY - this.footL.y) * 0.4;
            this.footR.x += (this.footR.targetX - this.footR.x) * 0.4; this.footR.y += (this.footR.targetY - this.footR.y) * 0.4;
            
            if (this.state !== ST_KNOCKDOWN) {
                this.rotation += (targetRotation - this.rotation) * 0.3;
            }
            this.groundOffset += (targetGroundOffset - this.groundOffset) * 0.3;
        }

        draw(ctx, customGroundY = null) {
            ctx.save();
            
            if (this.respawning > 0) { ctx.restore(); return; } // Don't draw if respawning
            
            let isInvuln = this.invincible > 0 || this.isInvincibleSync;
            if (isInvuln) {
                if (Math.floor(Date.now() / 100) % 2 === 0) ctx.globalAlpha = 0.4;
            }

            let renderY = customGroundY !== null ? this.y - (GROUND_Y - customGroundY) : this.y;
            
            // Dynamic drop shadow calculated on active floor
            let shadowY = window.currentMap ? window.currentMap.stage.y : GROUND_Y;
            if (window.currentMap) {
                let foundFloor = Infinity;
                if (this.x >= window.currentMap.stage.x && this.x <= window.currentMap.stage.x + window.currentMap.stage.w) {
                    foundFloor = window.currentMap.stage.y;
                }
                window.currentMap.platforms.forEach(p => {
                     if (this.x >= p.x && this.x <= p.x + p.w && p.y >= this.y - 1) {
                         if (p.y < foundFloor) foundFloor = p.y;
                     }
                });
                if (foundFloor !== Infinity) shadowY = foundFloor;
            }
            if (customGroundY !== null) shadowY = customGroundY;

            ctx.save();
            ctx.translate(this.x, shadowY);
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.beginPath();
            let shadowWidth = (this.state === ST_KNOCKDOWN) ? 70 : Math.max(15, 40 - (shadowY - renderY)*0.2);
            ctx.ellipse(0, 0, shadowWidth, 10, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            ctx.translate(this.x, renderY);

            // Invincibility Shield Aura
            if (isInvuln) {
                ctx.beginPath(); ctx.arc(0, -this.height/2, 100, 0, Math.PI*2);
                ctx.strokeStyle = this.color; ctx.lineWidth = 4;
                ctx.stroke();
            }

            if (Math.abs(this.rotation) > 0.01 || this.groundOffset > 0.1 || Math.abs(this.swayAmount) > 0.01) { 
                ctx.rotate(this.rotation + this.swayAmount); 
                ctx.translate(0, this.groundOffset); 
            }

            if (this.tauntCooldown > 0) {
                ctx.save();
                ctx.translate(0, -this.height - 55 + this.duckAmount);
                let barWidth = 40;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(-barWidth/2, 0, barWidth, 6);
                ctx.fillStyle = '#a855f7'; 
                ctx.fillRect(-barWidth/2, 0, barWidth * (this.tauntCooldown / 900), 6);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.strokeRect(-barWidth/2, 0, barWidth, 6);
                
                ctx.fillStyle = '#a855f7'; ctx.font = "900 10px Oswald"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
                ctx.fillText("TAUNT CD", 0, -2);
                ctx.restore();
            }

            if (this.feintCooldown > 0) {
                ctx.save();
                ctx.translate(0, -this.height - 40 + this.duckAmount);
                let barWidth = 40;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(-barWidth/2, 0, barWidth, 6);
                ctx.fillStyle = '#cbd5e1'; 
                ctx.fillRect(-barWidth/2, 0, barWidth * (this.feintCooldown / 120), 6);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.strokeRect(-barWidth/2, 0, barWidth, 6);
                
                ctx.fillStyle = '#cbd5e1'; ctx.font = "900 10px Oswald"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
                ctx.fillText("FEINT CD", 0, -2);
                ctx.restore();
            }

            if (this.state === ST_PARRY) {
                ctx.beginPath(); ctx.arc(this.gloveL.x, this.gloveL.y, 40 + Math.sin(Date.now()/15)*10, 0, Math.PI*2);
                ctx.arc(this.gloveR.x, this.gloveR.y, 40 + Math.sin(Date.now()/15)*10, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(96, 165, 250, 0.5)'; ctx.fill();
                ctx.strokeStyle = 'rgba(147, 197, 253, 1)'; ctx.lineWidth = 5; ctx.stroke();
            }

            // Legs
            ctx.strokeStyle = '#111'; ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-6, -55); ctx.lineTo(this.footL.x, this.footL.y); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(6, -55); ctx.lineTo(this.footR.x, this.footR.y); ctx.stroke();  

            // Accessory: Gold Chain
            if (this.profile.accessory === 'goldchain') {
                let neckY = this.headOffset.y + 15; 
                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(-12, neckY);
                ctx.lineTo(0, neckY + 22);
                ctx.lineTo(12, neckY);
                ctx.stroke();
                
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(-6, neckY + 18, 12, 14);
                ctx.fillStyle = '#fef08a'; 
                ctx.fillRect(-2, neckY + 20, 4, 4);
            }

            // Body
            let bodyGrad = ctx.createLinearGradient(-15, -this.height, 15, 0);
            bodyGrad.addColorStop(0, this.color); bodyGrad.addColorStop(1, '#050505');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.roundRect(-18, -this.height + 25 + this.duckAmount, 36, this.height - 75 - this.duckAmount, 12); ctx.fill();
            
            // Trunks/Waist
            ctx.fillStyle = ['#1e3a8a', '#7f1d1d', '#065f46', '#a16207'][this.index % 4]; 
            ctx.beginPath(); ctx.roundRect(-20, -65, 40, 25, 6); ctx.fill();
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(-20, -65, 40, 6); 

            // Back Arm
            ctx.strokeStyle = ['#93c5fd', '#fca5a5', '#6ee7b7', '#fde047'][this.index % 4]; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(-6, -this.height + 40 + this.duckAmount); ctx.lineTo(this.gloveR.x, this.gloveR.y); ctx.stroke();
            
            // Head
            ctx.fillStyle = '#fecaca'; ctx.beginPath(); ctx.arc(this.headOffset.x, this.headOffset.y, 22, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(this.headOffset.x - this.facing*7, this.headOffset.y + 2, 18, 0, Math.PI*2); ctx.fill();
            
            // Accessory: Sunglasses
            if (this.profile.accessory === 'sunglasses') {
                let eyeY = this.headOffset.y - 4;
                let eyeX = this.headOffset.x + (this.facing * 6);
                
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.moveTo(eyeX - (this.facing * 14), eyeY - 4);
                ctx.lineTo(eyeX + (this.facing * 14), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 10), eyeY + 8);
                ctx.lineTo(eyeX - (this.facing * 10), eyeY + 6);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.moveTo(eyeX + (this.facing * 2), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 8), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 6), eyeY + 6);
                ctx.lineTo(eyeX + (this.facing * 0), eyeY + 6);
                ctx.fill();
            }

            // Headgear
            if (this.profile.hat === 'kippah') {
                ctx.fillStyle = '#0f172a';
                let kx = this.headOffset.x - (this.facing * 10);
                let ky = this.headOffset.y - 15;
                ctx.beginPath();
                ctx.ellipse(kx, ky, 12, 14, this.facing * 0.5, Math.PI, 0); 
                ctx.fill();
            } else if (this.profile.hat === 'widebrim') {
                ctx.fillStyle = '#0a0a0a';
                let wx = this.headOffset.x;
                let wy = this.headOffset.y - 18;
                ctx.beginPath(); ctx.ellipse(wx, wy, 42, 6, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.roundRect(wx - 16, wy - 16, 32, 16, 2); ctx.fill();
            }

            // Front Arm
            ctx.strokeStyle = ['#93c5fd', '#fca5a5', '#6ee7b7', '#fde047'][this.index % 4]; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(6, -this.height + 40 + this.duckAmount); ctx.lineTo(this.gloveL.x, this.gloveL.y); ctx.stroke();

            // Gloves with glowing drop shadow
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 10;
            let darkCol = ['#2563eb', '#dc2828', '#059669', '#ca8a04'][this.index % 4];
            let lightCol = ['#3b82f6', '#ef4444', '#10b981', '#eab308'][this.index % 4];
            
            ctx.fillStyle = darkCol; ctx.beginPath(); ctx.arc(this.gloveR.x, this.gloveR.y, 16, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = lightCol; ctx.beginPath(); ctx.arc(this.gloveL.x, this.gloveL.y, 18, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(this.gloveL.x + this.facing*6, this.gloveL.y - 6, 6, 0, Math.PI*2); ctx.fill();

            // Guard Break Signifier
            if (ATTACK_DATA[this.state] && ATTACK_DATA[this.state].guardBreak) {
                const data = ATTACK_DATA[this.state];
                const elapsed = (data.windup + data.active + data.recov) - this.stateTimer;
                if (elapsed < data.windup) {
                    let progress = elapsed / data.windup; 
                    ctx.save(); ctx.translate(0, -this.height - 60); 
                    let scale = 1.0 + Math.sin(progress * Math.PI) * 0.8; ctx.scale(scale, scale);
                    ctx.fillStyle = `rgba(255, 50, 50, ${Math.sin(progress * Math.PI)})`;
                    ctx.font = "900 65px 'Yu Mincho', 'MS Mincho', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 30; ctx.fillText("危", 0, 0); 
                    
                    ctx.beginPath(); ctx.arc(0, 0, 40 * progress, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(255, 0, 0, ${1 - progress})`; ctx.lineWidth = 5; ctx.stroke();
                    ctx.restore();
                }
            }
            
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }
    }

    function processCPU(cpuIndex) {
        let f = window.fighters[cpuIndex];
        if (!matchActive || f.state === ST_KNOCKDOWN || f.hp <= 0 || f.respawning > 0) return {};
        
        let inputs = { left:false, right:false, block:false, dash:false, jump:false, jab:false, cross:false, hook:false, uppercut:false, knee:false, kick:false, taunt:false };
        
        // AI Platform Recovery Logic
        if (window.currentMap.type === 'smash') {
            let stageCenter = window.currentMap.stage.x + window.currentMap.stage.w / 2;
            if (!f.getIsGrounded() && f.y > window.currentMap.stage.y + 50) {
                inputs[f.x < stageCenter ? 'right' : 'left'] = true;
                
                // CPU uses double jump logic
                if (Math.random() < 0.3) inputs.jump = true;
                
                // CPU uses air dash recovery if far away horizontally
                if (f.stamina > 25 && Math.abs(f.x - stageCenter) > 400 && Math.random() < 0.15) inputs.dash = true; 
                
                cpuReactionTimers[cpuIndex] = 3; // Fast reaction while off-stage
                return inputs;
            }
        }

        cpuReactionTimers[cpuIndex]--;
        if (cpuReactionTimers[cpuIndex] > 0) return inputs; 
        
        cpuReactionTimers[cpuIndex] = 10 + Math.random() * 20; 
        
        let closest = null; let minDist = Infinity;
        window.fighters.forEach((e, i) => {
            if (i !== cpuIndex && (e.hp > 0 || e.respawning > 0)) {
                let d = Math.abs(e.x - f.x);
                if (d < minDist) { minDist = d; closest = e; }
            }
        });

        if (!closest) return inputs;

        let isAttacking = closest.hitboxActive || (ATTACK_DATA[closest.state] && closest.stateTimer > ATTACK_DATA[closest.state].recov);
        let movingAway = closest.x > f.x ? 'left' : 'right';
        let movingToward = closest.x > f.x ? 'right' : 'left';

        if (isAttacking && f.stamina > 20) {
            if (Math.random() < 0.6) { inputs.block = true; cpuReactionTimers[cpuIndex] = 25; return inputs; }
            else if (Math.random() < 0.4) { inputs.dash = true; return inputs; }
        }
        
        if (f.stamina < 50 && !isAttacking) {
            inputs[movingAway] = true;
            if(Math.random() < 0.1) inputs.dash = true;
            cpuReactionTimers[cpuIndex] = 15; return inputs;
        }

        if (minDist > 180) {
            inputs[movingToward] = true;
            if (Math.random() < 0.2 && f.stamina > 20) inputs.dash = true; 
            if (Math.random() < 0.2) inputs.jump = true; 
            if (Math.random() < 0.02) inputs.taunt = true;
            cpuReactionTimers[cpuIndex] = 15; 
        } else {
            if (Math.random() < 0.8 && f.stamina >= 20) {
                let rand = Math.random();
                if (closest.y < f.y - 30 && minDist < 120 && Math.random() < 0.7) inputs.uppercut = true; 
                else {
                    if (rand < 0.20) inputs.jab = true; else if (rand < 0.40) inputs.cross = true; 
                    else if (rand < 0.55) inputs.hook = true; else if (rand < 0.70) inputs.uppercut = true; 
                    else if (rand < 0.85) inputs.knee = true; else if (rand < 0.95) inputs.kick = true; 
                }
                cpuReactionTimers[cpuIndex] = 35; 
            } else {
                if (Math.random() < 0.5) inputs[movingAway] = true; else inputs[movingToward] = true;
                cpuReactionTimers[cpuIndex] = 15;
            }
        }
        return inputs;
    }

                // Ignore, handled by checkRematch

    function updateCamera() {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let activeFighters = window.fighters.filter(f => f.hp > 0 || f.respawning > 0 || (f.state === ST_KNOCKDOWN && f.y < H + 500));
        
        if (activeFighters.length === 0) activeFighters = window.fighters; 

        activeFighters.forEach(f => {
            minX = Math.min(minX, f.x);
            maxX = Math.max(maxX, f.x);
            minY = Math.min(minY, f.y - f.height);
            maxY = Math.max(maxY, f.y);
        });

        // Add map stage boundaries so camera doesn't zoom too wildly
        if (window.currentMap && window.currentMap.type === 'smash') {
            minX = Math.min(minX, window.currentMap.stage.x - 200);
            maxX = Math.max(maxX, window.currentMap.stage.x + window.currentMap.stage.w + 200);
            minY = Math.min(minY, window.currentMap.stage.y - 800);
            maxY = Math.max(maxY, window.currentMap.stage.y + 300);
        }

        let cx = (minX + maxX) / 2;
        let cy = (minY + maxY) / 2;

        let paddingX = 800;
        let paddingY = 600;
        let targetW = (maxX - minX) + paddingX;
        let targetH = (maxY - minY) + paddingY;

        let scaleX = W / targetW;
        let scaleY = H / targetH;
        let targetScale = Math.min(scaleX, scaleY, 1.2);
        targetScale = Math.max(targetScale, 0.4); 

        if (window.currentMap && window.currentMap.type === 'boxing') {
            targetScale = Math.max(targetScale, 0.85);
            cy = Math.min(cy, GROUND_Y - 150);
        }

        window.camera.x += (cx - window.camera.x) * 0.05;
        window.camera.y += (cy - window.camera.y) * 0.05;
        window.camera.scale += (targetScale - window.camera.scale) * 0.04;
    }

    function gameLoop(timestamp) {
        if (!gameStarted) return;
        requestAnimationFrame(gameLoop);
        
        if (!lastLoopTime) lastLoopTime = timestamp;
        const dt = timestamp - lastLoopTime;
        if (dt < 16) return; 
        lastLoopTime = timestamp - (dt % 16); 
        
        if (matchActive) {
            gameTimer -= 1/60; 
            checkGameOver();

            // Handle Moving Platforms
            if (window.currentMap && window.currentMap.platforms) {
                window.currentMap.platforms.forEach(p => {
                    if (p.vx) {
                        p.x += p.vx;
                        if (p.x < p.minX || p.x > p.maxX) p.vx *= -1;
                    }
                });
            }

            // Handle Background Parallax Elements
            if (window.bgEntities) {
                window.bgEntities.forEach(ent => {
                    ent.y -= 0.5 / ent.z; // Float upwards
                    if (ent.y < -H * 2) ent.y = H * 2;
                });
            }
        }

        let myLogical = getLogicalInputs(keysDown, KEYS_P1);

        if (gameMode === 'online') {
            let strMyLogical = JSON.stringify(myLogical);
            if (strMyLogical !== window.localCacheString && window.onlineSendInput) {
                window.onlineSendInput(myLogical);
                window.localCacheString = strMyLogical;
            }

            if (window.isHost && matchActive) {
                syncTimer++;
                if (syncTimer >= 5) {
                    syncTimer = 0;
                    window.onlineSendSync({ 
                        t: gameTimer, 
                        p: window.fighters.map(f => ({ 
                            x: Math.round(f.x), y: Math.round(f.y), 
                            hp: f.hp, s: Math.round(f.stamina),
                            st: f.stocks, inv: (f.invincible > 0)
                        })) 
                    });
                }
            }

            window.fighters.forEach((f, idx) => {
                let keysToApply = {};
                if (idx === window.myPlayerIndex) {
                    keysToApply = applyLogicalToPhysical(myLogical, true);
                } else if (window.isHost) {
                    let uid = window.playerOrder[idx];
                    keysToApply = applyLogicalToPhysical(window.remoteInputs[uid] || {}, true);
                }
                
                f.updateLocal(window.fighters, matchActive, KEYS_P1, keysToApply, {});
            });

        } else {
            // Local Matches
            window.fighters.forEach((f, idx) => {
                let logical = (idx === 0) ? myLogical : processCPU(idx);
                let keysToApply = applyLogicalToPhysical(logical, true);
                f.updateLocal(window.fighters, matchActive, KEYS_P1, keysToApply, {});
            });
        }
        
        applySpacing();
        updateCamera();
        
        window.fighters.forEach(f => f.updateAnimation(false));
        drawGame();
    }

    function applySpacing() {
        for(let i=0; i<window.fighters.length; i++) {
            for(let j=i+1; j<window.fighters.length; j++) {
                let f1 = window.fighters[i]; let f2 = window.fighters[j];
                if (f1.hp > 0 && f2.hp > 0 && Math.abs(f1.x - f2.x) < 45 && f1.state !== ST_KNOCKDOWN && f2.state !== ST_KNOCKDOWN && f1.state !== ST_BEING_SUPLEXED && f2.state !== ST_BEING_SUPLEXED) {
                    if (f1.getIsGrounded() && f2.getIsGrounded()) {
                        let push = (f1.x < f2.x) ? -2.5 : 2.5;
                        f1.x += push; f2.x -= push;
                    }
                }
            }
        }
    }

    function drawGame() {
        ctx.save();
        
        // Static Background
        ctx.clearRect(0, 0, W, H);
        let bgGrad = ctx.createRadialGradient(W/2, H/2 - 100, 0, W/2, H/2, W);
        bgGrad.addColorStop(0, '#0c0a20'); bgGrad.addColorStop(1, '#020205');
        ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

        if (hitFlash > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${hitFlash})`;
            ctx.fillRect(0, 0, W, H);
            hitFlash -= 0.05;
        }

        // Apply Screen Shake
        if(screenShake > 0) {
            ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            screenShake *= 0.85; if(screenShake < 0.5) screenShake = 0;
        }

        // Apply Camera Transform
        ctx.translate(W/2, H/2);
        ctx.scale(window.camera.scale, window.camera.scale);
        ctx.translate(-window.camera.x, -window.camera.y);

        // Draw Parallax Background Entities
        if (window.bgEntities) {
            window.bgEntities.forEach(ent => {
                let px = ent.x - window.camera.x * (0.2 / ent.z);
                let py = ent.y - window.camera.y * (0.2 / ent.z);
                ctx.fillStyle = ent.color;
                ctx.globalAlpha = 0.4 / ent.z;
                ctx.beginPath(); ctx.arc(px, py, ent.size / ent.z, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }
        
        if (window.currentMap && window.currentMap.type === 'boxing') {
            // Dynamic Boxing Ring Ropes
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)'; 
            ctx.lineWidth = 6; ctx.lineCap = 'round';
            let ropeY = GROUND_Y - 200;
            for(let r=0; r<4; r++) {
                ctx.beginPath(); ctx.moveTo(-500, ropeY + r*45); 
                ctx.quadraticCurveTo(W/2, ropeY + r*45 + 40, W + 500, ropeY + r*45); 
                ctx.stroke();
            }
            
            // Ring Posts
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(W*0.05 - 20, GROUND_Y - 250, 40, GROUND_Y - (GROUND_Y - 250));
            ctx.fillRect(W*0.95 - 20, GROUND_Y - 250, 40, GROUND_Y - (GROUND_Y - 250));
            
            // Ring Post Lights
            ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 30;
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath(); ctx.arc(W*0.05, GROUND_Y - 250, 15, 0, Math.PI*2); ctx.fill();
            ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 30;
            ctx.fillStyle = '#93c5fd';
            ctx.beginPath(); ctx.arc(W*0.95, GROUND_Y - 250, 15, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            let floorGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H + 500);
            floorGrad.addColorStop(0, '#111827'); floorGrad.addColorStop(1, '#030712');
            ctx.fillStyle = floorGrad; ctx.fillRect(-1000, GROUND_Y, W + 2000, 1500);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
            for(let i=-500; i<W+500; i+=100) { ctx.beginPath(); ctx.moveTo(i, GROUND_Y); ctx.lineTo(i + (i-W/2)*0.5, GROUND_Y + 1000); ctx.stroke(); }
        } else if (window.currentMap && window.currentMap.type === 'smash') {
            // Smash Stage
            let stg = window.currentMap.stage;
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.roundRect(stg.x, stg.y, stg.w, 150, 20);
            ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(stg.x + 10, stg.y + 20, stg.w - 20, 120);
            
            // Neon edge
            ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 20;
            ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(stg.x + 30, stg.y); ctx.lineTo(stg.x + stg.w - 30, stg.y); ctx.stroke();
            ctx.shadowBlur = 0;

            // Platforms
            window.currentMap.platforms.forEach(p => {
                ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
                ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 15, 8); ctx.fill();
                
                ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 15;
                ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(p.x + 10, p.y); ctx.lineTo(p.x + p.w - 10, p.y); ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Jump Pads
            if (window.currentMap.jumpPads) {
                window.currentMap.jumpPads.forEach(pad => {
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
                    ctx.beginPath(); ctx.roundRect(pad.x, pad.y, pad.w, 20, 10); ctx.fill();
                    
                    ctx.shadowColor = '#10b981'; ctx.shadowBlur = 15;
                    ctx.strokeStyle = '#34d399'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(pad.x + 10, pad.y); ctx.lineTo(pad.x + pad.w - 10, pad.y); ctx.stroke();
                    ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = `rgba(52, 211, 153, ${0.5 + Math.sin(Date.now()/150)*0.3})`;
                    ctx.fillRect(pad.x + 20, pad.y + 4, pad.w - 40, 4);
                });
            }
        }

        // Draw knocked down fighters first
        window.fighters.forEach(f => { if(f.state === ST_KNOCKDOWN || f.state === ST_BEING_SUPLEXED) f.draw(ctx); });
        // Draw standing fighters
        window.fighters.forEach(f => { if(f.state !== ST_KNOCKDOWN && f.state !== ST_BEING_SUPLEXED) f.draw(ctx); });

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; 
            p.x += p.vx; p.y += p.vy; 
            p.vy += (p.gravity !== undefined ? p.gravity : 0.8); 
            p.life -= (p.decay !== undefined ? p.decay : 0.035);
            ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); 
            let s = p.size !== undefined ? p.size : 4;
            ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
            if (p.life <= 0) particles.splice(i, 1);
        }
        
        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; t.y += t.vy; t.vy *= 0.92; t.life -= 0.015;
            ctx.globalAlpha = Math.max(0, Math.min(1.0, t.life)); ctx.fillStyle = t.color;
            ctx.font = t.big ? "900 38px Oswald" : "900 24px Oswald"; ctx.textAlign = "center";
            ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.lineWidth = 6; ctx.strokeText(t.text, t.x, t.y); ctx.fillText(t.text, t.x, t.y);
            ctx.globalAlpha = 1.0; if (t.life <= 0) texts.splice(i, 1);
        }

        ctx.restore(); 
        updateUI();
    }
</script>
