                ctx.fillStyle = 'rgba(96, 165, 250, 0.5)'; ctx.fill();
                ctx.strokeStyle = 'rgba(147, 197, 253, 1)'; ctx.lineWidth = 5; ctx.stroke();
            }

            // Legs
            ctx.strokeStyle = '#111'; ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-6, -55); ctx.lineTo(this.footL.x, this.footL.y); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(6, -55); ctx.lineTo(this.footR.x, this.footR.y); ctx.stroke();  

            // Accessory: Gold Chain (Anchored exactly to neck to track ducking and swaying)
            if (this.profile.accessory === 'goldchain') {
                let neckY = this.headOffset.y + 15; 
                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(-12, neckY);
                ctx.lineTo(0, neckY + 22);
                ctx.lineTo(12, neckY);
                ctx.stroke();
                
                // Pendant Block
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(-6, neckY + 18, 12, 14);
                ctx.fillStyle = '#fef08a'; 
                ctx.fillRect(-2, neckY + 20, 4, 4);
            }

            // Body
            let bodyGrad = ctx.createLinearGradient(-15, -this.height, 15, 0);
            bodyGrad.addColorStop(0, this.color); bodyGrad.addColorStop(1, '#050505');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.roundRect(-18, -this.height + 25 + this.duckAmount, 36, this.height - 75 - this.duckAmount, 12); ctx.fill();
            
            // Trunks/Waist
            ctx.fillStyle = this.isP1 ? '#1e3a8a' : '#7f1d1d'; ctx.beginPath(); ctx.roundRect(-20, -65, 40, 25, 6); ctx.fill();
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(-20, -65, 40, 6); 

            // Back Arm
            ctx.strokeStyle = this.isP1 ? '#93c5fd' : '#fca5a5'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(-6, -this.height + 40 + this.duckAmount); ctx.lineTo(this.gloveR.x, this.gloveR.y); ctx.stroke();
            
            // Head
            ctx.fillStyle = '#fecaca'; ctx.beginPath(); ctx.arc(this.headOffset.x, this.headOffset.y, 22, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(this.headOffset.x - this.facing*7, this.headOffset.y + 2, 18, 0, Math.PI*2); ctx.fill();
            
            // Accessory: Sunglasses (Sleek Visor layered precisely onto headOffset)
            if (this.profile.accessory === 'sunglasses') {
                let eyeY = this.headOffset.y - 4;
                let eyeX = this.headOffset.x + (this.facing * 6);
                
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.moveTo(eyeX - (this.facing * 14), eyeY - 4);
                ctx.lineTo(eyeX + (this.facing * 14), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 10), eyeY + 8);
                ctx.lineTo(eyeX - (this.facing * 10), eyeY + 6);
                ctx.fill();
                
                // Visor Shine
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.moveTo(eyeX + (this.facing * 2), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 8), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 6), eyeY + 6);
                ctx.lineTo(eyeX + (this.facing * 0), eyeY + 6);
                ctx.fill();
            }

            // Headgear
            if (this.profile.hat === 'kippah') {
                ctx.fillStyle = '#0f172a';
                let kx = this.headOffset.x - (this.facing * 10);
                let ky = this.headOffset.y - 15;
                ctx.beginPath();
                ctx.ellipse(kx, ky, 12, 14, this.facing * 0.5, Math.PI, 0); 
                ctx.fill();
            } else if (this.profile.hat === 'widebrim') {
                ctx.fillStyle = '#0a0a0a';
                let wx = this.headOffset.x;
                let wy = this.headOffset.y - 18;
                // Brim
                ctx.beginPath(); ctx.ellipse(wx, wy, 42, 6, 0, 0, Math.PI*2); ctx.fill();
                // Top
                ctx.beginPath(); ctx.roundRect(wx - 16, wy - 16, 32, 16, 2); ctx.fill();
            }

            // Front Arm
            ctx.strokeStyle = this.isP1 ? '#93c5fd' : '#fca5a5'; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(6, -this.height + 40 + this.duckAmount); ctx.lineTo(this.gloveL.x, this.gloveL.y); ctx.stroke();

            // Gloves
            ctx.fillStyle = this.isP1 ? '#2563eb' : '#dc2828'; ctx.beginPath(); ctx.arc(this.gloveR.x, this.gloveR.y, 16, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = this.isP1 ? '#3b82f6' : '#ef4444'; ctx.beginPath(); ctx.arc(this.gloveL.x, this.gloveL.y, 18, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(this.gloveL.x + this.facing*6, this.gloveL.y - 6, 6, 0, Math.PI*2); ctx.fill();

            // Guard Break Signifier
            if (ATTACK_DATA[this.state] && ATTACK_DATA[this.state].guardBreak) {
                const data = ATTACK_DATA[this.state];
                const elapsed = (data.windup + data.active + data.recov) - this.stateTimer;
                if (elapsed < data.windup) {
                    let progress = elapsed / data.windup; 
                    ctx.save(); ctx.translate(0, -this.height - 60); 
                    let scale = 1.0 + Math.sin(progress * Math.PI) * 0.8; ctx.scale(scale, scale);
                    ctx.fillStyle = `rgba(255, 50, 50, ${Math.sin(progress * Math.PI)})`;
                    ctx.font = "900 65px 'Yu Mincho', 'MS Mincho', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 30; ctx.fillText("危", 0, 0); 
                    
                    ctx.beginPath(); ctx.arc(0, 0, 40 * progress, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(255, 0, 0, ${1 - progress})`; ctx.lineWidth = 5; ctx.stroke();
                    ctx.restore();
                }
            }
            ctx.restore();
        }
    }

    function processCPU() {
        if (!matchActive || p2.state === ST_KNOCKDOWN) return;
        
        cpuPrevInputs = { ...cpuInputs };

        const diffProfiles = [
            { reactBase: 15, reactRand: 20, block: 0.60, dodge: 0.30, atkFreq: 0.60, mashSpd: 10 },
            { reactBase: 5,  reactRand: 10, block: 0.85, dodge: 0.50, atkFreq: 0.80, mashSpd: 4 },
            { reactBase: 1,  reactRand: 5,  block: 0.98, dodge: 0.80, atkFreq: 0.95, mashSpd: 2 }
        ];
        let prof = diffProfiles[cpuDifficulty];

        if (cpuDifficulty === 2 && ATTACK_DATA[p2.state]) {
            let data = ATTACK_DATA[p2.state];
            let elapsed = (data.windup + data.active + data.recov) - p2.stateTimer;
            if (elapsed === 6 && (p2.state === ST_P_HOOK || p2.state === ST_KICK) && Math.random() < 0.4) {
                cpuInputs.arrowdown = true; 
            }
        }
        
        if (clinchActive) {
            cpuReactionTimer--;
            if (cpuReactionTimer <= 0) {
                cpuInputs['0'] = !cpuInputs['0']; 
                cpuReactionTimer = prof.mashSpd + Math.random() * (prof.mashSpd * 1.5); 
            }
            return;
        }
        
        cpuReactionTimer--;
        if (cpuReactionTimer > 0) return; 
        
        cpuReactionTimer = prof.reactBase + Math.random() * prof.reactRand; 
        Object.keys(cpuInputs).forEach(k => cpuInputs[k] = false);
        
        let dist = Math.abs(p1.x - p2.x);
        let isP1Attacking = p1.hitboxActive || (ATTACK_DATA[p1.state] && p1.stateTimer > ATTACK_DATA[p1.state].recov);
        let movingAway = p2.x > p1.x ? 'arrowright' : 'arrowleft';
        let movingToward = p2.x > p1.x ? 'arrowleft' : 'arrowright';

        if (isP1Attacking && p2.stamina > 20) {
            if (Math.random() < prof.block) { cpuInputs.arrowdown = true; cpuReactionTimer = 25; return; }
            else if (Math.random() < prof.dodge) { cpuInputs.enter = true; return; }
        }
        
        if (p2.stamina < 50 && !isP1Attacking) {
            cpuInputs[movingAway] = true;
            if(Math.random() < 0.1) cpuInputs.enter = true;
            cpuReactionTimer = 15; return;
        }

        if (dist > 180) {
            cpuInputs[movingToward] = true;
            if (Math.random() < 0.2 && p2.stamina > 20) cpuInputs.enter = true; 
            if (Math.random() < 0.1) cpuInputs.arrowup = true; 
            if (Math.random() < 0.02) cpuInputs['8'] = true; // CPU Taunt!
            cpuReactionTimer = 15; 
        } else {
            if (Math.random() < prof.atkFreq && p2.stamina >= 20) {
                let rand = Math.random();
                if (p1.y < GROUND_Y - 30 && dist < 120 && Math.random() < 0.7) cpuInputs['7'] = true; 
                else {
                    if (rand < 0.20) cpuInputs['1'] = true; else if (rand < 0.40) cpuInputs['2'] = true; 
                    else if (rand < 0.55) cpuInputs['3'] = true; else if (rand < 0.70) cpuInputs['7'] = true; 
                    else if (rand < 0.85) cpuInputs['4'] = true; else if (rand < 0.95) cpuInputs['5'] = true; 
                    else cpuInputs['6'] = true; 
                }
                cpuReactionTimer = 35; 
            } else {
                if (Math.random() < 0.5) cpuInputs[movingAway] = true; else cpuInputs[movingToward] = true;
                cpuReactionTimer = 15;
            }
        }
    }

    function updateUI() {
        document.getElementById('p1-hp').style.width = `${Math.max(0, p1.hp)}%`;
        document.getElementById('p1-stam').style.width = `${Math.max(0, (p1.stamina / p1.maxStamina) * 100)}%`;
        document.getElementById('p2-hp').style.width = `${Math.max(0, p2.hp)}%`;
        document.getElementById('p2-stam').style.width = `${Math.max(0, (p2.stamina / p2.maxStamina) * 100)}%`;
        document.getElementById('timer').innerText = Math.max(0, Math.ceil(gameTimer));
    }

    window.checkGameOverNetworkEvent = function() {
        matchActive = false; clinchActive = false;
        document.getElementById('ui-container').classList.remove('hidden');
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('menu-primary').classList.add('hidden');
        document.getElementById('game-over-ui').classList.remove('hidden');
    }

    function checkGameOver() {
        if(!matchActive) return;
        matchActive = false; clinchActive = false;

        if (window.isOnlineGame && window.dataChannel && window.dataChannel.readyState === 'open') {
            window.dataChannel.send(JSON.stringify({ type: 'gameover', p1hp: p1.hp, p2hp: p2.hp }));
        }

        // Show finisher message immediately
        if (p1.hp <= 0 && p2.hp > 0 && p2.profile.finisher) {
            spawnText(p2.x, p2.y - 180, `"${p2.profile.finisher}"`, p2.color, true, 4.0);
        } else if (p2.hp <= 0 && p1.hp > 0 && p1.profile.finisher) {
            spawnText(p1.x, p1.y - 180, `"${p1.profile.finisher}"`, p1.color, true, 4.0);
        }

        gameOverTimeout = setTimeout(() => {
            document.getElementById('ui-container').classList.remove('hidden');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('menu-primary').classList.add('hidden');
            document.getElementById('game-over-ui').classList.remove('hidden');
            document.getElementById('rematch-btn').classList.remove('hidden'); 
            
            let winnerTxt = "DRAW"; let subTxt = "The bout is over.";
            
            if (window.isOnlineGame) {
                let myFighter = window.isHost ? p1 : p2;
                let oppFighter = window.isHost ? p2 : p1;
                if(myFighter.hp > oppFighter.hp) { winnerTxt = "VICTORY"; subTxt = "YOU DEFEATED YOUR OPPONENT!"; }
                if(oppFighter.hp > myFighter.hp) { winnerTxt = "DEFEAT"; subTxt = "YOUR OPPONENT WON."; }
            } else {
                if(p1.hp > p2.hp) { winnerTxt = "P1 WINS"; subTxt = vsCPU ? "YOU DEFEATED THE CPU!" : "PLAYER 1 IS VICTORIOUS!"; }
                if(p2.hp > p1.hp) { winnerTxt = "P2 WINS"; subTxt = vsCPU ? "THE CPU CRUSHED YOU." : "PLAYER 2 IS VICTORIOUS!"; }
            }
            
            document.getElementById('winner-text').innerText = winnerTxt; 
            
            if (window.remoteWantsRematch) {
                document.getElementById('winner-sub').innerText = "OPPONENT WANTS REMATCH...";
            } else {
                document.getElementById('winner-sub').innerText = subTxt;
            }
        }, 2000);
    }

    function gameLoop(timestamp) {
        if (!gameStarted) return;
        requestAnimationFrame(gameLoop);
        
        if (!lastLoopTime) lastLoopTime = timestamp;
        const dt = timestamp - lastLoopTime;
        if (dt < 16) return; 
        lastLoopTime = timestamp - (dt % 16); 
        
        if (matchActive && !clinchActive) {
            gameTimer -= 1/60; 
            if(gameTimer <= 0 || p1.hp <= 0 || p2.hp <= 0) checkGameOver();
        }

        if (window.isOnlineGame) {
            let myLogical = getLogicalInputs(keysDown, KEYS_P1);
            let strMyLogical = JSON.stringify(myLogical);
            
            if (strMyLogical !== window.localCacheString && window.onlineSendInput) {
                window.onlineSendInput(myLogical);
                window.localCacheString = strMyLogical;
            }

            let networkP1Keys = window.isHost ? keysDown : applyLogicalToPhysical(window.remoteLogicalInputs, true);
            let networkP2Keys = window.isHost ? applyLogicalToPhysical(window.remoteLogicalInputs, false) : applyLogicalToPhysical(myLogical, false);

            if (window.isHost && matchActive) {
                syncTimer++;
                if (syncTimer >= 5) {
                    syncTimer = 0;
                    window.onlineSendSync({ p1x: p1.x, p1hp: p1.hp, p1s: p1.stamina, p2x: p2.x, p2hp: p2.hp, p2s: p2.stamina, t: gameTimer });
                }
            } else if (!window.isHost && matchActive) {
                if (window.hostSyncP1X !== undefined) p1.x += (window.hostSyncP1X - p1.x) * 0.15;
                if (window.hostSyncP2X !== undefined && Math.abs(p2.x - window.hostSyncP2X) > 15) {
                    p2.x += (window.hostSyncP2X - p2.x) * 0.05;
                }
            }

            processClinch(networkP1Keys, prevKeysDown, networkP2Keys, cpuPrevInputs);
            if (!clinchActive) { applySpacing(); }
            
            p1.updateLocal(p2, matchActive, KEYS_P1, networkP1Keys, prevKeysDown);
            p2.updateLocal(p1, matchActive, KEYS_P2, networkP2Keys, cpuPrevInputs);
            
            prevKeysDown = { ...networkP1Keys }; 
            cpuPrevInputs = { ...networkP2Keys };

        } else {
            if (vsCPU) processCPU();
            let p2ActiveKeys = vsCPU ? cpuInputs : keysDown;
            let p2PrevKeys = vsCPU ? cpuPrevInputs : prevKeysDown;
            
            processClinch(keysDown, prevKeysDown, p2ActiveKeys, p2PrevKeys);
            if (!clinchActive) { applySpacing(); }

            p1.updateLocal(p2, matchActive, KEYS_P1, keysDown, prevKeysDown);
            p2.updateLocal(p1, matchActive, KEYS_P2, p2ActiveKeys, p2PrevKeys);
            
            prevKeysDown = { ...keysDown }; 
        }
        
        p1.updateAnimation(); p2.updateAnimation();
        drawGame();
    }

    function processClinch(p1Active, p1Prev, p2Active, p2Prev) {
        if (clinchActive) {
            clinchTimer--;
            if (checkKey(KEYS_P1.clinchMash, p1Active) && !checkKey(KEYS_P1.clinchMash, p1Prev)) clinchScoreP1++;
            if (checkKey(KEYS_P2.clinchMash, p2Active) && !checkKey(KEYS_P2.clinchMash, p2Prev)) clinchScoreP2++;
            
            if (clinchTimer <= 0) {
                clinchActive = false;
                if (clinchScoreP1 > clinchScoreP2) { p2.changeState(ST_KNOCKDOWN, 80); p2.vy = -12; p2.vx = 20; p2.kdRotVel = 0.2; p2.hp -= 25; p1.changeState(ST_IDLE, 0); } 
                else if (clinchScoreP2 > clinchScoreP1) { p1.changeState(ST_KNOCKDOWN, 80); p1.vy = -12; p1.vx = -20; p1.kdRotVel = -0.2; p1.hp -= 25; p2.changeState(ST_IDLE, 0); } 
                else { p1.changeState(ST_HITSTUN, 30); p1.vx = -10; p2.changeState(ST_HITSTUN, 30); p2.vx = 10; }
                if (p1.hp <= 0) p1.handleDeath(); if (p2.hp <= 0) p2.handleDeath();
                screenShake = 25; spawnParticles(W/2, GROUND_Y-80, '#fff', 70, 3.5);
            }
        }
    }

    function applySpacing() {
        if (Math.abs(p1.x - p2.x) < 45 && p1.state !== ST_KNOCKDOWN && p2.state !== ST_KNOCKDOWN) {
            const push = (p1.x < p2.x) ? -3.5 : 3.5; p1.x += push; p2.x -= push;
        }
    }

    function drawGame() {
        ctx.save();
        if(screenShake > 0) {
            ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            screenShake *= 0.85; if(screenShake < 0.5) screenShake = 0;
        }

        ctx.clearRect(0, 0, W, H);
        let bgGrad = ctx.createRadialGradient(W/2, H/2 - 100, 0, W/2, H/2, W);
        bgGrad.addColorStop(0, '#0c0a20'); bgGrad.addColorStop(1, '#020205');
        ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
        
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 25; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(150, GROUND_Y); ctx.lineTo(100, H/2 - 100); ctx.stroke(); 
        ctx.beginPath(); ctx.moveTo(W - 150, GROUND_Y); ctx.lineTo(W - 100, H/2 - 100); ctx.stroke(); 
        
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, H/2 - 90); ctx.quadraticCurveTo(W/2, H/2 - 40, W, H/2 - 90); ctx.stroke();
        ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 9;  ctx.beginPath(); ctx.moveTo(0, H/2 - 30); ctx.quadraticCurveTo(W/2, H/2 + 20, W, H/2 - 30); ctx.stroke();
        ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, H/2 + 30); ctx.quadraticCurveTo(W/2, H/2 + 80, W, H/2 + 30); ctx.stroke();

        let floorGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
        floorGrad.addColorStop(0, '#111827'); floorGrad.addColorStop(1, '#030712');
        ctx.fillStyle = floorGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
        for(let i=0; i<W; i+=100) { ctx.beginPath(); ctx.moveTo(i, GROUND_Y); ctx.lineTo(i + (i-W/2)*0.5, H); ctx.stroke(); }

        if(p1.state === ST_KNOCKDOWN) { p1.draw(ctx); p2.draw(ctx); } else if(p2.state === ST_KNOCKDOWN) { p2.draw(ctx); p1.draw(ctx); } else { p2.draw(ctx); p1.draw(ctx); }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; 
            p.x += p.vx; p.y += p.vy; 
            p.vy += (p.gravity !== undefined ? p.gravity : 0.8); 
            p.life -= (p.decay !== undefined ? p.decay : 0.035);
            ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); 
            let s = p.size !== undefined ? p.size : 4;
            ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
            if (p.life <= 0) particles.splice(i, 1);
        }
        
        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; t.y += t.vy; t.vy *= 0.92; t.life -= 0.015;
            // Support initialLife gracefully fading at the end
            ctx.globalAlpha = Math.max(0, Math.min(1.0, t.life)); ctx.fillStyle = t.color;
            ctx.font = t.big ? "900 38px Oswald" : "900 24px Oswald"; ctx.textAlign = "center";
            ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.lineWidth = 6; ctx.strokeText(t.text, t.x, t.y); ctx.fillText(t.text, t.x, t.y);
            ctx.globalAlpha = 1.0; if (t.life <= 0) texts.splice(i, 1);
        }

        if (clinchActive) {
            ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = "white"; ctx.font = "900 80px Oswald"; ctx.textAlign = "center";
            ctx.shadowColor = "rgba(255,255,255,0.8)"; ctx.shadowBlur = 20;
            ctx.fillText("CLINCH! MASH!", W/2, H/3);
            ctx.shadowBlur = 0;
            
            let totalScore = Math.max(1, clinchScoreP1 + clinchScoreP2); let p1Ratio = clinchScoreP1 / totalScore;
            ctx.fillStyle = "#1e293b"; ctx.fillRect(W/2 - 350, H/2, 700, 50);
            ctx.fillStyle = "#3b82f6"; ctx.fillRect(W/2 - 350, H/2, 700 * p1Ratio, 50);
            ctx.fillStyle = "#ef4444"; ctx.fillRect(W/2 - 350 + (700 * p1Ratio), H/2, 700 * (1 - p1Ratio), 50);
            ctx.strokeStyle = "white"; ctx.lineWidth = 6; ctx.strokeRect(W/2 - 350, H/2, 700, 50);
            
            ctx.font = "900 40px Oswald"; ctx.fillStyle = "white"; 
            ctx.fillText("P1", W/2 - 390, H/2 + 40); ctx.fillText("P2", W/2 + 390, H/2 + 40);
        }

        ctx.restore(); updateUI();
    }
</script>
</body>
