<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glove Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; overflow: hidden; background-color: #050505; color: #e2e8f0; 
            font-family: 'Inter', sans-serif; user-select: none;
        }

        .noise-overlay {
            position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        canvas { 
            display: block; margin: 0 auto; background: #0a0a0c; 
        }
        canvas:focus { outline: none; }
        
        .hidden { display: none !important; }
        
        .glass-panel { 
            background: #0f1115;
            border: 2px solid #27272a;
            box-shadow: 15px 15px 0px rgba(0,0,0,0.8);
            border-radius: 0px; /* Brutalist sharp corners */
        }
        
        h1, h2, .boxing-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        
        .btn { 
            position: relative; padding: 16px 24px; font-weight: 900; 
            border-radius: 0px; cursor: pointer; transition: all 0.1s;
            border: 2px solid #27272a; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; 
            font-family: 'Oswald', sans-serif; display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        .btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px rgba(0,0,0,0.5); }

        .btn-blue { background: #1d4ed8; border-color: #1e3a8a; color: white; }
        .btn-blue:hover { background: #2563eb; }
        
        .btn-red { background: #b91c1c; border-color: #7f1d1d; color: white; }
        .btn-red:hover { background: #dc2626; }
        
        .btn-gray { background: #27272a; border-color: #18181b; color: white; }
        .btn-gray:hover { background: #3f3f46; }

        .btn-green { background: #047857; border-color: #064e3b; color: white; }
        .btn-green:hover { background: #059669; }
        
        .btn-purple { background: #6d28d9; border-color: #4c1d95; color: white; }
        .btn-purple:hover { background: #7c3aed; }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; background: rgba(5,5,5,0.9); }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

        .health-bar-container { transform: skewX(-10deg); border-radius: 0px; border: 3px solid #18181b; }
        .health-bar-container.p2-skew { transform: skewX(10deg); }
        
        .segmented-glass {
            position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0,0,0,0.4) 15px, rgba(0,0,0,0.4) 18px);
            z-index: 10; pointer-events: none;
        }

        input[type="text"], select {
            background: #18181b; border: 2px solid #3f3f46; border-radius: 0px;
            color: white; font-family: 'Inter', sans-serif;
            transition: all 0.1s;
        }
        input[type="text"]:focus, select:focus { outline: none; border-color: #dc2626; background: #09090b; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Keyboard Key Styles for Controls UI */
        .key-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: #27272a; border: 1px solid #3f3f46; border-bottom-width: 3px;
            border-radius: 2px; padding: 2px 6px; font-family: 'Inter', sans-serif;
            font-weight: 900; color: #f8fafc; margin: 0 2px; font-size: 0.85em;
            min-width: 24px;
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <div id="ui-container">
        <!-- Main UI Panel -->
        <div class="glass-panel p-10 max-w-3xl w-full text-center relative overflow-hidden" id="main-menu">
            <div class="absolute top-0 left-0 w-full h-2 bg-red-700 z-20"></div>
            
            <div class="relative z-10" id="menu-primary">
                <div class="mb-10">
                    <h1 class="text-[6rem] leading-none font-black mb-1 text-white tracking-tighter drop-shadow-[4px_4px_0px_#991b1b]">GLOVE GAME</h1>
                    <p class="text-gray-400 text-sm font-bold tracking-[0.5em] uppercase">Underground Circuit</p>
                </div>
                
                <div class="flex flex-col gap-4 px-12">
                    <button class="btn btn-purple py-4" onclick="showLobbyMenu()">ONLINE MULTIPLAYER (P2P)</button>
                    <button class="btn btn-blue py-4" onclick="initGame(1)">1 PLAYER (VS CPU)</button>
                    <button class="btn btn-red py-4" onclick="initGame(2)">2 PLAYER (LOCAL CO-OP)</button>
                    <button class="btn btn-green py-4" onclick="initGame(4)">4 PLAYER SMASH (LOCAL FFA)</button>
                    <button class="btn btn-gray py-3 mt-4 text-sm" onclick="showProfileMenu()">EDIT FIGHTER PROFILE</button>
                </div>
            </div>

            <!-- Profile Menu / Character Editor -->
            <div class="relative z-10 hidden" id="menu-profile">
                <h2 class="text-4xl font-black mb-6 text-white tracking-tighter drop-shadow-[2px_2px_0px_#991b1b]">FIGHTER PROFILE</h2>
                
                <div class="flex gap-6 mb-6 text-left">
                    <div class="w-1/3 bg-[#09090b] border-2 border-[#27272a] flex flex-col items-center justify-center p-2 relative shadow-inner overflow-hidden">
                        <canvas id="previewCanvas" width="200" height="280"></canvas>
                        <div class="absolute bottom-3 text-[10px] text-gray-500 font-bold uppercase tracking-widest bg-black/80 px-2 py-1">Live Preview</div>
                    </div>
                    
                    <div class="w-2/3 flex flex-col gap-3">
                        <div>
                            <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Fighter Alias</label>
                            <input type="text" id="profile-name-input" maxlength="12" class="w-full p-2.5 text-xl font-bold font-['Oswald'] tracking-widest uppercase mt-1 text-center" oninput="updatePreviewProfile()">
                        </div>
                        
                        <div class="flex gap-3">
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Headgear</label>
                                <select id="profile-hat-input" class="w-full p-2.5 text-sm font-bold mt-1 appearance-none cursor-pointer text-center" onchange="updatePreviewProfile()">
                                    <option value="none">None</option>
                                    <option value="kippah">Kippah</option>
                                    <option value="widebrim">Wide Brim Hat</option>
                                </select>
                            </div>
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Accessory</label>
                                <select id="profile-acc-input" class="w-full p-2.5 text-sm font-bold mt-1 appearance-none cursor-pointer text-center" onchange="updatePreviewProfile()">
                                    <option value="none">None</option>
                                    <option value="sunglasses">Sunglasses</option>
                                    <option value="goldchain">Gold Chain</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="flex gap-3">
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Taunt Message</label>
                                <input type="text" id="profile-taunt-input" maxlength="25" placeholder="Come at me!" class="w-full p-2.5 text-sm mt-1 text-left" oninput="updatePreviewProfile()">
                            </div>
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Emote Style</label>
                                <select id="profile-emote-input" class="w-full p-2.5 text-sm font-bold mt-1 appearance-none cursor-pointer text-center" onchange="updatePreviewProfile()">
                                    <option value="0">Beat Chest</option>
                                    <option value="1">Throat Cut</option>
                                    <option value="2">Come At Me</option>
                                    <option value="3">Menacing Point</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button class="btn btn-gray flex-1 py-3" onclick="hideProfileMenu()">CANCEL</button>
                    <button class="btn btn-green flex-1 py-3" onclick="saveProfile()">SAVE CHANGES</button>
                </div>
            </div>
            
            <!-- Lobby Menu -->
            <div class="relative z-10 hidden flex-col h-full min-h-[420px]" id="menu-lobby">
                <h2 class="text-4xl font-black mb-2 text-white tracking-tighter drop-shadow-[2px_2px_0px_#4c1d95]">PUBLIC LOBBIES</h2>
                <div id="lobby-status" class="text-red-400 font-bold mb-4 h-6 uppercase tracking-wider text-sm"></div>
                
                <div class="flex-col gap-4 flex-grow flex px-2" id="lobby-options">
                    <button class="btn btn-purple py-4" onclick="window.hostGame()">+ HOST NEW ROOM</button>
                    
                    <div class="bg-[#09090b] border-2 border-[#27272a] p-4 mt-2 flex-grow flex flex-col h-60 relative overflow-hidden shadow-inner">
                        <p class="text-xs text-gray-500 font-bold mb-3 tracking-widest uppercase text-left">Available Matches (P2P - Up to 4P)</p>
                        <div id="lobby-list" class="flex flex-col gap-3 overflow-y-auto pr-2 flex-grow relative z-20 pb-4">
                            <p class="text-gray-600 italic py-4 text-sm font-bold uppercase tracking-widest">Searching for rooms...</p>
                        </div>
                    </div>
                    <button class="btn btn-gray py-3 mt-2 text-sm" onclick="hideLobbyMenu()">BACK TO MENU</button>
                </div>
                
                <div id="lobby-waiting" class="hidden flex-col gap-4 items-center justify-center flex-grow h-full py-6">
                    <h1 class="text-3xl font-black text-white tracking-widest drop-shadow-[2px_2px_0px_#4c1d95]">HOSTING ROOM</h1>
                    <p class="text-gray-400 font-bold mb-2" id="hosting-subtitle">Waiting for challengers...</p>
                    <div id="connected-players-list" class="flex flex-col gap-2 w-full max-w-sm mb-4"></div>
                    <div class="flex gap-4 w-full">
                        <button class="btn btn-gray text-sm py-3 flex-1" onclick="cancelHosting()">CANCEL</button>
                        <button class="btn btn-green text-sm py-3 flex-1 hidden" id="start-match-btn" onclick="startHostedGame()">START MATCH</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-ui" class="hidden glass-panel p-12 text-center z-50 w-full max-w-lg border-t-8 border-red-700 relative">
            <div class="relative z-10">
                <h2 class="text-[6rem] leading-none font-black mb-2 tracking-tighter text-white drop-shadow-[4px_4px_0px_#991b1b]" id="winner-text">K.O.</h2>
                <p class="text-gray-400 font-bold text-xl mb-10 tracking-widest uppercase" id="winner-sub">The bout is over.</p>
                <div class="flex flex-col gap-4">
                    <button class="btn btn-red py-5 w-full text-xl" id="rematch-btn" onclick="handleRematchClick()">REMATCH</button>
                    <button class="btn btn-gray py-4 w-full" onclick="location.reload()">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-ui" class="hidden flex flex-col justify-between p-6 h-full">
        <div class="flex flex-wrap justify-center items-start w-full max-w-7xl mx-auto mt-2 gap-4" id="dynamic-hud-container">
            <!-- Dynamically populated based on player count -->
        </div>

        <div id="controls-text" class="text-center text-gray-300 text-sm mb-4 bg-[#09090b] border-2 border-[#27272a] mx-auto px-6 py-4 shadow-[8px_8px_0px_rgba(0,0,0,0.8)] absolute bottom-6 left-1/2 transform -translate-x-1/2 w-max max-w-[98%] tracking-wide"></div>
    </div>

    <canvas id="gameCanvas" width="1280" height="720" tabindex="0"></canvas>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, get, set, update, onValue, onDisconnect, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDUoYS6MwDIVe8coZOM9A0ZCYaZTeDSloo",
        authDomain: "babjeu-85d3e.firebaseapp.com",
        databaseURL: "https://babjeu-85d3e-default-rtdb.firebaseio.com",
        projectId: "babjeu-85d3e",
        storageBucket: "babjeu-85d3e.firebasestorage.app",
        messagingSenderId: "306959176803",
        appId: "1:306959176803:web:2be00da38dbb37e777d456",
        measurementId: "G-T38G7Y7MJ7"
    };
    
    let app, auth, db;
    try { app = initializeApp(firebaseConfig); auth = getAuth(app); db = getDatabase(app); } catch(e) { console.log("Firebase init skipped due to missing config."); }

    let user = null;
    window.lobbyQueryUnsub = null; window.roomListenerUnsub = null; window.currentRoomId = null;

    // WebRTC Multi-Peer Variables
    window.guestConnections = {}; // { guestId: { peerConnection, dataChannel, profile, inputs, latency } }
    window.hostConnection = null; // For guests: { peerConnection, dataChannel }
    
    window.localWantsRematch = false; window.remoteWantsRematch = false;
    window.rematchVotes = new Set();

    const rtcConfig = {
        iceServers: [ { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' } ]
    };
    
    const setLobbyStatus = (msg) => { document.getElementById('lobby-status').innerText = msg; };

    window.initFirebaseOnline = async function() {
        if(!auth) { setLobbyStatus("Network Error: Config missing"); return false; }
        try {
            setLobbyStatus("Connecting to signaling server...");
            if (typeof __initial_auth_token !== 'undefined') await signInWithCustomToken(auth, __initial_auth_token); else await signInAnonymously(auth);
            user = auth.currentUser; setLobbyStatus(""); return true;
        } catch(e) { console.error(e); setLobbyStatus("Network connect failed. " + e.message); return false; }
    };

    window.startLobbyListener = async function() {
        if (!(await window.initFirebaseOnline())) return;
        const roomsRef = ref(db, 'rooms');
        window.lobbyQueryUnsub = onValue(roomsRef, (snap) => {
            const rooms = snap.val(); const listEl = document.getElementById('lobby-list'); listEl.innerHTML = ''; let count = 0;
            if (rooms) {
                const now = Date.now();
                for (const [id, data] of Object.entries(rooms)) {
                    if (!data.timestamp || now - data.timestamp > 1800000) { remove(ref(db, 'rooms/' + id)).catch(e => {}); continue; }
                    if (data.status === 'waiting' && (!data.guests || Object.keys(data.guests).length < 3)) { // Max 3 guests (4 players total)
                        count++;
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-gray text-left py-4 px-5 w-full justify-between';
                        const hostDisplayName = (data.hostName || "FIGHTER").substring(0, 12);
                        let pCount = data.guests ? Object.keys(data.guests).length + 1 : 1;
                        btn.innerHTML = `<span>${hostDisplayName}'S LOBBY (${pCount}/4)</span><span class="text-red-400">JOIN</span>`;
                        btn.onclick = () => window.joinPublicRoom(id);
                        listEl.appendChild(btn);
                    }
                }
            }
            if (count === 0) listEl.innerHTML = '<p class="text-gray-500 italic text-sm tracking-widest mt-4">NO OPEN LOBBIES.</p>';
        });
    };

    window.stopLobbyListener = function() { if (window.lobbyQueryUnsub) { window.lobbyQueryUnsub(); window.lobbyQueryUnsub = null; } };

    window.hostGame = async function() {
        if (!user) return; window.stopLobbyListener();
        const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        const roomRef = ref(db, 'rooms/' + roomId);
        
        try {
            await set(roomRef, { host: user.uid, hostName: window.playerProfile.name, hostProfile: window.playerProfile, status: 'waiting', timestamp: Date.now() });
            onDisconnect(roomRef).remove();
            
            document.getElementById('lobby-options').classList.add('hidden'); document.getElementById('lobby-options').classList.remove('flex');
            document.getElementById('lobby-waiting').classList.remove('hidden'); document.getElementById('lobby-waiting').classList.add('flex');
            
            window.isHost = true; window.currentRoomId = roomId; window.guestConnections = {};
            window.playerProfiles = [window.playerProfile]; // Index 0 is Host

            window.roomListenerUnsub = onValue(ref(db, `rooms/${roomId}/guests`), (snapshot) => {
                const guests = snapshot.val() || {};
                updateHostWaitingScreen(guests);
                
                // Initialize WebRTC for any new guests
                for (const guestId in guests) {
                    if (!window.guestConnections[guestId]) {
                        setupHostToGuestRTC(roomId, guestId, guests[guestId].profile);
                    }
                }
            });
        } catch (e) { console.error(e); setLobbyStatus("Host failed."); }
    };

    function updateHostWaitingScreen(guests) {
        let guestCount = Object.keys(guests).length;
        document.getElementById('hosting-subtitle').innerText = `Players: ${guestCount + 1}/4`;
        
        let listHtml = `<div class="bg-blue-900/40 border border-blue-500 p-2 text-white font-bold">P1 (Host): ${window.playerProfile.name}</div>`;
        let i = 2;
        for (const gid in guests) {
            let colors = ['red', 'green', 'yellow']; let c = colors[i-2];
            listHtml += `<div class="bg-${c}-900/40 border border-${c}-500 p-2 text-white font-bold">P${i}: ${guests[gid].profile.name}</div>`;
            i++;
        }
        document.getElementById('connected-players-list').innerHTML = listHtml;
        
        const startBtn = document.getElementById('start-match-btn');
        if (guestCount > 0) { startBtn.classList.remove('hidden'); } else { startBtn.classList.add('hidden'); }
    }

    async function setupHostToGuestRTC(roomId, guestId, profile) {
        let pc = new RTCPeerConnection(rtcConfig);
        let dc = pc.createDataChannel('gameData', { ordered: false, maxRetransmits: 0 });
        
        window.guestConnections[guestId] = { peerConnection: pc, dataChannel: dc, profile: profile, inputs: {}, lastPing: Date.now() };
        
        dc.onopen = () => { console.log("Data Channel OPEN to Guest:", guestId); };
        dc.onmessage = (e) => { handleHostReceivedMessage(guestId, e.data); };
        dc.onclose = () => { handleGuestDisconnect(guestId); };

        pc.onicecandidate = (e) => { if (e.candidate) push(ref(db, `rooms/${roomId}/signals/${guestId}/hostCandidates`), e.candidate.toJSON()); };

        const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
        await set(ref(db, `rooms/${roomId}/signals/${guestId}/offer`), { type: offer.type, sdp: offer.sdp });

        onValue(ref(db, `rooms/${roomId}/signals/${guestId}/answer`), (snap) => {
            const answer = snap.val(); if (answer && pc.signalingState === 'have-local-offer') pc.setRemoteDescription(new RTCSessionDescription(answer));
        });

        onChildAdded(ref(db, `rooms/${roomId}/signals/${guestId}/guestCandidates`), (snap) => {
            const candidate = snap.val(); if (candidate && pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e=>{});
        });
    }

    window.startHostedGame = async function() {
        if (!window.isHost) return;
        await update(ref(db, `rooms/${window.currentRoomId}`), { status: 'playing' });
        
        // Compile player list
        window.playerProfiles = [window.playerProfile];
        window.guestIdToIndex = {};
        let idx = 1;
        for (const gid in window.guestConnections) {
            window.playerProfiles.push(window.guestConnections[gid].profile);
            window.guestIdToIndex[gid] = idx++;
        }
        
        let initData = { type: 'start', profiles: window.playerProfiles };
        for (const gid in window.guestConnections) {
            let dc = window.guestConnections[gid].dataChannel;
            if (dc && dc.readyState === 'open') {
                initData.yourIndex = window.guestIdToIndex[gid];
                dc.send(JSON.stringify(initData));
            }
        }
        
        document.getElementById('menu-lobby').classList.add('hidden'); document.getElementById('lobby-waiting').classList.add('hidden');
        window.initGame(window.playerProfiles.length);
    };

    function handleHostReceivedMessage(guestId, dataStr) {
        const msg = JSON.parse(dataStr);
        if (msg.type === 'input') {
            window.guestConnections[guestId].inputs = msg.keys;
        } else if (msg.type === 'rematch') {
            window.rematchVotes.add(guestId);
            checkRematch();
        }
    }

    function handleGuestDisconnect(guestId) {
        console.log("Guest disconnected:", guestId);
        if(window.guestConnections[guestId]) {
            if(window.fighters && window.fighters[window.guestIdToIndex[guestId]]) {
                window.fighters[window.guestIdToIndex[guestId]].hp = 0; // Kill them off
                window.fighters[window.guestIdToIndex[guestId]].stocks = 0;
            }
            delete window.guestConnections[guestId];
        }
    }

    window.joinPublicRoom = async function(roomId) {
        if (!user) return; window.stopLobbyListener();
        
        try {
            setLobbyStatus("Joining Lobby...");
            const snapshot = await get(ref(db, 'rooms/' + roomId));
            if (!snapshot.exists() || snapshot.val().status !== 'waiting') { setLobbyStatus("Lobby full or closed."); window.startLobbyListener(); return; }
            
            await set(ref(db, `rooms/${roomId}/guests/${user.uid}`), { profile: window.playerProfile });
            window.isHost = false; window.currentRoomId = roomId; window.myGuestId = user.uid;
            setLobbyStatus("Connecting...");

            onValue(ref(db, `rooms/${roomId}/signals/${user.uid}/offer`), async (snap) => {
                const offer = snap.val(); if (offer && !window.hostConnection) startGuestWebRTC(roomId, offer);
            });
        } catch (e) { console.error(e); setLobbyStatus("Join failed."); }
    };

    async function startGuestWebRTC(roomId, offer) {
        let pc = new RTCPeerConnection(rtcConfig);
        window.hostConnection = { peerConnection: pc, dataChannel: null };
        
        pc.ondatachannel = (e) => {
            window.hostConnection.dataChannel = e.channel;
            e.channel.onmessage = handleGuestReceivedMessage;
            e.channel.onclose = () => { 
                if(window.matchActive) {
                    document.getElementById('winner-text').innerText = "DISCONNECTED"; document.getElementById('winner-sub').innerText = "HOST LEFT.";
                    if(window.checkGameOverNetworkEvent) window.checkGameOverNetworkEvent();
                }
            };
        };

        pc.onicecandidate = (e) => { if (e.candidate) push(ref(db, `rooms/${roomId}/signals/${window.myGuestId}/guestCandidates`), e.candidate.toJSON()); };

        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
        await set(ref(db, `rooms/${roomId}/signals/${window.myGuestId}/answer`), { type: answer.type, sdp: answer.sdp });

        onChildAdded(ref(db, `rooms/${roomId}/signals/${window.myGuestId}/hostCandidates`), (snap) => {
            const candidate = snap.val(); if (candidate && pc.remoteDescription) pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e=>{});
        });
    }

    function handleGuestReceivedMessage(e) {
        const msg = JSON.parse(e.data);
        if (msg.type === 'start') {
            window.playerProfiles = msg.profiles;
            window.myPlayerIndex = msg.yourIndex;
            document.getElementById('menu-lobby').classList.add('hidden');
            window.initGame(msg.profiles.length);
        } else if (msg.type === 'sync') {
            window.applyHostSync(msg.data);
        } else if (msg.type === 'rematch') {
            window.remoteWantsRematch = true; checkRematch();
        } else if (msg.type === 'gameover') {
            // Force final HP states from host
            for(let i=0; i<msg.hps.length; i++) { if(window.fighters[i]) window.fighters[i].hp = msg.hps[i]; }
            if(window.matchActive) window.checkGameOver();
        }
    }

    // Network Utils
    window.onlineSendInput = function(logicalObj) {
        if (window.isHost) return; // Host processes locally
        let dc = window.hostConnection?.dataChannel;
        if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ type: 'input', keys: logicalObj }));
    };

    window.onlineSendSync = function(syncData) {
        if (!window.isHost) return;
        let str = JSON.stringify({ type: 'sync', data: syncData });
        for (const gid in window.guestConnections) {
            let dc = window.guestConnections[gid].dataChannel;
            if (dc && dc.readyState === 'open') dc.send(str);
        }
    };

    function checkRematch() {
        if (window.isOnlineGame) {
            let needed = window.isHost ? Object.keys(window.guestConnections).length + 1 : 2; // Rough estimate for now
            if (window.localWantsRematch && (window.rematchVotes.size >= needed - 1 || window.remoteWantsRematch)) {
                window.resetMatchForRematch();
            } else if (document.getElementById('winner-sub')) {
                document.getElementById('winner-sub').innerText = "WAITING FOR PLAYERS...";
            }
        } else {
            if (window.localWantsRematch) window.resetMatchForRematch();
        }
    }

    window.onlineRematchRequest = function() {
        window.localWantsRematch = true;
        let msg = JSON.stringify({ type: 'rematch' });
        if (window.isHost) {
            window.rematchVotes.add('host');
            for (const gid in window.guestConnections) {
                let dc = window.guestConnections[gid].dataChannel; if(dc && dc.readyState === 'open') dc.send(msg);
            }
        } else {
            let dc = window.hostConnection?.dataChannel; if (dc && dc.readyState === 'open') dc.send(msg);
        }
        document.getElementById('rematch-btn').classList.add('hidden'); checkRematch();
    };

    window.cleanupNetworkConnections = function() {
        if(window.hostConnection) { if(window.hostConnection.dataChannel) window.hostConnection.dataChannel.close(); window.hostConnection.peerConnection.close(); window.hostConnection = null; }
        for (const gid in window.guestConnections) {
            if(window.guestConnections[gid].dataChannel) window.guestConnections[gid].dataChannel.close();
            window.guestConnections[gid].peerConnection.close();
        }
        window.guestConnections = {};
        if(window.roomListenerUnsub) { window.roomListenerUnsub(); window.roomListenerUnsub = null; }
        if(window.currentRoomId && window.isHost) { remove(ref(db, 'rooms/' + window.currentRoomId)).catch(e=>{}); }
        window.currentRoomId = null; window.isHost = false;
    };
</script>

    function drawPreviewLoop() {
        if (document.getElementById('menu-profile').classList.contains('hidden')) return;
        const cvs = document.getElementById('previewCanvas'); const cx = cvs.getContext('2d');
        cx.clearRect(0, 0, cvs.width, cvs.height);
        cx.fillStyle = '#18181b'; cx.beginPath(); cx.ellipse(100, 260, 75, 15, 0, 0, Math.PI*2); cx.fill();
        
        previewFighter.profile = tempProfile;
        if (previewFighter.stateTimer > 0) previewFighter.stateTimer--; else { previewFighter.changeState(ST_TAUNT, 120); previewFighter.currentTaunt = parseInt(tempProfile.emote) || 0; }
        previewFighter.tauntCooldown = 0; previewFighter.updateAnimation(); previewFighter.draw(cx, 260); 
        
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += (p.gravity !== undefined ? p.gravity : 0.8); p.life -= (p.decay !== undefined ? p.decay : 0.035);
            cx.fillStyle = p.color; cx.globalAlpha = Math.max(0, p.life); cx.beginPath(); cx.arc(p.x, p.y - (GROUND_Y - 260), p.size !== undefined ? p.size : 4, 0, Math.PI*2); cx.fill();
            cx.globalAlpha = 1.0; if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; t.y += t.vy; t.vy *= 0.92; t.life -= 0.015;
            cx.globalAlpha = Math.max(0, Math.min(1.0, t.life)); cx.fillStyle = t.color; cx.font = t.big ? "900 38px Oswald" : "900 24px Oswald"; cx.textAlign = "center";
            cx.strokeStyle = "#000"; cx.lineWidth = 6; cx.strokeText(t.text, t.x, t.y - (GROUND_Y - 260)); cx.fillText(t.text, t.x, t.y - (GROUND_Y - 260));
            cx.globalAlpha = 1.0; if (t.life <= 0) texts.splice(i, 1);
        }
        previewReq = requestAnimationFrame(drawPreviewLoop);
    }

    window.showLobbyMenu = function() {
        document.getElementById('menu-primary').classList.add('hidden'); document.getElementById('menu-lobby').classList.remove('hidden'); document.getElementById('menu-lobby').classList.add('flex');
        document.getElementById('lobby-waiting').classList.add('hidden'); document.getElementById('lobby-waiting').classList.remove('flex');
        document.getElementById('lobby-options').classList.remove('hidden'); document.getElementById('lobby-options').classList.add('flex');
        window.startLobbyListener();

    window.hideLobbyMenu = function() { document.getElementById('menu-primary').classList.remove('hidden'); document.getElementById('menu-lobby').classList.add('hidden'); document.getElementById('menu-lobby').classList.remove('flex'); window.stopLobbyListener(); };
    window.cancelHosting = function() { window.cleanupNetworkConnections(); document.getElementById('lobby-waiting').classList.add('hidden'); document.getElementById('lobby-waiting').classList.remove('flex'); document.getElementById('lobby-options').classList.remove('hidden'); document.getElementById('lobby-options').classList.add('flex'); window.startLobbyListener(); };
</script>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const GROUND_Y = H - 100;
    const GRAVITY = 0.8;

    const ST_IDLE = 0, ST_MOVE = 1, ST_DASH = 2, ST_BLOCK = 3;
    const ST_P_JAB = 4, ST_P_CROSS = 5, ST_P_HOOK = 6;
    const ST_HITSTUN = 7, ST_KNOCKDOWN = 8, ST_DODGE = 9, ST_PARRY = 10;
    const ST_KNEE = 11, ST_KICK = 12, ST_CLINCH_ATTEMPT = 13, ST_CLINCHED = 14;
    const ST_AERIAL_PUNCH = 15, ST_AERIAL_KICK = 16, ST_P_UPPERCUT = 17, ST_TAUNT = 18;
    const ST_SUPLEX = 19, ST_BEING_SUPLEXED = 20;

    const ATTACK_DATA = {
        [ST_P_JAB]:   { dmg: 4,  stamDmg: 10, stamCost: 15, reach: 95, windup: 14, active: 5, recov: 12, stun: 20, name: "JAB" },
        [ST_P_CROSS]: { dmg: 12, stamDmg: 20, stamCost: 20, reach: 70, windup: 22, active: 6, recov: 18, stun: 30, name: "CROSS" },
        [ST_P_HOOK]:  { dmg: 22, stamDmg: 40, stamCost: 35, reach: 60, windup: 35, active: 8, recov: 24, stun: 45, name: "HOOK", guardBreak: true },
        [ST_P_UPPERCUT]: { dmg: 16, stamDmg: 20, stamCost: 20, reach: 60, windup: 16, active: 8, recov: 22, stun: 30, name: "UPPERCUT", antiAir: true },
        [ST_KNEE]:    { dmg: 14, stamDmg: 25, stamCost: 20, reach: 50, windup: 14, active: 6, recov: 18, stun: 28, name: "KNEE" },
        [ST_KICK]:    { dmg: 18, stamDmg: 45, stamCost: 30, reach: 90, windup: 28, active: 8, recov: 25, stun: 40, name: "KICK", guardBreak: true, knockdown: true },
        [ST_CLINCH_ATTEMPT]: { dmg: 0, stamDmg: 0, stamCost: 35, reach: 45, windup: 12, active: 6, recov: 25, stun: 0, name: "CLINCH" },
        [ST_AERIAL_PUNCH]:   { dmg: 10, stamDmg: 15, stamCost: 15, reach: 75, windup: 12, active: 6, recov: 15, stun: 25, name: "AIR PUNCH" },
        [ST_AERIAL_KICK]:    { dmg: 16, stamDmg: 25, stamCost: 25, reach: 90, windup: 16, active: 8, recov: 20, stun: 30, name: "AIR KICK", guardBreak: true, knockdown: true }
    };

    const KEYS_P1 = { left: ['a'], right: ['d'], block: ['s'], dash: ['shift'], jab: ['j'], cross: ['k'], hook: ['l'], uppercut: ['h'], jump: ['w', ' '], knee: ['u'], kick: ['i'], clinch: ['o'], clinchMash: [' '], taunt: ['t'] };
    const KEYS_P2 = { left: ['arrowleft'], right: ['arrowright'], block: ['arrowdown'], dash: ['enter', '0'], jab: ['1', '['], cross: ['2', ']'], hook: ['3', '\\'], uppercut: ['7', '\''], jump: ['arrowup'], knee: ['4', '-'], kick: ['5', '='], clinch: ['6', 'backspace'], clinchMash: ['0', 'enter'], taunt: ['8', 'p'] };

    let keysDown = {}; let prevKeysDown = {};
    window.addEventListener('keydown', e => { keysDown[e.key.toLowerCase()] = true; }); window.addEventListener('keyup', e => { keysDown[e.key.toLowerCase()] = false; });
    function checkKey(keysArray, keyStateObj) { return keysArray ? keysArray.some(k => keyStateObj[k]) : false; }

    window.camera = { x: W/2, y: H/2, scale: 1.0, targetX: W/2, targetY: H/2, targetScale: 1.0 };
    window.currentMap = { type: 'boxing', stage: {x: 0, y: GROUND_Y, w: W}, platforms: [], jumpPads: [] };

    let particles = []; let texts = []; let screenShake = 0;
    let clinchActive = false; let clinchTimer = 0; let clinchScoreP1 = 0; let clinchScoreP2 = 0; const CLINCH_MAX_TIME = 180;
    
    function spawnParticles(x, y, color, count, speedMulti=1) { for(let i=0; i<count; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*25 * speedMulti, vy: (Math.random()-0.5)*25 * speedMulti - 4, life: 1.0, maxLife: 1.0, decay: 0.035, size: 4, color: color, gravity: 0.8 }); }
    function addParticle(x, y, vx, vy, color, life=1.0, decay=0.035, size=4, gravity=0.8) { particles.push({x, y, vx, vy, color, life, maxLife: life, decay, size, gravity}); }
    function spawnText(x, y, txt, color, isBig=false, initialLife=1.0) { texts.push({ x, y, text: txt, color, life: initialLife, maxLife: initialLife, big: isBig, vy: -1.5 }); }

    class Fighter {
        constructor(playerIndex, profileData) {
            this.idx = playerIndex;
            this.profile = profileData || { name: 'CPU', hat: 'none', accessory: 'none', taunt: '', emote: '0', finisher: '' };
            const colors = ['#1d4ed8', '#b91c1c', '#047857', '#eab308'];
            this.color = colors[playerIndex % 4]; 
            
            this.maxHp = 100; this.hp = 100; this.stocks = window.currentMap.type === 'smash' ? 3 : 1;
            this.maxStamina = 300; this.stamina = 300;
            this.feintCooldown = 0; this.tauntCooldown = 0; this.currentTaunt = 0;
            
            this.width = 50; this.height = 150;
            this.x = 0; this.y = GROUND_Y; this.vx = 0; this.vy = 0;
            this.facing = 1; this.jumpsLeft = 2; this.airDashesLeft = 1;
            
            this.state = ST_IDLE; this.stateTimer = 0; this.hitboxActive = false; this.parryCooldown = 0;
            this.invincibleTimer = 0;
            
            this.duckAmount = 0; this.targetDuck = 0; this.swayAmount = 0; 
            this.rotation = 0; this.kdRotVel = 0; this.groundOffset = 0;

            this.headOffset = {x: 0, y: -this.height + 15};
            this.gloveL = {x: 0, y: 0, targetX: 0, targetY: 0}; this.gloveR = {x: 0, y: 0, targetX: 0, targetY: 0};
            this.footL = {x: 0, y: 0, targetX: 0, targetY: 0}; this.footR = {x: 0, y: 0, targetX: 0, targetY: 0};
            this.resetTargets();
        }

        getIsGrounded() {
            if (this.y >= GROUND_Y) return true;
            for (let p of window.currentMap.platforms) {
                if (this.vy >= 0 && this.y >= p.y - 10 && this.y <= p.y + 10 && this.x > p.x - this.width/2 && this.x < p.x + p.w + this.width/2) return true;
            }
            return false;
        }

        resetTargets() {
            this.gloveL.targetX = this.facing * 25; this.gloveL.targetY = -95;
            this.gloveR.targetX = this.facing * 5; this.gloveR.targetY = -105;
            this.footL.targetX = -15; this.footL.targetY = 0;
            this.footR.targetX = 15; this.footR.targetY = 0;
        }

        changeState(newState, timer) { this.state = newState; this.stateTimer = timer; this.hitboxActive = false; }

        parriedAttack(hitX, hitY) {
            spawnParticles(hitX, hitY, '#60a5fa', 50, 2.5); spawnParticles(hitX, hitY, '#ffffff', 30, 3.0); 
            spawnText(this.x, this.y - 180, "DEFLECT", "#60a5fa", true);
            this.stamina = Math.min(this.maxStamina, this.stamina + 100); screenShake = 8;
        }

        gotParriedStun(incomingStamDmg) {
            this.stamina -= (incomingStamDmg * 2.5); 
            if (this.stamina <= 0) { this.stamina = 0; this.changeState(ST_HITSTUN, 100); this.vx = -this.facing * 8; spawnText(this.x, this.y - 180, "POSTURE BROKEN!", "#dc2626", true); } 
            else { this.changeState(ST_HITSTUN, 50); this.vx = -this.facing * 5; }
        }

        takeDamage(dmg, stamDmg, stunFrames, isCounter, hitX, hitY, isUnblockable, causesKnockdown = false, isAntiAir = false) {
            if (this.state === ST_KNOCKDOWN || this.state === ST_CLINCHED || this.state === ST_BEING_SUPLEXED || this.state === ST_SUPLEX || this.invincibleTimer > 0) return;

            let finalDmg = dmg; screenShake = 8;
            let isAntiAirHit = isAntiAir && !this.getIsGrounded();

            if (this.state === ST_BLOCK && !isUnblockable && !isAntiAirHit) {
                finalDmg = Math.max(1, Math.floor(dmg * 0.3)); this.stamina -= stamDmg; 
                if (this.stamina <= 0) {
                    this.stamina = 0; spawnText(this.x, this.y - 180, "GUARD CRUSH!", "#facc15", true); finalDmg = dmg; stunFrames = 50; screenShake = 15;
                } else {
                    spawnParticles(hitX, hitY, '#71717a', 20, 0.8); this.changeState(ST_HITSTUN, 14); this.vx = -this.facing * 3; this.hp -= finalDmg; 
                    spawnText(hitX, hitY - 50, `BLOCK -${finalDmg}`, "#a1a1aa"); if (this.hp <= 0) this.handleDeath(); return; 
                }
            }

            if (isUnblockable && (this.state === ST_BLOCK || this.state === ST_PARRY)) { spawnText(this.x, this.y - 200, "GUARD CRUSH!", "#ef4444", true); stunFrames += 20; screenShake = 20; }
            if (isAntiAirHit) { finalDmg = Math.floor(finalDmg * 1.5); stunFrames += 20; causesKnockdown = true; spawnText(this.x, this.y - 200, "ANTI-AIR!", "#facc15", true); screenShake = 20; } 
            else if (isCounter && !isUnblockable) { finalDmg = Math.floor(finalDmg * 1.5); stunFrames = Math.floor(stunFrames * 1.5); spawnText(this.x, this.y - 200, "COUNTER!", "#ef4444", true); screenShake = 15; }

            if (this.state !== ST_BLOCK && this.state !== ST_PARRY) { this.stamina -= stamDmg * 0.5; if(this.stamina < 0) this.stamina = 0; }
            this.hp -= finalDmg;
            
            // White Screen Flash on Heavy Hit
            if (finalDmg >= 15) { 
                ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(0,0,W,H); 
                spawnParticles(hitX, hitY, '#991b1b', 60, 2.5); // Extra blood
            } else {
                spawnParticles(hitX, hitY, '#991b1b', 30, 1.5);
            }
            
            spawnText(hitX, hitY - 40, `-${finalDmg}`, "#fff", true);

            let knockbackMod = window.currentMap.type === 'smash' ? (1 + (100 - Math.max(0, this.hp)) * 0.02) : 1;

            if (this.hp <= 0 && window.currentMap.type === 'boxing') {
                this.handleDeath();
            } else if (causesKnockdown && (this.state !== ST_BLOCK || isUnblockable)) {
                this.changeState(ST_KNOCKDOWN, 65); this.vx = -this.facing * 12 * knockbackMod; this.vy = -10 * knockbackMod; this.kdRotVel = this.facing * 0.2; 
                screenShake = 25; spawnText(this.x, this.y - 180, "LAUNCHED!", "#facc15", true);
            } else {
                this.changeState(ST_HITSTUN, stunFrames); this.vx = -this.facing * (isCounter || isAntiAirHit ? 10 : 5) * knockbackMod;
            }
        }
        
        handleDeath() {
            this.hp = 0;
            if (window.currentMap.type === 'smash') {
                this.stocks--; screenShake = 40; spawnParticles(this.x, this.y, this.color, 100, 5);
                if (this.stocks > 0) {
                    this.hp = 100; this.stamina = 300; this.x = W/2 + (Math.random()-0.5)*400; this.y = -300; this.vx = 0; this.vy = 0;
                    this.changeState(ST_IDLE, 0); this.invincibleTimer = 180;
                } else {
                    this.changeState(ST_KNOCKDOWN, 9999); this.y = 9999; // Banish to void
                }
            } else {
                this.changeState(ST_KNOCKDOWN, 999); this.vx = -this.facing * 15; this.vy = -18; this.kdRotVel = this.facing * 0.4; screenShake = 30;
            }
        }

        findClosestOpponent() {
            let closest = null; let minDist = Infinity;
            for (let i=0; i<window.fighters.length; i++) {
                let f = window.fighters[i];
                if (f.idx !== this.idx && f.hp > 0 && f.stocks > 0 && f.y < GROUND_Y + 500) {
                    let d = Math.abs(this.x - f.x) + Math.abs(this.y - f.y);
                    if (d < minDist) { minDist = d; closest = f; }
                }
            }
            return closest;
        }

        updateLocal(isActive, keyMap, activeKeysDown, activePrevKeysDown) {
            let isGrounded = this.getIsGrounded();
            if (isGrounded) { this.jumpsLeft = 2; this.airDashesLeft = 1; }

            if (this.invincibleTimer > 0) this.invincibleTimer--;

            if (this.state === ST_BEING_SUPLEXED) {
                if (this.stateTimer > 0) this.stateTimer--;
                let suplexer = this.findClosestOpponent(); // Assuming it's the one who grabbed us
                if(suplexer && suplexer.state === ST_SUPLEX) {
                    let elapsed = 90 - this.stateTimer;
                    if (elapsed < 20) { this.x = suplexer.x + suplexer.facing * 30; this.y = suplexer.y; } 
                    else if (elapsed < 50) { let progress = (elapsed - 20) / 30; this.x = suplexer.x + suplexer.facing * (30 - progress * 90); this.y = suplexer.y - Math.sin(progress * Math.PI) * 140; } 
                    else { this.y = suplexer.y; }
                }
                this.vx = 0; this.vy = 0; return; 
            }

            if (this.state === ST_SUPLEX) {
                if (this.stateTimer > 0) this.stateTimer--;
                if (this.stateTimer === 40) { // Slam Impact
                    screenShake = 40; spawnParticles(this.x - this.facing * 40, this.y, '#f1f5f9', 50, 3.5); spawnParticles(this.x - this.facing * 40, this.y, '#7f1d1d', 30, 2.0); spawnText(this.x - this.facing * 40, this.y - 50, "SLAM!", "#dc2626", true, 2.0);
                    let target = this.findClosestOpponent();
                    if(target) {
                        target.hp -= 35;
                        if (target.hp <= 0 && window.currentMap.type === 'boxing') target.handleDeath();
                        else { target.changeState(ST_KNOCKDOWN, 80); target.vy = -16; target.vx = -this.facing * 10; target.kdRotVel = (Math.random() - 0.5) * 0.8; }
                    }
                } else if (this.stateTimer === 0) this.changeState(ST_IDLE, 0);
                this.applyPhysics(); return;
            }

            if (this.state === ST_KNOCKDOWN) { 
                this.applyPhysics(); 
                if (this.stateTimer < 999 && this.stateTimer > 0) {
                    this.stateTimer--;
                    if (this.stateTimer === 0 && this.hp > 0 && this.stocks > 0) { this.changeState(ST_IDLE, 0); this.vy = -8; }
                }
                return; 
            }
            if (clinchActive) { this.applyPhysics(); return; }

            if (isGrounded && (this.state === ST_IDLE || this.state === ST_MOVE)) this.stamina = Math.min(this.maxStamina, this.stamina + 1.8); 

            if (this.parryCooldown > 0) this.parryCooldown--;
            if (this.feintCooldown > 0) this.feintCooldown--;
            if (this.tauntCooldown > 0) this.tauntCooldown--;

    function processCPU(cpuFighter) {
        if (!matchActive || cpuFighter.state === ST_KNOCKDOWN || cpuFighter.hp <= 0) return;
        if (!cpuFighter.cpuInputs) cpuFighter.cpuInputs = {}; if (!cpuFighter.cpuReactionTimer) cpuFighter.cpuReactionTimer = 0;
        
        let prof = { reactBase: 5, reactRand: 10, block: 0.85, dodge: 0.50, atkFreq: 0.80, mashSpd: 4 }; // Pro
        if (clinchActive) { cpuFighter.cpuReactionTimer--; if (cpuFighter.cpuReactionTimer <= 0) { cpuFighter.cpuInputs['0'] = !cpuFighter.cpuInputs['0']; cpuFighter.cpuReactionTimer = prof.mashSpd + Math.random() * (prof.mashSpd * 1.5); } return; }
        
        cpuFighter.cpuReactionTimer--; if (cpuFighter.cpuReactionTimer > 0) return; 
        cpuFighter.cpuReactionTimer = prof.reactBase + Math.random() * prof.reactRand; 
        Object.keys(cpuFighter.cpuInputs).forEach(k => cpuFighter.cpuInputs[k] = false);
        
        // AI Platform Recovery Logic
        if (cpuFighter.y > GROUND_Y + 50 || cpuFighter.x < window.currentMap.stage.x || cpuFighter.x > window.currentMap.stage.x + window.currentMap.stage.w) {
            if (!cpuFighter.getIsGrounded()) {
                if (cpuFighter.jumpsLeft > 0) cpuFighter.cpuInputs.arrowup = true;
                if (cpuFighter.x < window.currentMap.stage.x + window.currentMap.stage.w/2) { cpuFighter.cpuInputs.arrowright = true; if(cpuFighter.airDashesLeft > 0) cpuFighter.cpuInputs.enter = true; }
                else { cpuFighter.cpuInputs.arrowleft = true; if(cpuFighter.airDashesLeft > 0) cpuFighter.cpuInputs.enter = true; }
                cpuFighter.cpuReactionTimer = 5; return;
            }
        }

        let target = cpuFighter.findClosestOpponent(); if(!target) return;

        let dist = Math.abs(target.x - cpuFighter.x); let vertDist = target.y - cpuFighter.y;
        let isP1Attacking = target.hitboxActive || (ATTACK_DATA[target.state] && target.stateTimer > ATTACK_DATA[target.state].recov);
        let movingAway = cpuFighter.x > target.x ? 'arrowright' : 'arrowleft'; let movingToward = cpuFighter.x > target.x ? 'arrowleft' : 'arrowright';

        if (isP1Attacking && cpuFighter.stamina > 20) { if (Math.random() < prof.block) { cpuFighter.cpuInputs.arrowdown = true; cpuFighter.cpuReactionTimer = 25; return; } else if (Math.random() < prof.dodge) { cpuFighter.cpuInputs.enter = true; return; } }
        if (cpuFighter.stamina < 50 && !isP1Attacking) { cpuFighter.cpuInputs[movingAway] = true; if(Math.random() < 0.1) cpuFighter.cpuInputs.enter = true; cpuFighter.cpuReactionTimer = 15; return; }

        if (vertDist < -80 && cpuFighter.jumpsLeft > 0) { cpuFighter.cpuInputs.arrowup = true; cpuFighter.cpuReactionTimer = 10; return; } // Jump to platform
        
        if (dist > 180) {
            cpuFighter.cpuInputs[movingToward] = true;
            if (Math.random() < 0.2 && cpuFighter.stamina > 20) cpuFighter.cpuInputs.enter = true; 
            if (Math.random() < 0.1) cpuFighter.cpuInputs.arrowup = true; 
            if (Math.random() < 0.01) cpuFighter.cpuInputs['8'] = true; 
            cpuFighter.cpuReactionTimer = 15; 
        } else {
            if (Math.random() < prof.atkFreq && cpuFighter.stamina >= 20) {
                let rand = Math.random();
                if (target.y < cpuFighter.y - 30 && dist < 120 && Math.random() < 0.7) cpuFighter.cpuInputs['7'] = true; // Anti-air
                else if (vertDist > 50) cpuFighter.cpuInputs['5'] = true; // Drop kick
                else {
                    if (rand < 0.20) cpuFighter.cpuInputs['1'] = true; else if (rand < 0.40) cpuFighter.cpuInputs['2'] = true; else if (rand < 0.55) cpuFighter.cpuInputs['3'] = true; else if (rand < 0.70) cpuFighter.cpuInputs['7'] = true; else if (rand < 0.85) cpuFighter.cpuInputs['4'] = true; else if (rand < 0.95) cpuFighter.cpuInputs['5'] = true; else cpuFighter.cpuInputs['6'] = true; 
                }
                cpuFighter.cpuReactionTimer = 35; 
            } else { if (Math.random() < 0.5) cpuFighter.cpuInputs[movingAway] = true; else cpuFighter.cpuInputs[movingToward] = true; cpuFighter.cpuReactionTimer = 15; }
        }
    }

    function processClinch(p1Active, p1Prev, p2Active, p2Prev) {

                winnerTxt = "DOUBLE K.O.";
            } else {
                winnerTxt = "TIME UP";
            }
            
            document.getElementById('winner-text').innerText = winnerTxt; 
            if (window.remoteWantsRematch || window.rematchVotes.size > 0) document.getElementById('winner-sub').innerText = "PLAYERS WANT REMATCH..."; else document.getElementById('winner-sub').innerText = subTxt;
        }, 2000);
    };

    function gameLoop(timestamp) {
        if (!gameStarted) return; requestAnimationFrame(gameLoop);
        if (!lastLoopTime) lastLoopTime = timestamp; const dt = timestamp - lastLoopTime; if (dt < 16) return; lastLoopTime = timestamp - (dt % 16); 
        
        if (matchActive && !clinchActive) { gameTimer -= 1/60; window.checkGameOver(); }

        // Update Moving Platforms
        if (matchActive) {
            for (let p of window.currentMap.platforms) {
                if (p.moving) {
                    p.x += p.vx;
                    if (p.x > W/2 + 200 || p.x < W/2 - 400) p.vx *= -1;
                }
            }
        }

        let myLogical = getLogicalInputs(keysDown, KEYS_P1);
        
        if (window.isOnlineGame) {
            let strMyLogical = JSON.stringify(myLogical);
            if (strMyLogical !== window.localCacheString && window.onlineSendInput) { window.onlineSendInput(myLogical); window.localCacheString = strMyLogical; }

            let allKeys = [];
            if (window.isHost) {
                allKeys[0] = keysDown;
                for(let i=1; i<window.fighters.length; i++) {
                    let gid = Object.keys(window.guestIdToIndex).find(key => window.guestIdToIndex[key] === i);
                    allKeys[i] = gid && window.guestConnections[gid] ? applyLogicalToPhysical(window.guestConnections[gid].inputs, false) : {};
                }
                syncTimer++;
                if (syncTimer >= 5) {
                    syncTimer = 0;
                    let syncData = { t: gameTimer, fighters: window.fighters.map(f => ({ hp: f.hp, s: f.stamina, st: f.stocks, x: f.x })) };
                    window.onlineSendSync(syncData);
                }
            } else {
                allKeys[window.myPlayerIndex] = myLogical; // Will be mapped physically below
                for(let i=0; i<window.fighters.length; i++) {
                    if(i !== window.myPlayerIndex && window.fighters[i].targetXSync !== undefined) {
                        window.fighters[i].x += (window.fighters[i].targetXSync - window.fighters[i].x) * 0.15;
                    }
                }
            }

            if(window.fighters.length === 2 && matchActive) processClinch(allKeys[0], prevKeysDown, allKeys[1], cpuPrevInputs);
            
            for(let i=0; i<window.fighters.length; i++) {
                let f = window.fighters[i];
                let isMe = window.isHost ? (i===0) : (i===window.myPlayerIndex);
                let keys = window.isHost ? allKeys[i] : (isMe ? applyLogicalToPhysical(myLogical, true) : {});
                let prev = isMe ? prevKeysDown : {};
                if (window.isHost || isMe) f.updateLocal(matchActive, isMe ? KEYS_P1 : KEYS_P2, keys, prev);
            }
            prevKeysDown = window.isHost ? allKeys[0] : applyLogicalToPhysical(myLogical, true);

        } else {
            let allKeys = [keysDown];
            if (vsCPU) {
                for(let i=1; i<window.fighters.length; i++) {
                    processCPU(window.fighters[i]);
                    allKeys.push(window.fighters[i].cpuInputs);
                }
            } else {
                allKeys.push(keysDown); // P2 Local uses same keyboard map object, just different keys
            }
            
            if(window.fighters.length === 2 && matchActive) processClinch(allKeys[0], prevKeysDown, allKeys[1], cpuPrevInputs);

            for(let i=0; i<window.fighters.length; i++) {
                let f = window.fighters[i];
                let map = i === 0 ? KEYS_P1 : KEYS_P2;
                f.updateLocal(matchActive, map, allKeys[i], i===0 ? prevKeysDown : cpuPrevInputs);
            }
            
            prevKeysDown = { ...keysDown }; 
            if(!vsCPU) cpuPrevInputs = { ...keysDown }; else cpuPrevInputs = { ...window.fighters[1].cpuInputs };
        }
        
        for(let f of window.fighters) f.updateAnimation();
        drawGame();
    }

    function drawGame() {
        ctx.save();
        if(screenShake > 0) { ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake); screenShake *= 0.85; if(screenShake < 0.5) screenShake = 0; }

        ctx.clearRect(0, 0, W, H);
        
        // Dynamic Camera Logic (Follow local player)
        let localIdx = window.isOnlineGame && !window.isHost ? window.myPlayerIndex : 0;
        let mainTarget = window.fighters[localIdx];
        if (mainTarget.stocks <= 0 || mainTarget.hp <= 0) {
            let alive = window.fighters.filter(f => f.hp > 0 && f.stocks > 0);
            if(alive.length > 0) mainTarget = alive[0]; // Spectate
        }

        window.camera.targetX = mainTarget.x;
        window.camera.targetY = Math.min(GROUND_Y, mainTarget.y - 100);
        window.camera.targetScale = window.currentMap.type === 'smash' ? 0.75 : 1.0;

        window.camera.x += (window.camera.targetX - window.camera.x) * 0.1;
        window.camera.y += (window.camera.targetY - window.camera.y) * 0.1;
        window.camera.scale += (window.camera.targetScale - window.camera.scale) * 0.05;

        // Apply Camera Transform
        ctx.translate(W/2, H/2);
        ctx.scale(window.camera.scale, window.camera.scale);
        ctx.translate(-window.camera.x, -window.camera.y);

        // Draw Environments
        if (window.currentMap.type === 'smash') {
            // Parallax Industrial Void
            let px = window.camera.x * 0.2; let py = window.camera.y * 0.2;
            ctx.fillStyle = '#050505'; ctx.fillRect(window.camera.x - W/window.camera.scale, window.camera.y - H/window.camera.scale, W*2/window.camera.scale, H*2/window.camera.scale);
            ctx.strokeStyle = '#18181b'; ctx.lineWidth = 4;
            for(let i=-2000; i<2000; i+=100) { ctx.beginPath(); ctx.moveTo(i + px, -1000 + py); ctx.lineTo(i + (i)*0.3 + px, 2000 + py); ctx.stroke(); }
            
            // Floating Stage
            ctx.fillStyle = '#18181b'; ctx.beginPath(); ctx.roundRect(window.currentMap.stage.x, window.currentMap.stage.y, window.currentMap.stage.w, 400, 4); ctx.fill();
            ctx.fillStyle = '#27272a'; ctx.fillRect(window.currentMap.stage.x, window.currentMap.stage.y, window.currentMap.stage.w, 20);
            
            // Jump Pads (Vents)
            for (let pad of window.currentMap.jumpPads) {
                ctx.fillStyle = '#06b6d4'; ctx.fillRect(pad.x, pad.y, pad.w, 5);
                ctx.fillStyle = `rgba(6, 182, 212, ${Math.sin(Date.now()/100)*0.3 + 0.3})`;
                ctx.fillRect(pad.x, pad.y - 40, pad.w, 40); // Glow
            }

            // Platforms
            for(let p of window.currentMap.platforms) {
                ctx.fillStyle = '#18181b'; ctx.fillRect(p.x, p.y, p.w, 20);
                ctx.strokeStyle = p.moving ? '#dc2626' : '#3f3f46'; ctx.lineWidth = 4; ctx.strokeRect(p.x, p.y, p.w, 20);
            }
        } else {
            // Boxing Ring
            ctx.fillStyle = '#050505'; ctx.fillRect(window.camera.x - W, window.camera.y - H, W*2, H*2);
            
            // Spotlight
            let spot = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W);
            spot.addColorStop(0, 'rgba(255,255,255,0.05)'); spot.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = spot; ctx.fillRect(window.camera.x - W, window.camera.y - H, W*2, H*2);

            // Ropes
            ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-W, H/2 - 120); ctx.lineTo(W*2, H/2 - 120); ctx.stroke();
            ctx.strokeStyle = '#a1a1aa'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-W, H/2 - 50); ctx.lineTo(W*2, H/2 - 50); ctx.stroke();
            ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-W, H/2 + 20); ctx.lineTo(W*2, H/2 + 20); ctx.stroke();

            // Floor
            ctx.fillStyle = '#18181b'; ctx.fillRect(-W, GROUND_Y, W*3, H);
            ctx.strokeStyle = '#27272a'; ctx.lineWidth = 2;
            for(let i=-W; i<W*2; i+=40) { ctx.beginPath(); ctx.moveTo(i, GROUND_Y); ctx.lineTo(i + (i-W/2)*0.5, H*2); ctx.stroke(); }
        }

        // Draw Fighters (Sorted by Y to fix overlapping)
        let sortedFighters = [...window.fighters].sort((a, b) => a.y - b.y);
        for(let f of sortedFighters) { if (f.hp > 0 || f.state === ST_KNOCKDOWN) f.draw(ctx); }

        // Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += (p.gravity !== undefined ? p.gravity : 0.8); p.life -= (p.decay !== undefined ? p.decay : 0.035);
            ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); 
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size !== undefined ? p.size : 4, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0; if (p.life <= 0) particles.splice(i, 1);
        }
        
        // Draw Texts
        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; t.y += t.vy; t.vy *= 0.92; t.life -= 0.015;
            ctx.globalAlpha = Math.max(0, Math.min(1.0, t.life)); ctx.fillStyle = t.color;
            ctx.font = t.big ? "900 50px Oswald" : "900 30px Oswald"; ctx.textAlign = "center";
            ctx.strokeStyle = "#000"; ctx.lineWidth = 8; ctx.strokeText(t.text, t.x, t.y); ctx.fillText(t.text, t.x, t.y);
            ctx.globalAlpha = 1.0; if (t.life <= 0) texts.splice(i, 1);
        }

        // Clinch Overlay
        if (clinchActive) {
            ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(window.camera.x - W, window.camera.y - H, W*2, H*2);
            ctx.fillStyle = "white"; ctx.font = "900 80px Oswald"; ctx.textAlign = "center";
            ctx.fillText("CLINCH! MASH!", window.camera.x, window.camera.y - 150);
            
            let totalScore = Math.max(1, clinchScoreP1 + clinchScoreP2); let p1Ratio = clinchScoreP1 / totalScore;
            let barX = window.camera.x - 350; let barY = window.camera.y;
            ctx.fillStyle = "#18181b"; ctx.fillRect(barX, barY, 700, 50);
            ctx.fillStyle = "#1d4ed8"; ctx.fillRect(barX, barY, 700 * p1Ratio, 50);
            ctx.fillStyle = "#b91c1c"; ctx.fillRect(barX + (700 * p1Ratio), barY, 700 * (1 - p1Ratio), 50);
            ctx.strokeStyle = "white"; ctx.lineWidth = 6; ctx.strokeRect(barX, barY, 700, 50);
        }

        ctx.restore(); updateUI();
    }
</script>
