                    this.footR.targetX = dragX + 10; this.footR.targetY = dragY - 40;
                    this.headOffset.y += dragY * 0.05;
                    this.headOffset.x += dragX * 0.05;
                } else {
                    targetGroundOffset = 40;
                    this.gloveL.targetX = 50; this.gloveL.targetY = -10;
                    this.gloveR.targetX = -50; this.gloveR.targetY = 10;
                    this.footL.targetX = 40; this.footL.targetY = 20;
                    this.footR.targetX = -40; this.footR.targetY = 10;
                }
            } else if (this.state === ST_DODGE) {
                this.gloveL.targetX = this.facing * 10; this.gloveL.targetY = -80;
                this.gloveR.targetX = this.facing * 5;  this.gloveR.targetY = -70;
            } else if (this.state === ST_SUPLEX) {
                const elapsed = 90 - this.stateTimer;
                if (elapsed < 20) {
                    this.gloveL.targetX = this.facing * 40; this.gloveL.targetY = -90;
                    this.gloveR.targetX = this.facing * 40; this.gloveR.targetY = -90;
                    this.targetDuck = 20;
                } else if (elapsed < 50) {
                    let prog = (elapsed - 20) / 30;
                    targetRotation = -this.facing * (Math.PI * 0.6) * prog;
                    this.gloveL.targetX = this.facing * 10; this.gloveL.targetY = -150;
                    this.gloveR.targetX = this.facing * 10; this.gloveR.targetY = -150;
                    this.targetDuck = 10;
                } else {
                    targetRotation = -this.facing * (Math.PI * 0.6); 
                    if (elapsed > 70) targetRotation *= (90 - elapsed) / 20; 
                }
            } else if (this.state === ST_BEING_SUPLEXED) {
                const elapsed = 90 - this.stateTimer;
                if (elapsed < 20) {
                    this.gloveL.targetY = -30; this.gloveR.targetY = -30;
                } else if (elapsed < 50) {
                    targetRotation = Math.PI * 0.8 * -this.facing; 
                    this.gloveL.targetY = -150; this.gloveR.targetY = -150; 
                } else {
                    targetRotation = Math.PI * -this.facing; 
                    targetGroundOffset = 40;
                }
            } else if (this.state === ST_TAUNT) {
                const elapsed = 120 - this.stateTimer;
                if (this.currentTaunt === 0) { 
                    this.gloveL.targetX = -this.facing * 75; this.gloveL.targetY = -110;
                    this.gloveR.targetX = this.facing * 75; this.gloveR.targetY = -110;
                    this.footL.targetY = -35; this.footR.targetY = -35;
                    targetGroundOffset = -60;
                    targetRotation = 0;
                    this.targetDuck = 0;
                    
                    if (Math.random() < 0.35) {
                        addParticle(this.x + (Math.random()-0.5)*120, this.y - Math.random()*150, 0, -1 - Math.random()*2, '#06b6d4', 1.0, 0.02, 4 + Math.random()*3, 0);
                        addParticle(this.x + (Math.random()-0.5)*120, this.y - Math.random()*150, 0, -1 - Math.random()*2, '#c084fc', 1.0, 0.02, 2 + Math.random()*2, 0);
                    }
                } else if (this.currentTaunt === 1) { 
                    this.gloveL.targetX = this.facing * 15; this.gloveL.targetY = -60;
                    this.gloveR.targetX = -this.facing * 5; this.gloveR.targetY = -65;
                    this.targetDuck = 30;
                    targetRotation = this.facing * 0.15;
                    
                    this.headOffset.x += (Math.random() - 0.5) * 5;
                    this.headOffset.y += (Math.random() - 0.5) * 5;
                    targetGroundOffset = (Math.random() - 0.5) * 3;
                    
                    if (Math.random() < 0.85) {
                        addParticle(this.x + (Math.random()-0.5)*80, this.y, (Math.random()-0.5)*1.5, -5 - Math.random()*8, '#f59e0b', 1.0, 0.03, 5 + Math.random()*5, -0.2);
                        addParticle(this.x + (Math.random()-0.5)*60, this.y, (Math.random()-0.5)*1, -7 - Math.random()*6, '#fef08a', 1.0, 0.04, 3 + Math.random()*4, -0.3);
                    }
                } else if (this.currentTaunt === 2) { 
                    targetRotation = -this.facing * 0.2;
                    this.targetDuck = -5;
                    this.gloveL.targetX = -this.facing * 35; this.gloveL.targetY = -180;
                    this.gloveR.targetX = this.facing * 35; this.gloveR.targetY = -180;
                    this.headOffset.y -= 5;
                    
                    if (Math.random() < 0.5) {
                        addParticle(this.x + (Math.random()-0.5)*180, this.y - 250 - Math.random()*50, 0, 2 + Math.random()*3, '#fef08a', 1.0, 0.015, 4 + Math.random()*3, 0);
                    }
                } else if (this.currentTaunt === 3) { 
                    targetRotation = -this.facing * 0.25;
                    this.targetDuck = 15;
                    this.footL.targetX = -this.facing * 35; 
                    this.footR.targetX = this.facing * 35;
                    this.gloveL.targetX = this.facing * 85; this.gloveL.targetY = -100;
                    this.gloveR.targetX = this.facing * 10; this.gloveR.targetY = -145;
                    
                    if (elapsed % 15 === 0 && Math.random() < 0.8) {
                        spawnText(this.x + (Math.random()-0.5)*160, this.y - 80 - Math.random()*120, "ゴ", "#a855f7", true, 1.2);
                    }
                }
            } else if (this.state === ST_CLINCHED) {
                this.gloveL.targetX = this.facing * 45; this.gloveL.targetY = -105;
                this.gloveR.targetX = this.facing * 45; this.gloveR.targetY = -105;
                this.footL.targetX = this.facing * 15;
            }

            if (!isGrounded && this.state !== ST_KNOCKDOWN && !ATTACK_DATA[this.state] && this.state !== ST_BEING_SUPLEXED) {
                this.footL.targetY = -25; this.footR.targetY = -15; 
                this.gloveL.targetY = -140; this.gloveR.targetY = -130; 
            } else if (this.state === ST_MOVE) {
                let stride = Math.sin(Date.now()/70) * 25;
                this.footL.targetX = -stride; this.footR.targetX = stride;
                this.footL.targetY = Math.max(0, stride > 0 ? -20 : 0); this.footR.targetY = Math.max(0, stride < 0 ? -20 : 0);
            }

            this.duckAmount += (this.targetDuck - this.duckAmount) * 0.3;

            if (this.state !== ST_HITSTUN && this.state !== ST_KNOCKDOWN && this.state !== ST_BEING_SUPLEXED) {
                let baseHeadY = -this.height + 15 + this.duckAmount;
                if (isGrounded && (this.state === ST_IDLE || this.state === ST_MOVE)) {
                    baseHeadY += Math.sin(Date.now() / 100) * 5;
                    this.gloveL.targetY += Math.sin(Date.now() / 100 + 1) * 5; 
                    this.gloveR.targetY += Math.sin(Date.now() / 100 + 2) * 5;
                }
                this.headOffset.x += (0 - this.headOffset.x) * 0.3;
                this.headOffset.y += (baseHeadY - this.headOffset.y) * 0.5; 
            } else if (this.state === ST_HITSTUN) {
                this.headOffset.x = -this.facing * 25; 
            }

            this.gloveL.x += (this.gloveL.targetX - this.gloveL.x) * 0.5; this.gloveL.y += (this.gloveL.targetY - this.gloveL.y) * 0.5;
            this.gloveR.x += (this.gloveR.targetX - this.gloveR.x) * 0.5; this.gloveR.y += (this.gloveR.targetY - this.gloveR.y) * 0.5;
            this.footL.x += (this.footL.targetX - this.footL.x) * 0.4; this.footL.y += (this.footL.targetY - this.footL.y) * 0.4;
            this.footR.x += (this.footR.targetX - this.footR.x) * 0.4; this.footR.y += (this.footR.targetY - this.footR.y) * 0.4;
            
            if (this.state !== ST_KNOCKDOWN && this.state !== ST_BEING_SUPLEXED) {
                this.rotation += (targetRotation - this.rotation) * 0.3;
            }
            this.groundOffset += (targetGroundOffset - this.groundOffset) * 0.3;
        }

        draw(ctx) {
            if (this.hp <= 0 && this.stocks <= 0 && this.stateTimer <= 0) return; 
            
            ctx.save();
            ctx.translate(this.x, this.y);

            // Dynamic Ground Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.beginPath();
            
            let groundY = window.currentMap ? window.currentMap.bounds.killY : this.y; 
            if (window.currentMap) {
                if (window.currentMap.type === 'boxing') groundY = GROUND_Y;
                else {
                    if (this.x >= window.currentMap.stage.x && this.x <= window.currentMap.stage.x + window.currentMap.stage.w && this.y <= window.currentMap.stage.y + 20) groundY = window.currentMap.stage.y;
                    for (let p of window.currentMap.platforms) {
                        if (this.x >= p.x && this.x <= p.x + p.w && this.y <= p.y + 20 && p.y < groundY) groundY = p.y;
                    }
                }
            }
            
            let distToGround = Math.max(0, groundY - this.y);
            let shadowWidth = (this.state === ST_KNOCKDOWN) ? 70 : Math.max(0, 40 - distToGround * 0.15);
            
            if (shadowWidth > 5) {
                ctx.ellipse(0, distToGround, shadowWidth, 10, 0, 0, Math.PI * 2); 
                ctx.fill();
            }

            if (this.respawning > 0) {
                ctx.beginPath(); ctx.arc(0, -this.height/2, 100, 0, Math.PI*2);
                let auraGrad = ctx.createRadialGradient(0, -this.height/2, 50, 0, -this.height/2, 100);
                auraGrad.addColorStop(0, `${this.color}00`); auraGrad.addColorStop(1, `${this.color}AA`);
                ctx.fillStyle = auraGrad; ctx.fill();
            }

            if (Math.abs(this.rotation) > 0.01 || this.groundOffset > 0.1 || Math.abs(this.swayAmount) > 0.01) { 
                ctx.rotate(this.rotation + this.swayAmount); 
                ctx.translate(0, this.groundOffset); 
            }

            if (this.tauntCooldown > 0) {
                ctx.save();
                ctx.translate(0, -this.height - 55 + this.duckAmount);
                let barWidth = 40;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(-barWidth/2, 0, barWidth, 6);
                ctx.fillStyle = '#a855f7'; 
                ctx.fillRect(-barWidth/2, 0, barWidth * (this.tauntCooldown / 900), 6);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.strokeRect(-barWidth/2, 0, barWidth, 6);
                ctx.fillStyle = '#a855f7'; ctx.font = "900 10px Oswald"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
                ctx.fillText("TAUNT CD", 0, -2);
                ctx.restore();
            }

            if (this.feintCooldown > 0) {
                ctx.save();
                ctx.translate(0, -this.height - 40 + this.duckAmount);
                let barWidth = 40;
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(-barWidth/2, 0, barWidth, 6);
                ctx.fillStyle = '#cbd5e1'; ctx.fillRect(-barWidth/2, 0, barWidth * (this.feintCooldown / 120), 6);
                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1; ctx.strokeRect(-barWidth/2, 0, barWidth, 6);
                ctx.fillStyle = '#cbd5e1'; ctx.font = "900 10px Oswald"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
                ctx.fillText("FEINT CD", 0, -2);
                ctx.restore();
            }

            if (this.state === ST_PARRY) {
                ctx.beginPath(); ctx.arc(this.gloveL.x, this.gloveL.y, 40 + Math.sin(Date.now()/15)*10, 0, Math.PI*2);
                ctx.arc(this.gloveR.x, this.gloveR.y, 40 + Math.sin(Date.now()/15)*10, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(96, 165, 250, 0.5)'; ctx.fill();
                ctx.strokeStyle = 'rgba(147, 197, 253, 1)'; ctx.lineWidth = 5; ctx.stroke();
            }

            ctx.strokeStyle = '#111'; ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-6, -55); ctx.lineTo(this.footL.x, this.footL.y); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(6, -55); ctx.lineTo(this.footR.x, this.footR.y); ctx.stroke();  

            if (this.profile.accessory === 'goldchain') {
                let neckY = this.headOffset.y + 15; 
                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath(); ctx.moveTo(-12, neckY); ctx.lineTo(0, neckY + 22); ctx.lineTo(12, neckY); ctx.stroke();
                ctx.fillStyle = '#f59e0b'; ctx.fillRect(-6, neckY + 18, 12, 14);
                ctx.fillStyle = '#fef08a'; ctx.fillRect(-2, neckY + 20, 4, 4);
            }

            let bodyGrad = ctx.createLinearGradient(-15, -this.height, 15, 0);
            bodyGrad.addColorStop(0, this.color); bodyGrad.addColorStop(1, '#050505');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.roundRect(-18, -this.height + 25 + this.duckAmount, 36, this.height - 75 - this.duckAmount, 12); ctx.fill();
            
            ctx.fillStyle = this.color; ctx.beginPath(); ctx.roundRect(-20, -65, 40, 25, 6); ctx.fill();
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(-20, -65, 40, 6); 

            ctx.strokeStyle = this.color; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(-6, -this.height + 40 + this.duckAmount); ctx.lineTo(this.gloveR.x, this.gloveR.y); ctx.stroke();
            
            ctx.fillStyle = '#fecaca'; ctx.beginPath(); ctx.arc(this.headOffset.x, this.headOffset.y, 22, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(this.headOffset.x - this.facing*7, this.headOffset.y + 2, 18, 0, Math.PI*2); ctx.fill();
            
            if (this.profile.accessory === 'sunglasses') {
                let eyeY = this.headOffset.y - 4; let eyeX = this.headOffset.x + (this.facing * 6);
                ctx.fillStyle = '#0f172a'; ctx.beginPath();
                ctx.moveTo(eyeX - (this.facing * 14), eyeY - 4); ctx.lineTo(eyeX + (this.facing * 14), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 10), eyeY + 8); ctx.lineTo(eyeX - (this.facing * 10), eyeY + 6); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath();
                ctx.moveTo(eyeX + (this.facing * 2), eyeY - 2); ctx.lineTo(eyeX + (this.facing * 8), eyeY - 2);
                ctx.lineTo(eyeX + (this.facing * 6), eyeY + 6); ctx.lineTo(eyeX + (this.facing * 0), eyeY + 6); ctx.fill();
            }

            if (this.profile.hat === 'kippah') {
                ctx.fillStyle = '#0f172a';
                let kx = this.headOffset.x - (this.facing * 10); let ky = this.headOffset.y - 15;
                ctx.beginPath(); ctx.ellipse(kx, ky, 12, 14, this.facing * 0.5, Math.PI, 0); ctx.fill();
            } else if (this.profile.hat === 'widebrim') {
                ctx.fillStyle = '#0a0a0a';
                let wx = this.headOffset.x; let wy = this.headOffset.y - 18;
                ctx.beginPath(); ctx.ellipse(wx, wy, 42, 6, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.roundRect(wx - 16, wy - 16, 32, 16, 2); ctx.fill();
            }

            ctx.strokeStyle = this.color; ctx.lineWidth = 10;
            ctx.beginPath(); ctx.moveTo(6, -this.height + 40 + this.duckAmount); ctx.lineTo(this.gloveL.x, this.gloveL.y); ctx.stroke();

            ctx.shadowColor = this.color; ctx.shadowBlur = 15;
            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.gloveR.x, this.gloveR.y, 16, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(this.gloveL.x, this.gloveL.y, 18, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(this.gloveL.x + this.facing*6, this.gloveL.y - 6, 6, 0, Math.PI*2); ctx.fill();

            if (ATTACK_DATA[this.state] && ATTACK_DATA[this.state].guardBreak) {
                const data = ATTACK_DATA[this.state];
                const elapsed = (data.windup + data.active + data.recov) - this.stateTimer;
                if (elapsed < data.windup) {
                    let progress = elapsed / data.windup; 
                    ctx.save(); ctx.translate(0, -this.height - 60); 
                    let scale = 1.0 + Math.sin(progress * Math.PI) * 0.8; ctx.scale(scale, scale);
                    ctx.fillStyle = `rgba(255, 50, 50, ${Math.sin(progress * Math.PI)})`;
                    ctx.font = "900 65px 'Yu Mincho', 'MS Mincho', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 30; ctx.fillText("危", 0, 0); 
                    ctx.beginPath(); ctx.arc(0, 0, 40 * progress, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(255, 0, 0, ${1 - progress})`; ctx.lineWidth = 5; ctx.stroke();
                    ctx.restore();
                }
            }
            ctx.restore();
        }
    }

    let gameTimer = 99;
    let matchActive = false; 
    let gameStarted = false;
    let vsCPU = false;
    let lastLoopTime = 0;
    let gameOverTimeout = null;
    let cpuInputs = {};
    let cpuPrevInputs = {};

    function getLogicalInputs(keysObj, keyMap) {
        return {
            left: checkKey(keyMap.left, keysObj), right: checkKey(keyMap.right, keysObj),
            block: checkKey(keyMap.block, keysObj), dash: checkKey(keyMap.dash, keysObj),
            jump: checkKey(keyMap.jump, keysObj), jab: checkKey(keyMap.jab, keysObj),
            cross: checkKey(keyMap.cross, keysObj), hook: checkKey(keyMap.hook, keysObj),
            uppercut: checkKey(keyMap.uppercut, keysObj), knee: checkKey(keyMap.knee, keysObj),
            kick: checkKey(keyMap.kick, keysObj), clinch: checkKey(keyMap.clinch, keysObj),
            clinchMash: checkKey(keyMap.clinchMash, keysObj), taunt: checkKey(keyMap.taunt, keysObj)
        };
    }

    function applyLogicalToPhysical(logicalObj, mapIndex) {
        let physical = {};
        const map = mapIndex === 0 ? KEYS_P1 : KEYS_P2;
        if(logicalObj.left) physical[map.left[0]] = true; if(logicalObj.right) physical[map.right[0]] = true;
        if(logicalObj.block) physical[map.block[0]] = true; if(logicalObj.dash) physical[map.dash[0]] = true;
        if(logicalObj.jump) physical[map.jump[0]] = true; if(logicalObj.jab) physical[map.jab[0]] = true;
        if(logicalObj.cross) physical[map.cross[0]] = true; if(logicalObj.hook) physical[map.hook[0]] = true;
        if(logicalObj.uppercut) physical[map.uppercut[0]] = true; if(logicalObj.knee) physical[map.knee[0]] = true;
        if(logicalObj.kick) physical[map.kick[0]] = true; if(logicalObj.clinch) physical[map.clinch[0]] = true;
        if(logicalObj.clinchMash) physical[map.clinchMash[0]] = true; if(logicalObj.taunt) physical[map.taunt[0]] = true;
        return physical;
    }

    window.applyHostSync = function(syncData) {
        if (!matchActive) return;
        if (Math.abs(gameTimer - syncData.t) > 2) gameTimer = syncData.t; 
        
        syncData.f.forEach((fSync, i) => {
            if (window.fighters[i]) {
                window.fighters[i].hp = fSync.h; window.fighters[i].stamina = fSync.s;
                window.fighters[i].stocks = fSync.stk; window.fighters[i].respawning = fSync.r;
                if (i !== window.playerOrder.indexOf(user.uid)) {
                    window.fighters[i].x += (fSync.x - window.fighters[i].x) * 0.15;
                    window.fighters[i].y += (fSync.y - window.fighters[i].y) * 0.15;
                }
            }
        });
        
        if (window.currentMap.type === 'smash' && syncData.m) {
            window.currentMap.platforms[2].x = syncData.m.x;
            window.currentMap.platforms[2].dir = syncData.m.d;
        }
    };

    window.initGame = function(mode, playerCount) {
        vsCPU = (mode === 'local' && playerCount > 2); 
        window.isOnlineGame = (mode === 'online');
        clearTimeout(gameOverTimeout);
        
        document.getElementById('ui-container').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        document.getElementById('gameCanvas').focus(); 
        document.getElementById('rematch-btn').classList.remove('hidden'); 

        window.currentMap = buildMap(playerCount > 2 ? 'smash' : 'boxing');

        window.fighters = [];
        const cpuNames = ["ROOKIE CPU", "PRO CPU", "CHAMPION CPU"];
        const cpuHats = ['none', 'kippah', 'widebrim'];
        const cpuAccs = ['none', 'sunglasses', 'goldchain'];

        for (let i = 0; i < playerCount; i++) {
            let prof;
            if (window.isOnlineGame) {
                let uid = window.playerOrder[i];
                prof = (uid === user.uid) ? window.playerProfile : (uid === window.playerOrder[0] ? window.opponentProfile : window.guestProfiles[uid]);
            } else if (i === 0) {
                prof = window.playerProfile;
            } else if (vsCPU) {
                prof = {

    function processCPU(cpuFighter) {
        if (!matchActive || cpuFighter.state === ST_KNOCKDOWN || cpuFighter.respawning > 0) return;
        
        let cId = cpuFighter.idx;
        if(!cpuInputs[cId]) cpuInputs[cId] = { left:false, right:false, block:false, dash:false, jump:false, jab:false, cross:false, hook:false, uppercut:false, knee:false, kick:false, taunt:false };
        cpuPrevInputs[cId] = { ...cpuInputs[cId] };

        if (window.currentMap.type === 'smash') {
            let stageCenter = window.currentMap.stage.x + window.currentMap.stage.w / 2;
            if (!cpuFighter.getIsGrounded() && cpuFighter.y > window.currentMap.stage.y + 50) {
                cpuInputs[cId].left = cpuFighter.x > stageCenter;
                cpuInputs[cId].right = cpuFighter.x < stageCenter;
                
                if (cpuFighter.vy > 0 && cpuFighter.airJumps > 0) cpuInputs[cId].jump = true;
                if (cpuFighter.stamina > 25 && Math.abs(cpuFighter.x - stageCenter) > 300 && !cpuFighter.hasAirDashed && Math.random() < 0.3) cpuInputs[cId].dash = true; 
                
                cpuFighter.cpuReactionTimer = 3; 
                return;
            }
        }

        const prof = { reactBase: 5, reactRand: 10, block: 0.85, dodge: 0.50, atkFreq: 0.80, mashSpd: 4 };

        if (clinchActive) {
            if(Math.random() < 0.2) cpuInputs[cId].clinchMash = true;
            return;
        }
        
        if (cpuFighter.cpuReactionTimer === undefined) cpuFighter.cpuReactionTimer = 0;
        
        cpuFighter.cpuReactionTimer--;
        if (cpuFighter.cpuReactionTimer > 0) return; 
        
        cpuFighter.cpuReactionTimer = prof.reactBase + Math.random() * prof.reactRand; 
        Object.keys(cpuInputs[cId]).forEach(k => cpuInputs[cId][k] = false);
        
        let closest = null; let minDist = Infinity;
        window.fighters.forEach(e => {
            if (e.idx !== cId && e.hp > 0 && e.respawning <= 0) {
                let d = Math.abs(e.x - cpuFighter.x) + Math.abs(e.y - cpuFighter.y) * 1.5;
                if (d < minDist) { minDist = d; closest = e; }
            }
        });

        if (!closest) return;

        let dist = Math.abs(closest.x - cpuFighter.x);
        let yDist = closest.y - cpuFighter.y; 
        let isAttacking = closest.hitboxActive || (ATTACK_DATA[closest.state] && closest.stateTimer > ATTACK_DATA[closest.state].recov);
        
        if (isAttacking && cpuFighter.stamina > 20) {
            if (Math.random() < prof.block) { cpuInputs[cId].block = true; cpuFighter.cpuReactionTimer = 25; return; }
            else if (Math.random() < prof.dodge) { cpuInputs[cId].dash = true; return; }
        }
        
        if (cpuFighter.stamina < 50 && !isAttacking) {
            cpuInputs[cId][closest.x > cpuFighter.x ? 'left' : 'right'] = true;
            if(Math.random() < 0.1) cpuInputs[cId].dash = true;
            cpuFighter.cpuReactionTimer = 15; return;
        }

        if (yDist < -80 && Math.random() < 0.8) {
            cpuInputs[cId].jump = true;
            cpuFighter.cpuReactionTimer = 5;
        } else if (yDist > 100 && dist < 100) {
            cpuInputs[cId][closest.x > cpuFighter.x ? 'left' : 'right'] = true; 
            cpuFighter.cpuReactionTimer = 10;
        }

        if (dist > 180) {
            cpuInputs[cId][closest.x > cpuFighter.x ? 'right' : 'left'] = true;
            if (Math.random() < 0.2 && cpuFighter.stamina > 20) cpuInputs[cId].dash = true; 
            if (Math.random() < 0.1) cpuInputs[cId].jump = true; 
            if (Math.random() < 0.02) cpuInputs[cId].taunt = true; 
            cpuFighter.cpuReactionTimer = 15; 
        } else {
            if (Math.random() < prof.atkFreq && cpuFighter.stamina >= 20) {
                let rand = Math.random();
                if (yDist < -30 && dist < 120 && Math.random() < 0.7) cpuInputs[cId].uppercut = true; 
                else if (yDist > 50 && !cpuFighter.getIsGrounded()) cpuInputs[cId].kick = true;
                else {
                    if (rand < 0.20) cpuInputs[cId].jab = true; else if (rand < 0.40) cpuInputs[cId].cross = true; 
                    else if (rand < 0.55) cpuInputs[cId].hook = true; else if (rand < 0.70) cpuInputs[cId].uppercut = true; 
                    else if (rand < 0.85) cpuInputs[cId].knee = true; else if (rand < 0.95) cpuInputs[cId].kick = true; 
                }
                cpuFighter.cpuReactionTimer = 35; 
            } else {
                cpuInputs[cId][Math.random() < 0.5 ? (closest.x > cpuFighter.x ? 'left' : 'right') : (closest.x > cpuFighter.x ? 'right' : 'left')] = true;
                cpuFighter.cpuReactionTimer = 15;
            }
        }
    }

    function triggerClinch() {
        let f1 = null; let f2 = null; let minD = Infinity;
        for(let i=0; i<window.fighters.length; i++) {
            for(let j=i+1; j<window.fighters.length; j++) {
                let d = Math.abs(window.fighters[i].x - window.fighters[j].x) + Math.abs(window.fighters[i].y - window.fighters[j].y);
                if (d < minD && window.fighters[i].hp > 0 && window.fighters[j].hp > 0) { minD = d; f1 = window.fighters[i]; f2 = window.fighters[j]; }
            }
        }
        if(!f1 || !f2 || minD > 100) return;
        
        f1.changeState(ST_CLINCHED, 999); f2.changeState(ST_CLINCHED, 999);
        let cx = (f1.x + f2.x) / 2;
        f1.x = cx - 20; f2.x = cx + 20;
        clinchActive = true; clinchTimer = CLINCH_MAX_TIME;
        clinchScoreP1 = 0; clinchScoreP2 = 0; screenShake = 15;
        window.clinchedFighters = [f1, f2];
    }

    function checkGameOver() {
        if(!matchActive) return;
        
        let alive = window.fighters.filter(f => f.hp > 0 || f.stocks > 0);
        if (alive.length > 1 && gameTimer > 0) return; 
        
        matchActive = false; clinchActive = false;

        if (window.isOnlineGame && window.isHost) {
            window.onlineSendSync({ f: window.fighters.map(f => ({ h: f.hp, s: f.stamina, x: f.x, y: f.y, stk: f.stocks, r: f.respawning })), t: gameTimer });
            const payload = JSON.stringify({ type: 'gameover', hps: window.fighters.map(f=>f.hp) });
            Object.values(window.dataChannels).forEach(dc => { if(dc.readyState==='open') dc.send(payload); });
        }

        let winner = alive.length === 1 ? alive[0] : null;

        if (winner && winner.profile.finisher) {
            spawnText(winner.x, winner.y - 180, `"${winner.profile.finisher}"`, winner.color, true, 4.0);
        }

        gameOverTimeout = setTimeout(() => {
            document.getElementById('ui-container').classList.remove('hidden');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('menu-primary').classList.add('hidden');
            document.getElementById('game-over-ui').classList.remove('hidden');
            document.getElementById('rematch-btn').classList.remove('hidden'); 
            
            let winnerTxt = winner ? `${winner.profile.name} WINS` : "DRAW";
            let subTxt = winner ? "VICTORY ACHIEVED!" : "The bout is over.";
            
            document.getElementById('winner-text').innerText = winnerTxt; 
            if (window.remoteWantsRematch) document.getElementById('winner-sub').innerText = "OPPONENT WANTS REMATCH...";
            else document.getElementById('winner-sub').innerText = subTxt;
            
        }, 3000);
    }

    function updateCamera() {
        if (!matchActive) return;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let aliveCount = 0;
        
        window.fighters.forEach(f => {
            if (f.hp > 0 || f.stocks > 0) {
                minX = Math.min(minX, f.x); maxX = Math.max(maxX, f.x);
                minY = Math.min(minY, f.y); maxY = Math.max(maxY, f.y);
                aliveCount++;
            }
        });

        if (aliveCount === 0) return;

        let targetX = (minX + maxX) / 2;
        let targetY = (minY + maxY) / 2 - 100;

        let width = Math.max(800, maxX - minX + 600); 
        let targetScale = W / width;
        targetScale = Math.max(0.4, Math.min(1.2, targetScale)); 

        window.camera.x += (targetX - window.camera.x) * 0.1;
        window.camera.y += (targetY - window.camera.y) * 0.1;
        window.camera.scale += (targetScale - window.camera.scale) * 0.05;

        let maxCamX = window.currentMap.stage.x + window.currentMap.stage.w;
        let minCamX = window.currentMap.stage.x;
        window.camera.x = Math.max(minCamX, Math.min(maxCamX, window.camera.x));
    }

    function gameLoop(timestamp) {
        if (!gameStarted) return;
        requestAnimationFrame(gameLoop);
        
        if (!lastLoopTime) lastLoopTime = timestamp;
        const dt = timestamp - lastLoopTime;
        if (dt < 16) return; 
        lastLoopTime = timestamp - (dt % 16); 
        
        if (matchActive && !clinchActive) {
            if (window.currentMap.type !== 'smash') gameTimer -= 1/60; 
            checkGameOver();
        }

        if (window.currentMap.type === 'smash' && matchActive) {
            window.currentMap.platforms.forEach(p => {
                if (p.moving) {
                    p.x += p.dir * 2;
                    if (p.x < window.currentMap.stage.x || p.x > window.currentMap.stage.x + window.currentMap.stage.w - p.w) p.dir *= -1;
                }
            });
        }

        let allLogicals = [];

        if (window.isOnlineGame) {
            let myLogical = getLogicalInputs(keysDown, KEYS_P1);
            let strMyLogical = JSON.stringify(myLogical);
            
            if (strMyLogical !== window.localCacheString && window.onlineSendInput) {
                window.onlineSendInput(myLogical);
                window.localCacheString = strMyLogical;
            }

            window.fighters.forEach((f, i) => {
                let uid = window.playerOrder[i];
                if (uid === user.uid) allLogicals.push(myLogical);
                else allLogicals.push(window.remoteInputs[uid] || {});
            });

            if (window.isHost && matchActive) {
                syncTimer++;
                if (syncTimer >= 5) {
                    syncTimer = 0;
                    let syncData = { 
                        f: window.fighters.map(f => ({ h: f.hp, s: f.stamina, x: f.x, y: f.y, stk: f.stocks, r: f.respawning })), 
                        t: gameTimer,
                        m: window.currentMap.type === 'smash' ? { x: window.currentMap.platforms[2].x, d: window.currentMap.platforms[2].dir } : null
                    };
                    window.onlineSendSync(syncData);
                }
            }
        } else {
            window.fighters.forEach((f, i) => {
                if (i === 0) allLogicals.push(getLogicalInputs(keysDown, KEYS_P1));
                else if (vsCPU) {
                    processCPU(f);
                    allLogicals.push(cpuInputs[i] || {});
                } else {
                    allLogicals.push(getLogicalInputs(keysDown, KEYS_P2)); 
                }
            });
        }

        let allPhysicals = allLogicals.map((log, i) => applyLogicalToPhysical(log, i===0?0:1));

        if (clinchActive && window.clinchedFighters) {
            let f1 = window.clinchedFighters[0]; let f2 = window.clinchedFighters[1];
            clinchTimer--;
            if (checkKey(KEYS_P1.clinchMash, allPhysicals[f1.idx])) clinchScoreP1++;
            if (checkKey(KEYS_P2.clinchMash, allPhysicals[f2.idx])) clinchScoreP2++;
            
            if (clinchTimer <= 0) {
                clinchActive = false;
                if (clinchScoreP1 > clinchScoreP2) { f2.changeState(ST_KNOCKDOWN, 80); f2.vy = -12; f2.vx = 20; f2.kdRotVel = 0.2; f2.hp -= 25; f1.changeState(ST_IDLE, 0); } 
                else if (clinchScoreP2 > clinchScoreP1) { f1.changeState(ST_KNOCKDOWN, 80); f1.vy = -12; f1.vx = -20; f1.kdRotVel = -0.2; f1.hp -= 25; f2.changeState(ST_IDLE, 0); } 
                else { f1.changeState(ST_HITSTUN, 30); f1.vx = -10; f2.changeState(ST_HITSTUN, 30); f2.vx = 10; }
                if (f1.hp <= 0) f1.handleDeath(); if (f2.hp <= 0) f2.handleDeath();
                screenShake = 25; spawnParticles((f1.x+f2.x)/2, f1.y-80, '#fff', 70, 3.5);
            }
        }

        if (!clinchActive) {
            for(let i=0; i<window.fighters.length; i++) {
                for(let j=i+1; j<window.fighters.length; j++) {
                    let f1 = window.fighters[i]; let f2 = window.fighters[j];
                    if (Math.abs(f1.x - f2.x) < 45 && f1.y === f2.y && f1.state !== ST_KNOCKDOWN && f2.state !== ST_KNOCKDOWN) {
                        const push = (f1.x < f2.x) ? -3.5 : 3.5; f1.x += push; f2.x -= push;
                    }
                }
            }
        }

        window.fighters.forEach((f, i) => {
            let closest = null; let minDist = Infinity;
            window.fighters.forEach(e => {
                if (e.idx !== f.idx && e.hp > 0 && e.respawning <= 0) {
                    let d = Math.abs(e.x - f.x) + Math.abs(e.y - f.y) * 1.5;
                    if (d < minDist) { minDist = d; closest = e; }
                }
            });

            f.updateLocal(closest, matchActive, i===0?KEYS_P1:KEYS_P2, allPhysicals[i], i===0?prevKeysDown:cpuPrevInputs[i]);
            f.updateAnimation();
        });
        
        prevKeysDown = { ...allPhysicals[0] }; 
        if(vsCPU) window.fighters.forEach((f,i) => { if(i>0) cpuPrevInputs[i] = {...allPhysicals[i]}; });
        else cpuPrevInputs[1] = { ...allPhysicals[1] };
        
        updateCamera();
        drawGame();
    }

    function drawGame() {
        ctx.save();
        if(screenShake > 0) {
            ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
            screenShake *= 0.85; if(screenShake < 0.5) screenShake = 0;
        }

        ctx.clearRect(0, 0, W, H);
        
        let bgGrad = ctx.createRadialGradient(W/2, H/2 - 100, 0, W/2, H/2, W);
        if (window.currentMap.type === 'smash') {
            bgGrad.addColorStop(0, '#1e1b4b'); bgGrad.addColorStop(1, '#020617');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
            
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for(let i=0; i<100; i++) {
                let px = ((i * 123.45 - window.camera.x * 0.1) % W + W) % W;
                let py = ((i * 321.45 - window.camera.y * 0.1) % H + H) % H;
                ctx.beginPath(); ctx.arc(px, py, (i%3)+1, 0, Math.PI*2); ctx.fill();
            }
        } else {
            bgGrad.addColorStop(0, '#0c0a20'); bgGrad.addColorStop(1, '#020205');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
            
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, H/2 - 90); ctx.quadraticCurveTo(W/2, H/2 - 40, W, H/2 - 90); ctx.stroke();
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 9;  ctx.beginPath(); ctx.moveTo(0, H/2 - 30); ctx.quadraticCurveTo(W/2, H/2 + 20, W, H/2 - 30); ctx.stroke();
            ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, H/2 + 30); ctx.quadraticCurveTo(W/2, H/2 + 80, W, H/2 + 30); ctx.stroke();
            
            let floorGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
            floorGrad.addColorStop(0, '#111827'); floorGrad.addColorStop(1, '#030712');
            ctx.fillStyle = floorGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
            for(let i=0; i<W; i+=100) { ctx.beginPath(); ctx.moveTo(i, GROUND_Y); ctx.lineTo(i + (i-W/2)*0.5, H); ctx.stroke(); }
        }
        
        ctx.translate(W/2, H/2);
        ctx.scale(window.camera.scale, window.camera.scale);
        ctx.translate(-window.camera.x, -window.camera.y);

        if (window.currentMap.type === 'smash') {
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.roundRect(window.currentMap.stage.x, window.currentMap.stage.y, window.currentMap.stage.w, 400, 10); ctx.fill();
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
            ctx.strokeRect(window.currentMap.stage.x, window.currentMap.stage.y, window.currentMap.stage.w, 15);
            ctx.fillStyle = '#1e293b'; ctx.fillRect(window.currentMap.stage.x, window.currentMap.stage.y, window.currentMap.stage.w, 15);
            
            window.currentMap.platforms.forEach(p => {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 15, 5); ctx.fill();
                ctx.strokeStyle = p.moving ? '#f43f5e' : '#a855f7'; ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.w, 15);
            });

            window.currentMap.jumpPads.forEach(jp => {
                ctx.fillStyle = '#0891b2';
                ctx.fillRect(jp.x, jp.y, jp.w, 10);
                ctx.fillStyle = '#22d3ee';
                ctx.fillRect(jp.x + 5, jp.y - 5, jp.w - 10, 5);
                ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(34, 211, 238, 0.5)';
                ctx.fillRect(jp.x, jp.y - 15, jp.w, 15);
                ctx.shadowBlur = 0;
            });
        }

        let sortedFighters = [...window.fighters].sort((a,b) => (a.state === ST_KNOCKDOWN ? -1 : 1));
        sortedFighters.forEach(f => f.draw(ctx));

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; 
            p.x += p.vx; p.y += p.vy; 
            p.vy += (p.gravity !== undefined ? p.gravity : 0.8); 
            p.life -= (p.decay !== undefined ? p.decay : 0.035);
            ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); 
            let s = p.size !== undefined ? p.size : 4;
            ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
            if (p.life <= 0) particles.splice(i, 1);
        }
        
        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; 
            t.y += t.vy; t.vy *= 0.92; t.life -= 0.015;
            ctx.globalAlpha = Math.max(0, Math.min(1.0, t.life)); ctx.fillStyle = t.color;
            ctx.font = t.big ? "900 38px Oswald" : "900 24px Oswald"; ctx.textAlign = "center";
            ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.lineWidth = 6; 
            ctx.strokeText(t.text, t.x, t.y); ctx.fillText(t.text, t.x, t.y);
            ctx.globalAlpha = 1.0; if (t.life <= 0) texts.splice(i, 1);
        }

        ctx.restore(); 

        if (clinchActive && window.clinchedFighters) {
            let f1 = window.clinchedFighters[0]; let f2 = window.clinchedFighters[1];
            ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = "white"; ctx.font = "900 80px Oswald"; ctx.textAlign = "center";
            ctx.shadowColor = "rgba(255,255,255,0.8)"; ctx.shadowBlur = 20;
            ctx.fillText("CLINCH! MASH!", W/2, H/3);
            ctx.shadowBlur = 0;
            
            let totalScore = Math.max(1, clinchScoreP1 + clinchScoreP2); let p1Ratio = clinchScoreP1 / totalScore;
            ctx.fillStyle = "#1e293b"; ctx.fillRect(W/2 - 350, H/2, 700, 50);
            ctx.fillStyle = f1.color; ctx.fillRect(W/2 - 350, H/2, 700 * p1Ratio, 50);
            ctx.fillStyle = f2.color; ctx.fillRect(W/2 - 350 + (700 * p1Ratio), H/2, 700 * (1 - p1Ratio), 50);
            ctx.strokeStyle = "white"; ctx.lineWidth = 6; ctx.strokeRect(W/2 - 350, H/2, 700, 50);
            
            ctx.font = "900 40px Oswald"; ctx.fillStyle = "white"; 
            ctx.fillText(f1.profile.name, W/2 - 390, H/2 + 40); ctx.fillText(f2.profile.name, W/2 + 390, H/2 + 40);
        }

        updateUI();
    }
</script>
