<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glove Game - Smash Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; overflow: hidden; background-color: #030305; color: white; 
            font-family: 'Inter', sans-serif; user-select: none;
        }
        
        canvas { 
            display: block; margin: 0 auto; background: #0a0a0f; 
            box-shadow: 0 0 80px rgba(0,0,0,1);
        }
        canvas:focus { outline: none; }
        
        .hidden { display: none !important; }
        
        .glass-panel { 
            background: linear-gradient(135deg, rgba(15, 15, 20, 0.95) 0%, rgba(5, 5, 10, 0.98) 100%);
            border: 1px solid rgba(255,255,255,0.05); 
            backdrop-filter: blur(25px); 
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 1), inset 0 1px 1px rgba(255,255,255,0.1); 
            border-radius: 24px;
        }
        
        h1, h2, .boxing-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        
        .btn { 
            position: relative; overflow: hidden; padding: 16px 32px; font-weight: 900; 
            border-radius: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid transparent; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; 
            font-family: 'Oswald', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        
        .btn::before {
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.1), rgba(255,255,255,0));
            transform: translateX(-100%); transition: transform 0.5s ease;
        }
        .btn:hover::before { transform: translateX(100%); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        .btn-blue { 
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); 
            border-color: rgba(96, 165, 250, 0.3);
            box-shadow: 0 8px 25px -5px rgba(37, 99, 235, 0.6), inset 0 2px 0 rgba(255,255,255,0.2); 
        }
        .btn-blue:hover { transform: translateY(-4px); box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.8), inset 0 2px 0 rgba(255,255,255,0.3); }
        .btn-blue:active { transform: translateY(1px); }
        
        .btn-red { 
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); 
            border-color: rgba(248, 113, 113, 0.3);
            box-shadow: 0 8px 25px -5px rgba(220, 38, 38, 0.6), inset 0 2px 0 rgba(255,255,255,0.2); 
        }
        .btn-red:hover { transform: translateY(-4px); box-shadow: 0 15px 35px -5px rgba(220, 38, 38, 0.8), inset 0 2px 0 rgba(255,255,255,0.3); }
        
        .btn-gray { 
            background: linear-gradient(135deg, #334155 0%, #0f172a 100%); 
            border-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 20px -5px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.1); 
        }
        .btn-gray:hover { transform: translateY(-3px); background: linear-gradient(135deg, #475569 0%, #1e293b 100%); border-color: rgba(255,255,255,0.1); }

        .btn-green { 
            background: linear-gradient(135deg, #059669 0%, #064e3b 100%); 
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 8px 25px -5px rgba(5, 150, 105, 0.6), inset 0 2px 0 rgba(255,255,255,0.2); 
        }
        .btn-green:hover { transform: translateY(-4px); box-shadow: 0 15px 35px -5px rgba(5, 150, 105, 0.8), inset 0 2px 0 rgba(255,255,255,0.3); }
        
        .btn-purple { 
            background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%); 
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 8px 25px -5px rgba(124, 58, 237, 0.6), inset 0 2px 0 rgba(255,255,255,0.2); 
        }
        .btn-purple:hover { transform: translateY(-4px); box-shadow: 0 15px 35px -5px rgba(124, 58, 237, 0.8), inset 0 2px 0 rgba(255,255,255,0.3); }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; background: radial-gradient(circle at center, rgba(10,10,20,0.85) 0%, rgba(0,0,0,0.98) 100%); }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

        .health-bar-container { transform: skewX(-15deg); }
        .health-bar-container.p2-skew { transform: skewX(15deg); }
        
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.6)); }
            50% { filter: drop-shadow(0 0 30px rgba(255,255,255,1)); }
        }
        .timer-glow { animation: pulse-glow 2s infinite; }
        
        input[type="text"], select {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
            color: white; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 20px rgba(59,130,246,0.2); background: rgba(0,0,0,0.8); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .grid-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .key-btn {
            display: inline-flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #334155, #0f172a);
            border: 1px solid #475569;
            border-bottom-width: 3px;
            border-radius: 6px;
            padding: 2px 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            color: #f8fafc;
            margin: 0 2px;
            font-size: 0.85em;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
            min-width: 24px;
        }
        .ctrl-group { display: flex; align-items: center; gap: 4px; font-weight: 700; color: #94a3b8; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.05em; }
        .ctrl-divider { width: 2px; height: 16px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 0 8px; }
        .controls-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 0; }
        
        .lobby-player-row { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="ui-container">
        <!-- Main UI Panel -->
        <div class="glass-panel p-8 shadow-2xl max-w-3xl w-full text-center relative overflow-hidden" id="main-menu">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-red-500 z-20"></div>
            <div class="absolute top-0 left-0 w-full h-full grid-bg opacity-40 z-0 pointer-events-none"></div>
            
            <div class="relative z-10" id="menu-primary">
                <div class="mb-8">
                    <h1 class="text-[5.5rem] leading-none font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-500 tracking-tighter drop-shadow-[0_0_20px_rgba(59,130,246,0.4)]">GLOVE GAME</h1>
                    <p class="text-blue-300/70 text-sm font-bold tracking-[0.4em] uppercase">Smash Arena Edition</p>
                </div>
                
                <div class="flex flex-col gap-4 px-12">
                    <button class="btn btn-purple py-4" onclick="showLobbyMenu()">
                        <span class="text-xl">🌐</span> ONLINE LOBBY (2-4P)
                    </button>
                    <button class="btn btn-blue py-4" onclick="initGame('1v1', 1)">
                        <span class="text-xl">🥊</span> LOCAL 1V1 (VS CPU)
                    </button>
                    <button class="btn btn-red py-4" onclick="initGame('ffa-cpu', 1)">
                        <span class="text-xl">🔥</span> SMASH FFA (1P VS 3 CPU)
                    </button>
                    <button class="btn btn-gray py-3 mt-4 text-sm" onclick="showProfileMenu()">
                        <span>⚙️</span> EDIT FIGHTER PROFILE
                    </button>
                </div>
            </div>

            <!-- Profile Menu / Character Editor -->
            <div class="relative z-10 hidden" id="menu-profile">
                <h2 class="text-4xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-400 tracking-tighter">FIGHTER PROFILE</h2>
                
                <div class="flex gap-6 mb-6 text-left">
                    <!-- Preview Canvas Area -->
                    <div class="w-1/3 bg-black/50 rounded-2xl border border-white/10 flex flex-col items-center justify-center p-2 relative shadow-inner overflow-hidden">
                        <canvas id="previewCanvas" width="200" height="280"></canvas>
                        <div class="absolute bottom-3 text-[10px] text-gray-500 font-bold uppercase tracking-widest bg-black/50 px-2 py-1 rounded-md">Live Preview</div>
                    </div>
                    
                    <!-- Form Controls -->
                    <div class="w-2/3 flex flex-col gap-3">
                        <div>
                            <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Fighter Alias</label>
                            <input type="text" id="profile-name-input" maxlength="12" class="w-full rounded-lg p-2.5 text-xl font-bold font-['Oswald'] tracking-widest uppercase mt-1 text-center" oninput="updatePreviewProfile()">
                        </div>
                        
                        <div class="flex gap-3">
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Headgear</label>
                                <select id="profile-hat-input" class="w-full rounded-lg p-2.5 text-sm font-bold mt-1 appearance-none cursor-pointer text-center" onchange="updatePreviewProfile()">
                                    <option value="none">None</option>
                                    <option value="kippah">Kippah</option>
                                    <option value="widebrim">Wide Brim Hat</option>
                                </select>
                            </div>
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Accessory</label>
                                <select id="profile-acc-input" class="w-full rounded-lg p-2.5 text-sm font-bold mt-1 appearance-none cursor-pointer text-center" onchange="updatePreviewProfile()">
                                    <option value="none">None</option>
                                    <option value="sunglasses">Retro Shades</option>
                                    <option value="goldchain">Gold Chain</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="flex gap-3">
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Taunt Message</label>
                                <input type="text" id="profile-taunt-input" maxlength="25" placeholder="Let's go!" class="w-full rounded-lg p-2.5 text-sm mt-1 text-left" oninput="updatePreviewProfile()">
                            </div>
                            <div class="w-1/2">
                                <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Emote Style</label>
                                <select id="profile-emote-input" class="w-full rounded-lg p-2.5 text-sm font-bold mt-1 appearance-none cursor-pointer text-center" onchange="updatePreviewProfile()">
                                    <option value="0">T-Pose</option>
                                    <option value="1">Power Up</option>
                                    <option value="2">Praise</option>
                                    <option value="3">Menacing Point</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">K.O. Finisher Message</label>
                            <input type="text" id="profile-finisher-input" maxlength="35" placeholder="Goodnight!" class="w-full rounded-lg p-2.5 text-sm mt-1 text-left focus:border-red-500" oninput="updatePreviewProfile()">
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button class="btn btn-gray flex-1 py-3" onclick="hideProfileMenu()">CANCEL</button>
                    <button class="btn btn-green flex-1 py-3" onclick="saveProfile()">SAVE CHANGES</button>
                </div>
            </div>
            
            <!-- Lobby Menu -->
            <div class="relative z-10 hidden flex-col h-full min-h-[420px]" id="menu-lobby">
                <h2 class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 tracking-tighter drop-shadow-[0_0_15px_rgba(168,85,247,0.4)]">ONLINE LOBBY</h2>
                <div id="lobby-status" class="text-yellow-400/90 font-bold mb-4 h-6 uppercase tracking-wider text-sm"></div>
                
                <div class="flex-col gap-4 flex-grow flex px-2" id="lobby-options">
                    <button class="btn btn-purple py-4" onclick="window.hostGame()">+ HOST NEW ARENA</button>
                    
                    <div class="bg-black/50 p-4 rounded-2xl border border-white/5 mt-2 flex-grow flex flex-col h-60 relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/50 pointer-events-none z-10"></div>
                        <p class="text-xs text-gray-500 font-bold mb-3 tracking-widest uppercase text-left">Available Arenas (P2P)</p>
                        <div id="lobby-list" class="flex flex-col gap-3 overflow-y-auto pr-2 flex-grow relative z-20 pb-4">
                            <p class="text-gray-600 italic py-4 text-sm font-bold uppercase tracking-widest">Searching for rooms...</p>
                        </div>
                    </div>
                    <button class="btn btn-gray py-3 mt-2 text-sm" onclick="hideLobbyMenu()">BACK TO MENU</button>
                </div>
                
                <!-- Waiting Room (Multiplayer) -->
                <div id="lobby-waiting" class="hidden flex-col flex-grow h-full py-2">
                    <div class="flex justify-between items-end mb-4 border-b border-white/10 pb-2">
                        <h1 class="text-2xl font-black text-white tracking-widest">FIGHTERS JOINED</h1>
                        <span id="lobby-count" class="text-purple-400 font-bold">1 / 4</span>
                    </div>
                    
                    <div id="lobby-players-list" class="flex flex-col gap-2 flex-grow overflow-y-auto mb-4">
                        <!-- Dynamically filled with joining players -->
                    </div>

                    <p class="text-xs text-gray-400 font-bold tracking-widest uppercase mb-4" id="lobby-wait-msg">Waiting for Host to start...</p>
                    
                    <div class="flex gap-4">
                        <button class="btn btn-gray flex-1 py-3 text-sm" onclick="cancelHosting()">LEAVE</button>
                        <button id="btn-start-match" class="btn btn-green flex-1 py-3 text-sm hidden" onclick="startHostedMatch()">START MATCH</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-ui" class="hidden glass-panel p-12 shadow-2xl text-center z-50 w-full max-w-lg border-y-8 border-yellow-500 relative">
            <div class="absolute top-0 left-0 w-full h-full grid-bg opacity-20 pointer-events-none"></div>
            <div class="relative z-10">
                <h2 class="text-[6rem] leading-none font-black mb-2 tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 drop-shadow-[0_0_40px_rgba(234,179,8,0.5)]" id="winner-text">K.O.</h2>
                <p class="text-gray-300 font-bold text-xl mb-10 tracking-widest uppercase" id="winner-sub">The bout is over.</p>
                <div class="flex flex-col gap-4">
                    <button class="btn btn-blue py-5 w-full text-xl" id="rematch-btn" onclick="handleRematchClick()">REMATCH</button>
                    <button class="btn btn-gray py-4 w-full" onclick="location.reload()">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-ui" class="hidden flex flex-col justify-between p-6 h-full">
        <!-- The Dynamic Top HUD injected via JS -->
        <div id="hud-container" class="flex justify-between items-start w-full max-w-[95%] mx-auto mt-2 gap-4"></div>

        <!-- Dynamic Network Connectivity Ping -->
        <div class="absolute top-36 left-1/2 transform -translate-x-1/2">
            <div id="network-ping" class="text-[10px] text-green-400 font-bold tracking-widest hidden animate-pulse bg-green-900/40 px-4 py-1.5 rounded-full border border-green-500/40 shadow-[0_0_15px_rgba(34,197,94,0.3)]">P2P CONNECTED</div>
        </div>

        <div id="controls-text" class="text-center text-gray-200 text-sm mb-4 bg-black/40 rounded-2xl mx-auto px-6 py-4 backdrop-blur-md pointer-events-none border border-white/5 shadow-2xl absolute bottom-6 left-1/2 transform -translate-x-1/2 w-max max-w-[98%] tracking-wide"></div>
    </div>

    <canvas id="gameCanvas" width="1280" height="720" tabindex="0"></canvas>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, get, set, update, onValue, onDisconnect, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDUoYS6MwDIVe8coZOM9A0ZCYaZTeDSloo",
        authDomain: "babjeu-85d3e.firebaseapp.com",
        databaseURL: "https://babjeu-85d3e-default-rtdb.firebaseio.com",
        projectId: "babjeu-85d3e",
        storageBucket: "babjeu-85d3e.firebasestorage.app",
        messagingSenderId: "306959176803",
        appId: "1:306959176803:web:2be00da38dbb37e777d456",
        measurementId: "G-T38G7Y7MJ7"
    };
    
    let app, auth, db;
    try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getDatabase(app);
    } catch(e) { console.log("Firebase init skipped due to missing config."); }

    let user = null;
    window.lobbyQueryUnsub = null;
    window.roomListenerUnsub = null;
    window.currentRoomId = null;
    window.isHost = false;

    // WebRTC Variables for Star Topology (Multi-Peer)
    window.peers = {}; // uid -> RTCPeerConnection
    window.dataChannels = {}; // uid -> RTCDataChannel
    window.remoteInputs = {}; // uid -> logical keys object
    window.playerOrder = []; // Array of UIDs dictating player 1, 2, 3, 4
    window.myPlayerIndex = 0;
    
    window.localWantsRematch = false;
    window.rematchVotes = {}; // uid -> boolean

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
        ]
    };
    
    const setLobbyStatus = (msg) => { document.getElementById('lobby-status').innerText = msg; };

    window.initFirebaseOnline = async function() {
        if(!auth) { setLobbyStatus("Network Error: Config missing"); return false; }
        try {
            setLobbyStatus("Connecting to signaling server...");
            if (typeof __initial_auth_token !== 'undefined') {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            user = auth.currentUser;
            setLobbyStatus("");
            return true;
        } catch(e) { 
            console.error(e); 
            setLobbyStatus("Network connect failed. " + e.message);
            return false; 
        }
    };

    window.startLobbyListener = async function() {
        if (!(await window.initFirebaseOnline())) return;
        const roomsRef = ref(db, 'rooms');
        window.lobbyQueryUnsub = onValue(roomsRef, (snap) => {
            const rooms = snap.val();
            const listEl = document.getElementById('lobby-list');
            listEl.innerHTML = '';
            let count = 0;
            
            if (rooms) {
                const now = Date.now();
                for (const [id, data] of Object.entries(rooms)) {
                    if (!data.timestamp || now - data.timestamp > 1800000) {
                        remove(ref(db, 'rooms/' + id)).catch(e => {});
                        continue;
                    }

                    if (data.status === 'waiting' && Object.keys(data.players || {}).length < 4) {
                        count++;
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-gray text-left py-4 px-5 flex justify-between items-center w-full rounded-xl border border-white/5 shadow-sm hover:border-purple-500/50 hover:bg-white/5 transition-all group';
                        
                        const hostDisplayName = (data.hostName || "FIGHTER").substring(0, 12);
                        const pCount = Object.keys(data.players || {}).length;
                        
                        btn.innerHTML = `
                            <div class="flex items-center gap-4">
                                <span class="text-3xl drop-shadow-[0_0_8px_rgba(255,255,255,0.3)] group-hover:scale-110 transition-transform">🥊</span>
                                <div class="flex flex-col">
                                    <span class="font-bold text-white tracking-widest uppercase">${hostDisplayName}'S ARENA</span>
                                    <span class="text-xs text-gray-400 font-bold uppercase tracking-widest">${pCount}/4 Fighters</span>
                                </div>
                            </div>
                            <span class="text-xs font-black text-green-400 tracking-widest bg-green-900/40 px-4 py-2 rounded-lg group-hover:bg-green-500 group-hover:text-black transition-colors border border-green-500/20 group-hover:border-transparent">JOIN</span>
                        `;
                        btn.onclick = () => window.joinPublicRoom(id);
                        listEl.appendChild(btn);
                    }
                }
            }
            
            if (count === 0) {
                listEl.innerHTML = '<div class="h-full flex items-center justify-center"><p class="text-gray-500 italic text-sm tracking-widest uppercase">No open arenas found.</p></div>';
            }
        });
    };

    window.stopLobbyListener = function() {
        if (window.lobbyQueryUnsub) {
            window.lobbyQueryUnsub();
            window.lobbyQueryUnsub = null;
        }
    };

    function renderLobbyPlayers(playersObj) {
        const listEl = document.getElementById('lobby-players-list');
        listEl.innerHTML = '';
        const keys = Object.keys(playersObj || {});
        document.getElementById('lobby-count').innerText = `${keys.length} / 4`;
        
        keys.forEach((uid, idx) => {
            const isMe = uid === user.uid;
            const isHostNode = playersObj[uid].isHost;
            const pName = playersObj[uid].profile.name;
            const colorClass = ['text-blue-400', 'text-red-400', 'text-green-400', 'text-yellow-400'][idx];
            
            listEl.innerHTML += `
                <div class="lobby-player-row flex justify-between items-center bg-black/40 border border-white/5 rounded-lg p-3">
                    <div class="flex items-center gap-3">
                        <span class="font-black ${colorClass}">P${idx+1}</span>
                        <span class="font-bold text-white tracking-widest uppercase">${pName}</span>
                    </div>
                    ${isHostNode ? '<span class="text-[10px] bg-purple-900/60 text-purple-300 px-2 py-1 rounded font-bold tracking-widest">HOST</span>' : ''}
                    ${isMe ? '<span class="text-[10px] bg-white/10 text-white px-2 py-1 rounded font-bold tracking-widest">YOU</span>' : ''}
                </div>
            `;
        });
        
        if (window.isHost) {
            document.getElementById('lobby-wait-msg').classList.add('hidden');
            if (keys.length > 1) {
                document.getElementById('btn-start-match').classList.remove('hidden');
            } else {
                document.getElementById('btn-start-match').classList.add('hidden');
            }
        } else {
            document.getElementById('btn-start-match').classList.add('hidden');
            document.getElementById('lobby-wait-msg').classList.remove('hidden');
        }
    }

    window.hostGame = async function() {
        if (!user) return;
        window.stopLobbyListener();
        
        const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        const roomRef = ref(db, 'rooms/' + roomId);
        
        try {
            await set(roomRef, {
                host: user.uid,
                hostName: window.playerProfile.name,
                status: 'waiting',
                timestamp: Date.now(),
                players: {
                    [user.uid]: { profile: window.playerProfile, isHost: true }
                }
            });

            onDisconnect(roomRef).remove();

            document.getElementById('lobby-options').classList.add('hidden');
            document.getElementById('lobby-options').classList.remove('flex');
            document.getElementById('lobby-waiting').classList.remove('hidden');
            document.getElementById('lobby-waiting').classList.add('flex');
            
            window.isHost = true;
            window.currentRoomId = roomId;

            window.roomListenerUnsub = onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if(!data) return;
                
                if (data.status === 'waiting') {
                    renderLobbyPlayers(data.players);
                }
            });
        } catch (e) {
            console.error(e);
            setLobbyStatus("Host failed: " + e.message);
        }
    };

    window.startHostedMatch = async function() {
        if (!window.isHost || !window.currentRoomId) return;
        document.getElementById('btn-start-match').disabled = true;
        document.getElementById('btn-start-match').innerText = "CONNECTING...";
        
        // Grab final list of players to solidify order
        const snap = await get(ref(db, `rooms/${window.currentRoomId}/players`));
        const playersData = snap.val();
        // Force Host to be index 0
        const uids = Object.keys(playersData);
        window.playerOrder = [user.uid, ...uids.filter(id => id !== user.uid)];
        window.myPlayerIndex = 0;
        
        // Save profiles so we can instantiate fighters properly
        window.matchProfiles = window.playerOrder.map(uid => playersData[uid].profile);

        // Update status to transition everyone
        await update(ref(db, `rooms/${window.currentRoomId}`), { 
            status: 'connecting',
            playerOrder: window.playerOrder,
            matchProfiles: window.matchProfiles
        });
        
        // Initiate WebRTC to all guests
        for (let i = 1; i < window.playerOrder.length; i++) {
            const guestUid = window.playerOrder[i];
            await startHostWebRTCToGuest(window.currentRoomId, guestUid);
        }
        
        checkAllConnectionsOpen();
    };

    async function startHostWebRTCToGuest(roomId, guestUid) {
        let pc = new RTCPeerConnection(rtcConfig);
        window.peers[guestUid] = pc;
        
        let dc = pc.createDataChannel('gameData', { ordered: false, maxRetransmits: 0 });
        window.dataChannels[guestUid] = dc;
        setupDataChannelEvents(dc, guestUid);

        pc.onicecandidate = (e) => {
            if (e.candidate) push(ref(db, `rooms/${roomId}/candidates/host_${guestUid}`), e.candidate.toJSON());
        };

        let offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await set(ref(db, `rooms/${roomId}/offers/${guestUid}`), { type: offer.type, sdp: offer.sdp });

        // Listen for this specific guest's answer
        onValue(ref(db, `rooms/${roomId}/answers/${guestUid}`), (snap) => {
            if (snap.val() && pc.signalingState === 'have-local-offer') {
                pc.setRemoteDescription(new RTCSessionDescription(snap.val())).catch(e=>console.log(e));
            }
        });

        // Listen for this specific guest's ICE candidates
        onChildAdded(ref(db, `rooms/${roomId}/candidates/${guestUid}_host`), (snap) => {
            if (snap.val()) pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(e=>console.log(e));
        });
    }

    window.joinPublicRoom = async function(roomId) {
        if (!user) return;
        window.stopLobbyListener();
        const roomRef = ref(db, 'rooms/' + roomId);
        
        try {
            setLobbyStatus("Joining Arena...");
            const snapshot = await get(roomRef);
            if (!snapshot.exists() || snapshot.val().status !== 'waiting' || Object.keys(snapshot.val().players || {}).length >= 4) {
                setLobbyStatus("Arena full or closed.");
                window.startLobbyListener();
                return;
            }
            
            // Add self to players
            await update(ref(db, `rooms/${roomId}/players/${user.uid}`), {
                profile: window.playerProfile, isHost: false
            });

            window.isHost = false;
            window.currentRoomId = roomId;
            
            document.getElementById('lobby-options').classList.add('hidden');
            document.getElementById('lobby-options').classList.remove('flex');
            document.getElementById('lobby-waiting').classList.remove('hidden');
            document.getElementById('lobby-waiting').classList.add('flex');

            window.roomListenerUnsub = onValue(roomRef, async (snap) => {
                const data = snap.val();
                if(!data) return;
                
                if (data.status === 'waiting') {
                    renderLobbyPlayers(data.players);
                } else if (data.status === 'connecting' && !window.peerConnectionStarted) {
                    window.peerConnectionStarted = true;
                    document.getElementById('lobby-wait-msg').innerText = "Establishing P2P Connection...";
                    
                    window.playerOrder = data.playerOrder;
                    window.matchProfiles = data.matchProfiles;
                    window.myPlayerIndex = window.playerOrder.indexOf(user.uid);
                    
                    listenForHostOffer(roomId);
                }
            });
        } catch (e) {
            console.error(e);
            setLobbyStatus("Join failed: " + e.message);
        }
    };

    function listenForHostOffer(roomId) {
        onValue(ref(db, `rooms/${roomId}/offers/${user.uid}`), async (snap) => {
            let offer = snap.val();
            if (offer && !window.peers['host']) {
                let pc = new RTCPeerConnection(rtcConfig);
                window.peers['host'] = pc;
                
                pc.ondatachannel = (e) => {
                    window.dataChannels['host'] = e.channel;
                    setupDataChannelEvents(window.dataChannels['host'], 'host');
                };

                pc.onicecandidate = (e) => {
                    if (e.candidate) push(ref(db, `rooms/${roomId}/candidates/${user.uid}_host`), e.candidate.toJSON());
                };

                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                let answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await set(ref(db, `rooms/${roomId}/answers/${user.uid}`), { type: answer.type, sdp: answer.sdp });

                onChildAdded(ref(db, `rooms/${roomId}/candidates/host_${user.uid}`), (s) => {
                    if (s.val()) pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(e=>{});
                });
            }
        });
    }

    function setupDataChannelEvents(dc, peerId) {
        dc.onopen = () => {
            console.log(`WebRTC Data Channel OPEN with ${peerId}`);
            if (window.isHost) checkAllConnectionsOpen();
            else startOnlineMatch();
        };

        dc.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === 'input' && window.isHost) {
                // Host receives inputs from guests
                window.remoteInputs[msg.uid] = msg.keys;
            } else if (msg.type === 'sync' && !window.isHost) {
                // Guest receives master sync from host
                window.applyHostSync(msg.data);
            } else if (msg.type === 'rematch') {
                window.rematchVotes[msg.uid] = true;
                checkRematch();
            } else if (msg.type === 'gameover') {
                msg.hps.forEach((hp, i) => { if(window.fighters[i]) window.fighters[i].hp = hp; });
                if(window.matchActive) checkGameOver();
            }
        };

        dc.onclose = () => {
            console.log(`WebRTC Data Channel CLOSED with ${peerId}`);
            if (window.matchActive || !document.getElementById('game-ui').classList.contains('hidden')) {
                document.getElementById('winner-text').innerText = "DISCONNECT";
                document.getElementById('winner-sub').innerText = "A PLAYER LEFT THE ARENA.";
                document.getElementById('rematch-btn').classList.add('hidden');
                if(window.checkGameOverNetworkEvent) window.checkGameOverNetworkEvent();
            }
        };
    }

    function checkAllConnectionsOpen() {
        // Host checks if all guests are connected
        let expectedGuests = window.playerOrder.length - 1;
        let openCount = Object.values(window.dataChannels).filter(dc => dc.readyState === 'open').length;
        if (openCount >= expectedGuests && expectedGuests > 0) {
            startOnlineMatch();
        }
    }

    function startOnlineMatch() {
        document.getElementById('menu-lobby').classList.add('hidden');
        document.getElementById('lobby-waiting').classList.add('hidden');
        window.initGame('online', window.playerOrder.length);
    }

    function checkRematch() {
        // If everyone online wants to rematch
        let allReady = true;
        if (window.isOnlineGame) {
            if (!window.localWantsRematch) allReady = false;
            window.playerOrder.forEach(uid => {
                if (uid !== user.uid && !window.rematchVotes[uid]) allReady = false;
            });
        } else {
            allReady = window.localWantsRematch;
        }

        if (allReady) {
            window.localWantsRematch = false;
            window.rematchVotes = {};
            window.resetMatchForRematch();
        } else {
            let votes = window.localWantsRematch ? 1 : 0;
            Object.values(window.rematchVotes).forEach(v => { if(v) votes++; });
            let total = window.isOnlineGame ? window.playerOrder.length : 1;
            if (document.getElementById('winner-sub')) {
                document.getElementById('winner-sub').innerText = `WAITING FOR REMATCH... (${votes}/${total})`;
            }
        }
    }

    window.onlineSendInput = function(logicalObj) {
        // Guest sends input to Host
        if (!window.isHost && window.dataChannels['host'] && window.dataChannels['host'].readyState === 'open') {
            window.dataChannels['host'].send(JSON.stringify({ type: 'input', uid: user.uid, keys: logicalObj }));
        }
    };

    window.onlineSendSync = function(syncData) {
        // Host broadcasts state to all Guests
        if (window.isHost) {
            const payload = JSON.stringify({ type: 'sync', data: syncData });
            Object.values(window.dataChannels).forEach(dc => {
                if (dc.readyState === 'open') dc.send(payload);
            });
        }
    };

    window.onlineRematchRequest = function() {
        window.localWantsRematch = true;
        let payload = JSON.stringify({ type: 'rematch', uid: user?.uid || 'local' });
        
        if (window.isOnlineGame) {
            Object.values(window.dataChannels).forEach(dc => {
                if (dc.readyState === 'open') dc.send(payload);
            });
        }
        document.getElementById('rematch-btn').classList.add('hidden');
        checkRematch();
    };

    window.cleanupNetworkConnections = function() {
        Object.values(window.dataChannels).forEach(dc => dc.close());
        Object.values(window.peers).forEach(pc => pc.close());
        window.dataChannels = {}; window.peers = {};
        if(window.roomListenerUnsub) { window.roomListenerUnsub(); window.roomListenerUnsub = null; }
        if(window.currentRoomId && window.isHost) { remove(ref(db, 'rooms/' + window.currentRoomId)).catch(e=>{}); }
        window.currentRoomId = null; window.isHost = false; window.peerConnectionStarted = false;
        document.getElementById('btn-start-match').disabled = false;
        document.getElementById('btn-start-match').innerText = "START MATCH";
    };
</script>

<script>
    // Character Profile Data Initialization
    const defaultProfile = {
        name: 'FIGHTER_' + Math.floor(Math.random()*999),
        hat: 'none',
        accessory: 'none',
        taunt: "Let's go!",
        emote: "0",
        finisher: "Goodnight!"
    };

    let storedProfile = localStorage.getItem('gg_profile');
    if (storedProfile) {
        window.playerProfile = JSON.parse(storedProfile);
    } else {
        window.playerProfile = { ...defaultProfile };
    }

    let tempProfile = {};
    let previewReq = null;
    let previewFighter = null;

    window.showProfileMenu = function() {
        document.getElementById('menu-primary').classList.add('hidden');
        document.getElementById('menu-profile').classList.remove('hidden');
        
        // Sync DOM
        tempProfile = { ...window.playerProfile };
        document.getElementById('profile-name-input').value = tempProfile.name;
        document.getElementById('profile-hat-input').value = tempProfile.hat;
        document.getElementById('profile-acc-input').value = tempProfile.accessory;
        document.getElementById('profile-taunt-input').value = tempProfile.taunt;
        document.getElementById('profile-emote-input').value = tempProfile.emote || "0";
        document.getElementById('profile-finisher-input').value = tempProfile.finisher;

        // Start Canvas Preview
        if(!previewFighter) previewFighter = new Fighter(0, tempProfile);
        previewFighter.x = 100; previewFighter.y = GROUND_Y; // Keep actual physical Y normal
        previewFighter.changeState(ST_TAUNT, 120);
        previewFighter.currentTaunt = parseInt(tempProfile.emote) || 0;
        
        drawPreviewLoop();
    };

    window.hideProfileMenu = function() {
        document.getElementById('menu-primary').classList.remove('hidden');
        document.getElementById('menu-profile').classList.add('hidden');
        if (previewReq) cancelAnimationFrame(previewReq);
        particles = []; // Clear preview particles so they don't bleed into game
        texts = [];
    };

    window.updatePreviewProfile = function() {
        tempProfile.name = document.getElementById('profile-name-input').value.trim() || 'FIGHTER';
        tempProfile.hat = document.getElementById('profile-hat-input').value;
        tempProfile.accessory = document.getElementById('profile-acc-input').value;
        tempProfile.taunt = document.getElementById('profile-taunt-input').value || defaultProfile.taunt;
        tempProfile.emote = document.getElementById('profile-emote-input').value;
        tempProfile.finisher = document.getElementById('profile-finisher-input').value || defaultProfile.finisher;

        if (previewFighter) {
            previewFighter.changeState(ST_TAUNT, 120);
            previewFighter.currentTaunt = parseInt(tempProfile.emote) || 0;
        }
    };

    window.saveProfile = function() {
        window.updatePreviewProfile();
        window.playerProfile = { ...tempProfile };
        window.playerProfile.name = window.playerProfile.name.toUpperCase();
        localStorage.setItem('gg_profile', JSON.stringify(window.playerProfile));
        hideProfileMenu();
    };

    function drawPreviewLoop() {
        if (document.getElementById('menu-profile').classList.contains('hidden')) return;
        const cvs = document.getElementById('previewCanvas');
        const cx = cvs.getContext('2d');
        
        cx.clearRect(0, 0, cvs.width, cvs.height);
        
        // Draw Pedestal
        cx.fillStyle = '#1e293b';
        cx.beginPath(); cx.ellipse(100, 260, 75, 18, 0, 0, Math.PI*2); cx.fill();
        
        previewFighter.profile = tempProfile;

        // Loop the emote animation
        if (previewFighter.stateTimer > 0) {
            previewFighter.stateTimer--;
        } else {
            previewFighter.changeState(ST_TAUNT, 120);
            previewFighter.currentTaunt = parseInt(tempProfile.emote) || 0;
        }

        previewFighter.tauntCooldown = 0; // Hide taunt CD bar in the preview
        previewFighter.updateAnimation(true);
        previewFighter.draw(cx, 260); // customGroundY = 260 renders the fighter gracefully into the tiny canvas
        
        // Draw Emote Particles in Preview
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; 
            p.x += p.vx; p.y += p.vy; 
            p.vy += (p.gravity !== undefined ? p.gravity : 0.8); 
            p.life -= (p.decay !== undefined ? p.decay : 0.035);
            cx.fillStyle = p.color; cx.globalAlpha = Math.max(0, p.life); 
            let s = p.size !== undefined ? p.size : 4;
            let previewY = p.y - (GROUND_Y - 260); // Adjust Y for preview canvas
            cx.beginPath(); cx.arc(p.x, previewY, s, 0, Math.PI*2); cx.fill();
            cx.globalAlpha = 1.0;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Draw Emote Texts in Preview
        for (let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; 
            t.y += t.vy; t.vy *= 0.92; t.life -= 0.015;
            cx.globalAlpha = Math.max(0, Math.min(1.0, t.life)); cx.fillStyle = t.color;
            cx.font = t.big ? "900 38px Oswald" : "900 24px Oswald"; cx.textAlign = "center";
            cx.strokeStyle = "rgba(0,0,0,0.9)"; cx.lineWidth = 6; 
            let textPreviewY = t.y - (GROUND_Y - 260); // Adjust Y for preview canvas
            cx.strokeText(t.text, t.x, textPreviewY); cx.fillText(t.text, t.x, textPreviewY);
            cx.globalAlpha = 1.0; if (t.life <= 0) texts.splice(i, 1);
        }

        previewReq = requestAnimationFrame(drawPreviewLoop);
    }

    window.showLobbyMenu = function() {
        document.getElementById('menu-primary').classList.add('hidden');
        document.getElementById('menu-lobby').classList.remove('hidden');
        document.getElementById('menu-lobby').classList.add('flex');
        document.getElementById('lobby-status').innerText = "";
        
        document.getElementById('lobby-waiting').classList.add('hidden');
        document.getElementById('lobby-waiting').classList.remove('flex');
        document.getElementById('lobby-options').classList.remove('hidden');
        document.getElementById('lobby-options').classList.add('flex');
        
        window.startLobbyListener(); 
    };

    window.hideLobbyMenu = function() {
        document.getElementById('menu-primary').classList.remove('hidden');
        document.getElementById('menu-lobby').classList.add('hidden');
        document.getElementById('menu-lobby').classList.remove('flex');
        window.stopLobbyListener();
    };

    window.cancelHosting = function() {
        window.cleanupNetworkConnections();
        document.getElementById('lobby-waiting').classList.add('hidden');
        document.getElementById('lobby-waiting').classList.remove('flex');
        document.getElementById('lobby-options').classList.remove('hidden');
        document.getElementById('lobby-options').classList.add('flex');
        window.startLobbyListener();
    };
</script>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const GROUND_Y = 620; // Lowered slightly to give more room for smash blast zones
    const GRAVITY = 0.8;

    const ST_IDLE = 0, ST_MOVE = 1, ST_DASH = 2, ST_BLOCK = 3;
    const ST_P_JAB = 4, ST_P_CROSS = 5, ST_P_HOOK = 6;
    const ST_HITSTUN = 7, ST_KNOCKDOWN = 8, ST_DODGE = 9, ST_PARRY = 10;
    const ST_KNEE = 11, ST_KICK = 12, ST_CLINCH_ATTEMPT = 13, ST_CLINCHED = 14;
    const ST_AERIAL_PUNCH = 15, ST_AERIAL_KICK = 16, ST_P_UPPERCUT = 17, ST_TAUNT = 18;
    const ST_SUPLEX = 19, ST_BEING_SUPLEXED = 20;

    const ATTACK_DATA = {
        [ST_P_JAB]:   { dmg: 4,  stamDmg: 10, stamCost: 15, reach: 95, windup: 14, active: 5, recov: 12, stun: 20, name: "JAB" },
        [ST_P_CROSS]: { dmg: 12, stamDmg: 20, stamCost: 20, reach: 70, windup: 22, active: 6, recov: 18, stun: 30, name: "CROSS" },
        [ST_P_HOOK]:  { dmg: 22, stamDmg: 40, stamCost: 35, reach: 60, windup: 35, active: 8, recov: 24, stun: 45, name: "HOOK", guardBreak: true },
        [ST_P_UPPERCUT]: { dmg: 16, stamDmg: 20, stamCost: 20, reach: 60, windup: 16, active: 8, recov: 22, stun: 30, name: "UPPERCUT", antiAir: true },
        [ST_KNEE]:    { dmg: 14, stamDmg: 25, stamCost: 20, reach: 50, windup: 14, active: 6, recov: 18, stun: 28, name: "KNEE" },
        [ST_KICK]:    { dmg: 18, stamDmg: 45, stamCost: 30, reach: 90, windup: 28, active: 8, recov: 25, stun: 40, name: "KICK", guardBreak: true, knockdown: true },
        [ST_CLINCH_ATTEMPT]: { dmg: 0, stamDmg: 0, stamCost: 35, reach: 45, windup: 12, active: 6, recov: 25, stun: 0, name: "CLINCH" },
        [ST_AERIAL_PUNCH]:   { dmg: 10, stamDmg: 15, stamCost: 15, reach: 75, windup: 12, active: 6, recov: 15, stun: 25, name: "AIR PUNCH" },
        [ST_AERIAL_KICK]:    { dmg: 16, stamDmg: 25, stamCost: 25, reach: 90, windup: 16, active: 8, recov: 20, stun: 30, name: "AIR KICK", guardBreak: true, knockdown: true }
    };

    // Logical Keys Mapping - Using unified keys since CPUs don't use keyboard, and online matches everyone plays locally on P1 inputs
    const KEYS_P1 = { left: ['a'], right: ['d'], block: ['s'], dash: ['shift'], jab: ['j'], cross: ['k'], hook: ['l'], uppercut: ['h'], jump: ['w', ' '], knee: ['u'], kick: ['i'], clinch: ['o'], clinchMash: [' '], taunt: ['t'] };
    
    let keysDown = {};
    window.addEventListener('keydown', e => { keysDown[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keysDown[e.key.toLowerCase()] = false; });
    function checkKey(keysArray, keyStateObj) { return keysArray ? keysArray.some(k => keyStateObj[k]) : false; }

    window.isOnlineGame = false;
    let syncTimer = 0;

    let particles = [];
    let texts = [];
    let screenShake = 0;
    let hitFlash = 0;

    function spawnParticles(x, y, color, count, speedMulti=1) {
        for(let i=0; i<count; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*25 * speedMulti, vy: (Math.random()-0.5)*25 * speedMulti - 4, life: 1.0, color: color });
    }
    
    // Advanced Particle Engine for Emotes
    function addParticle(x, y, vx, vy, color, life=1.0, decay=0.035, size=4, gravity=0.8) {
        particles.push({x, y, vx, vy, color, life, maxLife: life, decay, size, gravity});
    }

    function spawnText(x, y, txt, color, isBig=false, initialLife=1.0) { 
        texts.push({ x, y, text: txt, color, life: initialLife, maxLife: initialLife, big: isBig, vy: -1.5 }); 
    }

    class Fighter {
        constructor(index, profileData) {
            this.index = index;
            this.profile = profileData || { hat: 'none', accessory: 'none', taunt: '', emote: '0', finisher: '' };
            const colors = ['#3b82f6', '#ef4444', '#10b981', '#eab308'];
            this.color = colors[index % colors.length]; 
            
            this.maxHp = 100; this.hp = 100;
            this.maxStamina = 300; this.stamina = 300;
            this.feintCooldown = 0;
            this.tauntCooldown = 0;
            this.currentTaunt = 0;
            
            // Stock system for Smash mode
            this.stocks = window.currentMap && window.currentMap.type === 'smash' ? 3 : 1;
            this.respawning = 0;
            this.invincible = 0;
            this.isInvincibleSync = false;
            
            this.width = 50; this.height = 150;
            this.y = GROUND_Y;
            this.vx = 0; this.vy = 0;
            this.facing = (index % 2 === 0) ? 1 : -1;
            
            this.state = ST_IDLE;
            this.stateTimer = 0;
            this.hitboxActive = false;
            this.parryCooldown = 0;
            
            this.airJumps = 1;
            this.hasAirDashed = false;
            
            this.suplexVictim = null;
            this.suplexSuplexer = null;
            
            this.duckAmount = 0;
            this.targetDuck = 0;
            this.swayAmount = 0; 
            this.rotation = 0;
            this.kdRotVel = 0;
            this.groundOffset = 0;

            this.headOffset = {x: 0, y: -this.height + 15};
            this.gloveL = {x: 0, y: 0, targetX: 0, targetY: 0};
            this.gloveR = {x: 0, y: 0, targetX: 0, targetY: 0};
            this.footL = {x: 0, y: 0, targetX: 0, targetY: 0};
            this.footR = {x: 0, y: 0, targetX: 0, targetY: 0};
            
            this.resetTargets();
            this.gloveL.x = this.gloveL.targetX; this.gloveL.y = this.gloveL.targetY;
            this.gloveR.x = this.gloveR.targetX; this.gloveR.y = this.gloveR.targetY;
            this.footL.x = this.footL.targetX; this.footL.y = this.footL.targetY;
            this.footR.x = this.footR.targetX; this.footR.y = this.footR.targetY;
        }

        getIsGrounded() {
            if (!window.currentMap) return this.y >= GROUND_Y;
            let map = window.currentMap;
            // Check if standing on main stage
            if (this.x >= map.stage.x - 20 && this.x <= map.stage.x + map.stage.w + 20 && Math.abs(this.y - map.stage.y) < 1) return true;
            // Check if standing on any platform
            for (let p of map.platforms) {
                if (this.x >= p.x - 20 && this.x <= p.x + p.w + 20 && Math.abs(this.y - p.y) < 1) return true;
            }
            return false;
        }

        resetTargets() {
            this.gloveL.targetX = this.facing * 25; this.gloveL.targetY = -95;
            this.gloveR.targetX = this.facing * 5; this.gloveR.targetY = -105;
            this.footL.targetX = -15; this.footL.targetY = 0;
            this.footR.targetX = 15; this.footR.targetY = 0;
        }

        changeState(newState, timer) {
            this.state = newState;
            this.stateTimer = timer;
            this.hitboxActive = false;
        }

        parriedAttack(hitX, hitY) {
            spawnParticles(hitX, hitY, '#60a5fa', 50, 2.5); 
            spawnParticles(hitX, hitY, '#ffffff', 30, 3.0); 
            spawnText(this.x, this.y - 180, "DEFLECT", "#60a5fa", true);
            this.stamina = Math.min(this.maxStamina, this.stamina + 100);
            screenShake = 8;
        }

        gotParriedStun(incomingStamDmg) {
            this.stamina -= (incomingStamDmg * 2.5); 
            if (this.stamina <= 0) {
                this.stamina = 0;
                this.changeState(ST_HITSTUN, 100); 
                this.vx = -this.facing * 8;
                spawnText(this.x, this.y - 180, "POSTURE BROKEN!", "#dc2626", true);
            } else {
                this.changeState(ST_HITSTUN, 50); 
                this.vx = -this.facing * 5;
            }
        }

        takeDamage(dmg, stamDmg, stunFrames, isCounter, hitX, hitY, isUnblockable, causesKnockdown = false, isAntiAir = false) {
            if (this.state === ST_KNOCKDOWN || this.invincible > 0 || this.respawning > 0) return; // Keep taking hits only if not dead
            
            // Break grabs if hit by anything else
            if (this.state === ST_SUPLEX || this.state === ST_BEING_SUPLEXED || this.state === ST_CLINCHED) {
                if (this.suplexVictim) this.suplexVictim.changeState(ST_IDLE, 0);
                if (this.suplexSuplexer) this.suplexSuplexer.changeState(ST_IDLE, 0);
                this.suplexVictim = null; this.suplexSuplexer = null;
            }

            let finalDmg = dmg;
            screenShake = 6;
            let isAntiAirHit = isAntiAir && !this.getIsGrounded();

            if (this.state === ST_BLOCK && !isUnblockable && !isAntiAirHit) {
                finalDmg = Math.max(1, Math.floor(dmg * 0.3)); 
                this.stamina -= stamDmg; 
                
                if (this.stamina <= 0) {
                    this.stamina = 0;
                    spawnText(this.x, this.y - 180, "GUARD CRUSH!", "#facc15", true);
                    finalDmg = dmg; stunFrames = 50; screenShake = 10;
                } else {
                    spawnParticles(hitX, hitY, '#9ca3af', 20, 0.8);
                    this.changeState(ST_HITSTUN, 14);
                    this.vx = -this.facing * 3;
                    this.hp -= finalDmg; 
                    spawnText(hitX, hitY - 50, `BLOCK -${finalDmg}`, "#9ca3af");
                    if (this.hp <= 0) this.handleDeath();
                    return; 
                }
            }

            if (isUnblockable && (this.state === ST_BLOCK || this.state === ST_PARRY)) {
                spawnText(this.x, this.y - 200, "GUARD CRUSH!", "#ef4444", true);
                stunFrames += 20; screenShake = 15;
            }

            if (isAntiAirHit) {
                finalDmg = Math.floor(finalDmg * 1.5);
                stunFrames += 20;
                causesKnockdown = true; 
                spawnText(this.x, this.y - 200, "ANTI-AIR!", "#facc15", true);
                screenShake = 15;
            } else if (isCounter && !isUnblockable) {
                finalDmg = Math.floor(finalDmg * 1.5);
                stunFrames = Math.floor(stunFrames * 1.5);
                spawnText(this.x, this.y - 200, "COUNTER!", "#ef4444", true);
                screenShake = 12;
            }

            if (this.state !== ST_BLOCK && this.state !== ST_PARRY) {
                this.stamina -= stamDmg * 0.5; 
                if(this.stamina < 0) this.stamina = 0;
            }
            
            this.hp -= finalDmg;
            spawnParticles(hitX, hitY, '#ef4444', 40, 1.8);
            spawnText(hitX, hitY - 40, `-${finalDmg}`, "#fff", true);

            // Brutal hit flash for heavy damage
            if (finalDmg >= 15) {
                hitFlash = 0.6;
                spawnParticles(hitX, hitY, '#991b1b', 25, 3.0); // Extra blood
                screenShake += 8;
            }

            // Knockback Scaling
            let hpRatio = Math.max(0, (100 - this.hp) / 100);
            let kbMult = 1.0 + (hpRatio * 1.5); 

            if (this.hp <= 0) {
                this.handleDeath();
            } else if (causesKnockdown && (this.state !== ST_BLOCK || isUnblockable)) {
                this.changeState(ST_KNOCKDOWN, 65);
                this.vx = -this.facing * (12 * kbMult);
                this.vy = -10 * kbMult;
                this.kdRotVel = this.facing * (0.2 * kbMult); 
                screenShake = 18;
                spawnText(this.x, this.y - 180, "KNOCKDOWN!", "#facc15", true);
            } else {
                this.changeState(ST_HITSTUN, stunFrames);
                this.vx = -this.facing * ((isCounter || isAntiAirHit ? 10 : 5) * (1.0 + hpRatio * 0.5));
            }
        }
        
        handleDeath() {
            this.hp = 0; 
            this.changeState(ST_KNOCKDOWN, 999);
            this.vx = -this.facing * 15; this.vy = -18; 
            this.kdRotVel = this.facing * 0.4; 
            screenShake = 25;
            hitFlash = 0.8;
            if (window.currentMap && window.currentMap.type === 'smash' && this.stocks > 1) {
                this.respawning = 180; // 3 sec before drop
            }
        }

        updateLocal(fightersArray, isActive, keyMap, activeKeysDown, activePrevKeysDown) {
            let prevKeys = this.prevKeys || {};
            this.prevKeys = { ...activeKeysDown };

            // Handle Respawning Countdown
            if (this.respawning > 0) {
                this.respawning--;
                if (this.respawning === 0) {
                    if (this.stocks > 1) {
                        this.stocks--;
                        this.hp = this.maxHp;
                        this.stamina = this.maxStamina;
                        let map = window.currentMap;
                        this.x = map.stage.x + map.stage.w / 2 + (Math.random()-0.5)*300;
                        this.y = map.stage.y - 800; // Drop from sky
                        this.vx = 0; this.vy = 0;
                        this.changeState(ST_IDLE, 0);
                        this.invincible = 180; // 3 secs invuln
                        spawnParticles(this.x, this.y, this.color, 40, 2);
                        spawnText(this.x, this.y - 50, "RESPAWN", this.color, true, 2.0);
                    } else {
                        this.stocks = 0;
                    }
                }
                return; // Skip normal logic while dead/respawning
            }

            if (this.invincible > 0) this.invincible--;

            if (this.state === ST_BEING_SUPLEXED) {
                if (this.stateTimer > 0) this.stateTimer--;
                let suplexer = this.suplexSuplexer;
                if (!suplexer) { this.changeState(ST_IDLE, 0); return; } // Failsafe
                
                let elapsed = 90 - this.stateTimer;
                if (elapsed < 20) {
                    this.x = suplexer.x + suplexer.facing * 30;
                    this.y = suplexer.y;
                } else if (elapsed < 50) {
                    let progress = (elapsed - 20) / 30;
                    this.x = suplexer.x + suplexer.facing * (30 - progress * 90); 
                    this.y = suplexer.y - Math.sin(progress * Math.PI) * 140; 
                } else {
                    this.y = suplexer.y;
                }
                this.vx = 0; this.vy = 0;
                return; 
            }

            if (this.state === ST_SUPLEX) {
                if (this.stateTimer > 0) this.stateTimer--;
                let victim = this.suplexVictim;
                
                if (this.stateTimer === 40 && victim) { // Impact at elapsed 50
                    screenShake = 40;
                    hitFlash = 0.8;
                    spawnParticles(this.x - this.facing * 40, this.y, '#fff', 50, 3.5);
                    spawnParticles(this.x - this.facing * 40, this.y, '#ef4444', 20, 2.0);
                    spawnText(this.x - this.facing * 40, this.y - 50, "SLAM!", "#ef4444", true, 2.0);
                    
                    victim.hp -= 35;
                    if (victim.hp <= 0) victim.handleDeath();
                    else {
                        victim.changeState(ST_KNOCKDOWN, 80);
                        victim.vy = -16; 
                        victim.vx = -this.facing * 10;
                        victim.kdRotVel = (Math.random() - 0.5) * 0.8;
                    }
                } else if (this.stateTimer === 0) {
                    this.changeState(ST_IDLE, 0);
                    this.suplexVictim = null;
                }
                this.applyPhysics();
                return;
            }

            if (this.state === ST_KNOCKDOWN) { 
                this.applyPhysics(); 
                if (this.stateTimer < 999 && this.stateTimer > 0) {
                    this.stateTimer--;
                    if (this.stateTimer === 0 && this.hp > 0) {
                        this.changeState(ST_IDLE, 0);
                        this.vy = -8; 
                    }
                }
                return; 
            }
            
            // Dynamic Targeting (Closest alive enemy)
            let closest = null; let minDist = Infinity;
            fightersArray.forEach((f, i) => {
                if (i !== this.index && (f.hp > 0 || f.respawning > 0)) {
                    let d = Math.abs(f.x - this.x);
                    if (d < minDist) { minDist = d; closest = f; }
                }
            });

            let isGrounded = this.getIsGrounded();

            if (isGrounded && (this.state === ST_IDLE || this.state === ST_MOVE)) {
                this.stamina = Math.min(this.maxStamina, this.stamina + 1.8); 
            }

            if (isGrounded) {
                this.airJumps = 1;
                this.hasAirDashed = false;
            }

            if (this.parryCooldown > 0) this.parryCooldown--;
            if (this.feintCooldown > 0) this.feintCooldown--;
            if (this.tauntCooldown > 0) this.tauntCooldown--;

            if (isActive && (this.state === ST_IDLE || this.state === ST_MOVE || this.state === ST_BLOCK || this.state === ST_PARRY || this.state === ST_DASH || this.state === ST_TAUNT)) {
                if (closest && this.state !== ST_TAUNT && this.state !== ST_DASH) {
                    this.facing = closest.x > this.x ? 1 : -1;
                }
                
                let moving = false; let moveDir = 0;

                // Handle Taunts
                if (isGrounded && checkKey(keyMap.taunt, activeKeysDown) && !checkKey(keyMap.taunt, prevKeys) && (this.state === ST_IDLE || this.state === ST_MOVE)) {
                    if (this.tauntCooldown === 0) {
                        this.changeState(ST_TAUNT, 120); 
                        this.currentTaunt = parseInt(this.profile.emote) || 0;
                        this.tauntCooldown = 900; // 15s CD
                        if (this.profile.taunt) {
                            spawnText(this.x, this.y - 180, `"${this.profile.taunt}"`, this.color, true, 2.0);
                        }
                    } else {
                        spawnText(this.x, this.y - 120, "TAUNT CD!", "#a855f7", false);
                    }
                    return; 
                }
                
                if (isGrounded && checkKey(keyMap.block, activeKeysDown) && this.stamina > 5) {
                    if (this.state !== ST_BLOCK && this.state !== ST_PARRY) {
                        if (this.parryCooldown === 0) this.changeState(ST_PARRY, 15); 
                        else this.changeState(ST_BLOCK, 1); 
                    } else if (this.state === ST_PARRY && this.stateTimer === 0) {
                        this.changeState(ST_BLOCK, 1); 
                    } else if (this.state === ST_BLOCK) {
                        this.changeState(ST_BLOCK, 1); 
                    }
                    this.vx *= 0.5;
                } else {
                    if (this.state === ST_BLOCK || this.state === ST_PARRY) {
                        if (this.state === ST_BLOCK || this.stateTimer === 0) this.parryCooldown = 45; 
                        this.changeState(ST_IDLE, 0);
                    }

                    if (checkKey(keyMap.jump, activeKeysDown) && !checkKey(keyMap.jump, prevKeys) && this.stamina >= 20) {
                        if (isGrounded) {
                            this.vy = -18; this.stamina -= 20; isGrounded = false;
                            spawnParticles(this.x, this.y, '#555', 15);
                        } else if (this.airJumps > 0 && this.state !== ST_KNOCKDOWN && this.state !== ST_HITSTUN && !ATTACK_DATA[this.state]) {
                            this.vy = -16; this.stamina -= 20; this.airJumps--;
                            this.changeState(ST_IDLE, 0); 
                            spawnParticles(this.x, this.y, '#fff', 25, 1.5);
                            spawnText(this.x, this.y - 120, "DOUBLE JUMP", "#fff", false);
                        }
                    }

                    const moveSpeed = this.stamina < 20 ? 2.5 : 6.0;
                    if (checkKey(keyMap.left, activeKeysDown)) { this.vx = -moveSpeed; moving = true; moveDir = -1; }
                    else if (checkKey(keyMap.right, activeKeysDown)) { this.vx = moveSpeed; moving = true; moveDir = 1; }
                    else if (isGrounded) { this.vx *= 0.7; }

                    if (isGrounded) {
                        if (checkKey(keyMap.dash, activeKeysDown) && !checkKey(keyMap.dash, prevKeys) && !moving && this.stamina >= 15) {
                            this.stamina -= 15; this.changeState(ST_DODGE, 25); spawnParticles(this.x, this.y, '#aaa', 15);
                        }
                        else if (checkKey(keyMap.dash, activeKeysDown) && moving && this.stamina > 1) {
                            this.stamina -= 1; this.changeState(ST_DASH, 6); this.vx = moveDir * 14;
                            if(Math.random() < 0.4) spawnParticles(this.x, this.y, '#fff', 3);
                        }
                        else if (this.state !== ST_DASH && this.state !== ST_DODGE && this.state !== ST_TAUNT) {
                            if (moving) this.changeState(ST_MOVE, 1);
                            else if (Math.abs(this.vx) < 0.1) this.changeState(ST_IDLE, 0);
                        }
                    } else {
                        if (checkKey(keyMap.dash, activeKeysDown) && !checkKey(keyMap.dash, prevKeys) && !this.hasAirDashed && this.stamina >= 25 && this.state !== ST_KNOCKDOWN && this.state !== ST_HITSTUN && !ATTACK_DATA[this.state]) {
                            this.hasAirDashed = true;
                            this.stamina -= 25;
                            this.changeState(ST_DASH, 10);
                            this.vy = 0; 
                            this.vx = (moving ? moveDir : this.facing) * 16;
                            spawnParticles(this.x, this.y, '#60a5fa', 20, 2);
                            spawnText(this.x, this.y - 120, "AIR DASH", "#60a5fa", false);
                        }
                        else if (this.state === ST_MOVE || this.state === ST_DASH || this.state === ST_DODGE || this.state === ST_TAUNT) {
                            if (this.stateTimer === 0) this.changeState(ST_IDLE, 0);
                        }
                    }

                    if (this.stamina >= 10 && this.state !== ST_DODGE && this.state !== ST_TAUNT && this.state !== ST_DASH) {
                        let attack = null;
                        if (isGrounded) {
                            if (checkKey(keyMap.jab, activeKeysDown)) attack = ST_P_JAB;
                            else if (checkKey(keyMap.cross, activeKeysDown)) attack = ST_P_CROSS;
                            else if (checkKey(keyMap.hook, activeKeysDown)) attack = ST_P_HOOK;
                            else if (checkKey(keyMap.uppercut, activeKeysDown)) attack = ST_P_UPPERCUT;
                            else if (checkKey(keyMap.knee, activeKeysDown)) attack = ST_KNEE;
                            else if (checkKey(keyMap.kick, activeKeysDown)) attack = ST_KICK;
                        } else {
                            if (checkKey(keyMap.jab, activeKeysDown) || checkKey(keyMap.cross, activeKeysDown) || checkKey(keyMap.hook, activeKeysDown)) attack = ST_AERIAL_PUNCH;
                            else if (checkKey(keyMap.kick, activeKeysDown) || checkKey(keyMap.knee, activeKeysDown)) attack = ST_AERIAL_KICK;
                        }

                        if (attack) {
                            const data = ATTACK_DATA[attack];
                            if (this.stamina >= data.stamCost) {
                                this.stamina -= data.stamCost;
                                this.changeState(attack, data.windup + data.active + data.recov);
                                if (isGrounded) this.vx = this.facing * (attack === ST_P_HOOK || attack === ST_KICK ? 7 : 5);
                            } else { spawnText(this.x, this.y - 150, "NO STAMINA", "#888"); }
                        }
                    }
                }
            } else if (!isActive) {
                if (this.state === ST_MOVE || this.state === ST_BLOCK || this.state === ST_PARRY || this.state === ST_DASH || this.state === ST_TAUNT) this.changeState(ST_IDLE, 0);
                if (isGrounded) this.vx *= 0.7;
            }

            if (this.stateTimer > 0) {
                this.stateTimer--;
                
                if (this.stateTimer === 0) {
                    if (this.state === ST_DASH || this.state === ST_DODGE || this.state === ST_HITSTUN || this.state === ST_TAUNT || ATTACK_DATA[this.state]) {
                        this.changeState(ST_IDLE, 0);
                    } else if (this.state === ST_PARRY) {
                        if (checkKey(keyMap.block, activeKeysDown)) this.changeState(ST_BLOCK, 1);
                        else { this.changeState(ST_IDLE, 0); this.parryCooldown = 45; }
                    }
                }

                if (ATTACK_DATA[this.state]) {
                    if (isGrounded) this.vx *= 0.85;
                    const data = ATTACK_DATA[this.state];
                    const totalDur = data.windup + data.active + data.recov;
                    const elapsed = totalDur - this.stateTimer;

                    if (elapsed < data.windup && checkKey(keyMap.block, activeKeysDown) && !checkKey(keyMap.block, prevKeys)) {
                        if (this.feintCooldown === 0) {
                            this.changeState(ST_IDLE, 0);
                            this.stamina += data.stamCost * 0.5; 
                            spawnText(this.x, this.y - 120, "FEINT", "#cbd5e1");
                            spawnParticles(this.x, this.y - 80, '#cbd5e1', 15, 1.2);
                            this.feintCooldown = 120; 
                            return; 
                        } else {
                            spawnText(this.x, this.y - 120, "CD!", "#64748b", false);
                        }
                    }

                    if (elapsed === data.windup) this.hitboxActive = true;
                    else if (elapsed === data.windup + data.active) this.hitboxActive = false;

                    if (this.hitboxActive) {
                        let hitX = this.x + (this.facing * data.reach);
                        let hitY = this.y - 110;
                        if(this.state === ST_KNEE || this.state === ST_KICK) hitY += 35; 
                        else if(this.state === ST_P_UPPERCUT) hitY -= 40; 

                        // Loop through all enemies to check hits
                        fightersArray.forEach((enemy, i) => {
                            if (i !== this.index && (enemy.hp > 0 || enemy.respawning > 0)) {
                                let yDist = Math.abs(hitY - enemy.y + 75); 
                                let xDist = Math.abs(hitX - enemy.x);

                                if (xDist < enemy.width/2 + 35 && yDist < enemy.height/2 + 25) {
                                    if (enemy.state === ST_DODGE) {
                                        // Missed
                                    } else if (enemy.state === ST_TAUNT) {
                                        // TAUNT COUNTER -> SUPLEX
                                        this.hitboxActive = false;
                                        enemy.changeState(ST_SUPLEX, 90);
                                        this.changeState(ST_BEING_SUPLEXED, 90);
                                        
                                        enemy.suplexVictim = this;
                                        this.suplexSuplexer = enemy;
                                        
                                        this.x = enemy.x + enemy.facing * 30;
                                        
                                        spawnText(enemy.x, enemy.y - 200, "TAUNT COUNTER!", "#facc15", true, 2.0);
                                        screenShake = 15;
                                        addParticle(enemy.x, enemy.y - 100, 0, 0, '#facc15', 1.0, 0.05, 50, 0); 
                                    } else if (enemy.state === ST_PARRY && !data.guardBreak) { 
                                        this.hitboxActive = false;
                                        enemy.parriedAttack(hitX, hitY); 
                                        this.gotParriedStun(data.stamDmg); 
                                    } else {
                                        this.hitboxActive = false; 
                                        const isCounter = (ATTACK_DATA[enemy.state] && enemy.stateTimer > ATTACK_DATA[enemy.state].recov);
                                        enemy.takeDamage(data.dmg, data.stamDmg, data.stun, isCounter, hitX, hitY, data.guardBreak || false, data.knockdown || false, data.antiAir || false);
                                    }
                                }
                            }
                        });
                    }
                }
            }

            this.applyPhysics();
        }
        
        applyPhysics() {
            if(isNaN(this.x) || isNaN(this.y) || isNaN(this.vx) || isNaN(this.vy)) { this.x = W/2; this.y = window.currentMap ? window.currentMap.stage.y : GROUND_Y; this.vx = 0; this.vy = 0; }
            this.x += this.vx; this.y += this.vy;
            
            if (this.state === ST_KNOCKDOWN) {
                this.rotation += this.kdRotVel; 
            }

            let currentFloor = Infinity; 
            let map = window.currentMap;
            let prevY = this.y - this.vy;

            // Check Jump Pads First
            if (map && map.jumpPads && this.vy > 0 && this.state !== ST_DASH) {
                map.jumpPads.forEach(pad => {
                    if (this.x >= pad.x - 20 && this.x <= pad.x + pad.w + 20) {
                        if (prevY <= pad.y + 20 && this.y >= pad.y - 10) {
                            this.vy = -pad.boost;
                            this.y = pad.y;
                            if (this.state === ST_KNOCKDOWN) {
                                 this.changeState(ST_HITSTUN, 30); // Recover from knockdown
                            } else if (this.state !== ST_HITSTUN && !ATTACK_DATA[this.state]) {
                                 this.changeState(ST_IDLE, 0);
                            }
                            spawnParticles(this.x, pad.y, '#10b981', 20, 2.5);
                            spawnText(this.x, pad.y - 40, "BOING!", "#10b981", true, 1.2);
                            screenShake += 8;
                        }
                    }
                });
            }

            if (map) {
                // Check main stage
                if (this.x >= map.stage.x - 20 && this.x <= map.stage.x + map.stage.w + 20) {
                    if (prevY <= map.stage.y + 0.1 && this.y >= map.stage.y) {
                        currentFloor = map.stage.y;
                    }
                }
                
                // Check platforms
                map.platforms.forEach(p => {
                    if (this.x >= p.x - 20 && this.x <= p.x + p.w + 20) {
                        if (prevY <= p.y + 0.1 && this.y >= p.y) {
                            if (p.y < currentFloor) currentFloor = p.y;
                        }
                    }
                });
            } else if (this.y >= GROUND_Y && prevY <= GROUND_Y + 0.1) {
                currentFloor = GROUND_Y;
            }

            if (this.state === ST_DASH) {
                this.vy = 0; // Nullify gravity during dash
            } else if (this.y < currentFloor) {
                this.vy += GRAVITY; 
            } else if (currentFloor !== Infinity) {
                if (this.state === ST_KNOCKDOWN && this.vy > 4) {
                    screenShake = Math.max(screenShake, Math.min(30, this.vy * 2));
                    this.vy = -this.vy * 0.6; // Stronger ragdoll bounce
                    this.vx *= 0.7;
                    this.y = currentFloor;
                    this.kdRotVel = (Math.random() - 0.5) * 0.8; 
                    spawnParticles(this.x, currentFloor, '#aaa', 15, 1.5);
                    spawnParticles(this.x, currentFloor, '#ef4444', 10, 2.0); 
                } else {
                    if (this.y > currentFloor && this.vy > 0 && ATTACK_DATA[this.state] && this.state >= ST_AERIAL_PUNCH) this.changeState(ST_IDLE, 0); 
                    this.y = currentFloor; this.vy = 0;
                    
                    if (this.state === ST_KNOCKDOWN) {
                        this.vx *= 0.8;
                        let targetFlat = Math.round(this.rotation / (Math.PI/2)) * (Math.PI/2);
                        if (Math.abs(targetFlat % Math.PI) < 0.1) targetFlat += Math.PI/2; 
                        this.rotation += (targetFlat - this.rotation) * 0.2;
                        this.kdRotVel *= 0.8;
                    } else if(this.state !== ST_DASH) {
                        this.vx *= 0.8;
                    }

                    // Moving platform carry
                    if (this.state !== ST_DASH && this.state !== ST_KNOCKDOWN && map && map.platforms) {
                        map.platforms.forEach(p => {
                            if (currentFloor === p.y && this.x >= p.x - 20 && this.x <= p.x + p.w + 20 && p.vx) {
                                this.x += p.vx;
                            }
                        });
                    }
                }
            }

            // Walls (Boxing Mode only)
            if (map && map.walls) {
